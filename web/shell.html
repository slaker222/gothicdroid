<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpenGothic Web</title>
  <style>
    :root {
      --bg: #151515;
      --line: #3a3a3a;
      --text: #ddd;
      --dim: #999;
      --accent: #fff;
      --danger: #e5484d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #player {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    /* language bar above the player (only when the server has lang/languages.json) */
    #lang-bar {
      --lang-h: 40px;
      height: var(--lang-h);
      width: min(100vw, calc((100vh - 70px) * 16 / 9));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
      color: var(--dim);
    }
    #lang-bar[hidden] { display: none; }
    #lang-bar label { display: flex; align-items: center; gap: 6px; }
    #lang-bar label[hidden] { display: none; }
    #lang-bar select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 6px;
      font: inherit;
    }
    #lang-bar .btn { padding: 3px 12px; }
    #lang-note { overflow: hidden; text-overflow: ellipsis; }
    body.has-lang #player { width: min(100vw, calc((100vh - 70px) * 16 / 9)); }
    /* strip under the player: progress of a voice language download */
    #voice-bar { display: none; }
    body.has-lang #voice-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
      width: min(100vw, calc((100vh - 70px) * 16 / 9));
      padding: 0 4px;
      color: var(--dim);
      white-space: nowrap;
    }
    #voice-bar.idle { visibility: hidden; }
    #voice-track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    #voice-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    #player:fullscreen {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
    }

    /* window mode: the player takes the whole browser page, nothing else is shown */
    body.window-mode { overflow: hidden; }
    body.window-mode #player {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }
    body.window-mode > :not(#player):not(script) { display: none !important; }
    #win-btn .icon-exit { display: none; }
    body.window-mode #win-btn .icon-enter { display: none; }
    body.window-mode #win-btn .icon-exit { display: block; }

    /* the picture only grows sideways: never taller than 16:9 (portrait
       phones, window mode and fullscreen get bars above and below) */
    #player { container-type: size; }
    #canvas {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: min(100%, calc(100cqw * 9 / 16));
      transform: translateY(-50%);
      outline: none;
      border: none;
      background: #000;
      display: block;
    }

    #ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 16px 72px;
      text-align: center;
    }

    #ui-overlay.hidden { display: none; }
    #ui-overlay.drag-over { outline: 1px dashed var(--accent); outline-offset: -8px; }

    .status-box {
      min-height: 20px;
      color: var(--dim);
      word-break: break-word;
    }

    .progress-bar-container {
      width: min(320px, 70%);
      height: 2px;
      background: var(--line);
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
    }

    .source-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 52px;
      display: none;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 0;
      cursor: pointer;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .file-input { display: none; }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      height: 44px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      opacity: 0;
      transition: opacity 0.2s;
    }

    #player.active #controls,
    #player:not(.playing) #controls { opacity: 1; }

    .ctl {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 8px;
      font: 13px inherit;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
    }

    .ctl:hover { color: var(--accent); }
    .ctl-right, .ctl-left { display: flex; align-items: center; }
    .fps-opt { gap: 6px; user-select: none; }
    .fps-opt input { margin: 0; accent-color: var(--accent); cursor: pointer; }
    #fps-counter {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 15;
      padding: 2px 8px;
      font: 13px monospace;
      color: #5dff8a;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      display: none;
    }
    .ctl svg { width: 22px; height: 22px; fill: currentColor; }
    #fs-btn .icon-exit { display: none; }
    #player.menu-open #controls { opacity: 1; }
    /* touch controls ("Mobile input"): buttons send the game's keys */
    #touch-ui {
      position: absolute;
      inset: 0;
      container-type: size; /* sizes follow the player, not the browser window */
      z-index: 12;
      display: none;
      pointer-events: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body.touch-on #touch-ui { display: block; }
    /* a finger that stays down while the layout changes must not be taken over by the browser (pointercancel) */
    body.touch-on #canvas { touch-action: none; }
    /* touch mode: the player bar sits on top,
       compact, clear of the stick and the buttons; saves and delete only show
       in the game menu */
    body.touch-on #controls {
      top: 0;
      bottom: auto;
      height: 34px;
      padding: 0 4px;
      opacity: 1;
      background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
    }
    body.touch-on .ctl { height: 28px; padding: 0 5px; font-size: 11px; }
    body.touch-on .ctl svg { width: 18px; height: 18px; }
    body.touch-on #controls .ctl-left { visibility: hidden; }
    body.touch-on.touch-menu #controls .ctl-left { visibility: visible; }
    body.touch-on #settings-panel { top: 38px; bottom: auto; }
    #touch-look { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
    #touch-ui.no-look #touch-look { pointer-events: none; }
    .tbtn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--s, 13cqmin);
      height: var(--s, 13cqmin);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font: 600 clamp(10px, 2.6cqmin, 16px)/1.1 -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      text-shadow: 0 1px 2px #000;
      pointer-events: auto;
      touch-action: none;
    }
    .tbtn.big { --s: 19cqmin; font-size: clamp(12px, 3.2cqmin, 19px); background: rgba(120, 20, 10, 0.45); }
    .tbtn.huge { --s: 22.8cqmin; }
    .tbtn.small { --s: 10cqmin; font-size: clamp(9px, 2.2cqmin, 13px); }
    .tbtn.down { background: rgba(255, 255, 255, 0.35); }
    .tbtn.active { border-color: #fff; background: rgba(255, 255, 255, 0.2); }
    .tbtn svg { width: 52%; height: 52%; fill: none; stroke: currentColor; stroke-width: 2;
                stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px #000); }
    .tbtn.cheat { border-color: #f2c200; color: #ffe066; }
    .tbtn.hidden { display: none; }
    /* strike button: the arrows show the directions, the one struck lights up */
    .tbtn.strike svg { width: 86%; height: 86%; }
    .tbtn svg .ar { opacity: 0.45; }
    .tbtn[data-dir="l"] svg .ar.l, .tbtn[data-dir="u"] svg .ar.u, .tbtn[data-dir="r"] svg .ar.r
      { opacity: 1; stroke-width: 3.2; }
    /* quick panel: the weapons and spells of the number keys at the bottom (the icons are the game's own
       3D item pictures, drawn by the engine under these frames) */
    .tq-slot {
      position: absolute; box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.55); border-radius: 1.2cqmin;
      background: rgba(0, 0, 0, 0.3); pointer-events: none;
    }
    #tq-hit { position: absolute; pointer-events: auto; touch-action: none; }
    /* the inventory button: one more block of the quick row, always in its place */
    .tbtn.sq { border-radius: 1.2cqmin; border: 1px solid rgba(255, 255, 255, 0.55); background: rgba(0, 0, 0, 0.3); box-sizing: border-box; }
    .tbtn.sq.down { background: rgba(255, 255, 255, 0.3); }
    .tq-slot.empty { border-color: rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.18); }
    .tq-slot.on { border: 2px solid #ffd54a; background: rgba(255, 213, 74, 0.18); }
    .tq-slot.down { background: rgba(255, 255, 255, 0.3); }
    .tq-slot i { position: absolute; right: 3px; bottom: 1px; font: 700 clamp(9px, 2.4cqmin, 13px)/1 sans-serif; font-style: normal;
                 color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }
    .tq-slot span { position: absolute; left: 3px; top: 1px; font: 700 clamp(9px, 2.4cqmin, 13px)/1 sans-serif;
                    color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }
    /* the quest journal for the touch layout: under the inventory and character buttons */
    #tj {
      position: absolute;
      left: 4cqmin;
      top: calc(36px + 12.5cqmin);
      width: 46cqmin;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 1.6cqmin;
      color: #fff;
      font: 500 clamp(11px, 3cqmin, 15px)/1.25 -apple-system, 'Segoe UI', Roboto, sans-serif;
      pointer-events: auto;
      touch-action: pan-y;
      overflow: hidden;
    }
    #tj.hidden, #tj-open.hidden { display: none; }
    #tj .tj-head { display: flex; align-items: center; height: 7.5cqmin; padding-left: 2cqmin; }
    #tj .tj-title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tj button { all: unset; display: flex; align-items: center; justify-content: center; width: 7.5cqmin; height: 7.5cqmin; color: #fff; cursor: pointer; }
    #tj button.hidden { display: none; }
    #tj button svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #tj .tj-body { max-height: 24cqmin; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; border-top: 1px solid rgba(255, 255, 255, 0.25); }
    #tj .tj-row { height: 8cqmin; line-height: 8cqmin; padding: 0 2cqmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  border-top: 1px solid rgba(255, 255, 255, 0.12); cursor: pointer; }
    #tj .tj-row:first-child { border-top: 0; }
    #tj .tj-row:active { background: rgba(255, 255, 255, 0.18); }
    #tj .tj-entry { padding: 1.2cqmin 2cqmin; white-space: pre-wrap; }
    #tj .tj-sep { height: 0; border-top: 1px dashed rgba(255, 255, 255, 0.4); margin: 0 2cqmin; }
    /* closed: a wide, low arrow under the character button brings it back */
    #tj-open {
      position: absolute; left: 14cqmin; top: calc(36px + 12cqmin);
      width: 14cqmin; height: 5cqmin;
      display: flex; align-items: center; justify-content: center;
      border-radius: 1.6cqmin; border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.35); color: #fff; pointer-events: auto; touch-action: none;
    }
    #tj-open svg { width: 70%; height: 70%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #touch-stick {
      position: absolute;
      width: 26cqmin; height: 26cqmin;
      margin: -13cqmin 0 0 -13cqmin;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.2);
      pointer-events: none;
      display: none;
    }
    #touch-stick::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 11cqmin; height: 11cqmin;
      margin: -5.5cqmin 0 0 -5.5cqmin;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(var(--tx, 0px), var(--ty, 0px));
    }
    #touch-stick .stick-icon {
      position: absolute; left: 50%; top: 50%;
      width: 8cqmin; height: 8cqmin; margin: -4cqmin 0 0 -4cqmin;
      color: #fff; display: none; pointer-events: none;
    }
    #touch-stick .stick-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2;
                                   stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px #000); }
    /* sneaking learned: its icon sits on the stick (double tap switches it), gone while the stick is pulled */
    #touch-stick.sneak-known:not(.on) .stick-icon { display: block; }
    #touch-stick.sneaking .stick-icon { color: #ffd54a; }
    #touch-stick.on, #touch-stick.home { display: block; }
    #touch-stick.home:not(.on) { opacity: 0.6; }

    #gfx-toast {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      max-width: min(360px, calc(100% - 24px));
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid var(--line);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.6s, transform 0.6s;
      pointer-events: none;
    }
    #gfx-toast.show { opacity: 1; transform: none; }
    #settings-btn[aria-expanded="true"] { color: var(--accent); }
    #settings-panel {
      position: absolute;
      right: 8px;
      bottom: 48px;
      z-index: 25;
      width: 260px;
      max-width: calc(100% - 16px);
      padding: 10px 12px;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid var(--line);
      display: none;
    }
    #player.menu-open #settings-panel { display: block; }
    #settings-panel .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
      font-size: 13px;
    }
    #settings-panel select {
      font: inherit;
      color: var(--text);
      background: #222;
      border: 1px solid var(--line);
      padding: 2px 4px;
    }
    #settings-panel input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
    #settings-panel .set-note { margin-top: 6px; font-size: 12px; color: var(--dim); }
    #settings-panel.disabled .set-row { opacity: 0.45; pointer-events: none; }
    #player:fullscreen #fs-btn .icon-enter { display: none; }
    #player:fullscreen #fs-btn .icon-exit { display: block; }
  </style>
</head>
<body>
  <div id="lang-bar" hidden>
    <label>Game <select id="game-select" onchange="gameChosen()">
      <option value="g1">Gothic 1</option>
      <option value="g2">Gothic 2</option>
    </select></label>
    <label id="lang-text-label" hidden>Text language <select id="lang-text"></select></label>
    <label id="lang-voice-label" hidden>Voice language <select id="lang-voice"></select></label>
    <button class="btn" id="lang-apply" onclick="applyLanguages()" style="display:none">Apply</button>
    <span id="lang-note"></span>
  </div>
  <div id="player">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="ui-overlay">
      <div class="status-box" id="status-text">Loading...</div>
      <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <button class="btn" id="retry-btn" style="display:none;" onclick="downloadGame()">Download</button>

      <input type="file" id="folder-picker" class="file-input" webkitdirectory directory multiple onchange="onFolderSelected(event)">
      <input type="file" id="zip-picker" class="file-input" accept=".zip" onchange="onZipSelected(event)">

      <div class="source-row" id="source-row">
        <button class="btn" id="folder-btn" onclick="pickOffline('folder-picker')">Select folder</button>
        <button class="btn" id="zip-btn" onclick="pickOffline('zip-picker')">Select ZIP</button>
      </div>
    </div>

    <div id="fps-counter">0 FPS</div>

    <div id="touch-ui">
      <div id="touch-look"></div>
      <div id="touch-stick"></div>
    </div>
    <div id="gfx-toast" role="status" aria-live="polite"></div>

    <div id="settings-panel" class="disabled">
      <label class="set-row" title="Display refresh rate: no game limit, smooth (frames follow the monitor). Unlimited: for benchmarks, frames the monitor cannot show make motion uneven">FPS limit
        <select data-set="fpsUnlock">
          <option value="0">Game setting</option><option value="1">Display refresh rate</option>
          <option value="2">Unlimited (jerky)</option>
        </select>
      </label>
      <label class="set-row">Render resolution
        <select data-set="resScale">
          <option value="0">100%</option><option value="1">75%</option>
          <option value="2">50%</option><option value="3">40%</option>
          <option value="4">30%</option><option value="5">25%</option>
          <option value="6">20%</option><option value="7">15%</option>
        </select>
      </label>
      <label class="set-row" title="Pixels of the picture per screen pixel. Phones have 2.5-3.5: a lower value is much faster on them, especially in landscape. Auto keeps the picture to about one megapixel">Screen sharpness
        <select id="pixel-cap">
          <option value="-1">Auto</option><option value="0">Native</option>
          <option value="2">High (2x)</option><option value="1.5">Medium (1.5x)</option>
          <option value="1">Low (1x)</option>
        </select>
      </label>
      <label class="set-row">Shadows
        <select data-set="shadows">
          <option value="2">High</option><option value="1">Low</option><option value="0">Off</option>
        </select>
      </label>
      <label class="set-row">Object draw distance
        <select data-set="drawDist">
          <option value="0">Unlimited</option><option value="1">Far (150 m)</option>
          <option value="2">Medium (80 m)</option><option value="3">Near (40 m)</option>
          <option value="4">Nearest (20 m)</option>
        </select>
      </label>
      <label class="set-row">World draw distance
        <select data-set="worldDist">
          <option value="0">Unlimited</option><option value="500">500 m</option>
          <option value="300">300 m</option><option value="200">200 m</option>
          <option value="150">150 m</option><option value="100">100 m</option>
          <option value="80">80 m</option><option value="60">60 m</option>
          <option value="40">40 m</option><option value="30">30 m</option>
        </select>
      </label>
      <label class="set-row" title="NPCs beyond the object draw distance are not animated (their bones freeze until they come closer)">Skip hidden NPC animation <input type="checkbox" data-set="skipFarAnim"></label>
      <label class="set-row">Water reflections <input type="checkbox" data-set="reflections"></label>
      <label class="set-row">Ambient occlusion <input type="checkbox" data-set="ssao"></label>
      <div class="set-note" id="settings-note">Start the game to change settings.</div>
    </div>

    <div id="controls">
      <div class="ctl-left">
      <button class="ctl" id="clear-btn" style="display:none;" onclick="clearStorage()">Delete game</button>
      <button class="ctl" id="saves-dl-btn" onclick="downloadSaves()" title="Download all savegames as a ZIP archive">Download saves</button>
      <button class="ctl" id="saves-ul-btn" onclick="document.getElementById('saves-picker').click()" title="Add savegames from a ZIP archive or .sav files">Upload saves</button>
      <input type="file" id="saves-picker" class="file-input" accept=".zip,.sav" multiple onchange="onSavesPicked(event)">
      </div>
      <div class="ctl-right">
      <label class="ctl fps-opt" title="On-screen touch controls (turned on by itself on phones and tablets)"><input type="checkbox" id="touch-chk"> Mobile input</label>
      <label class="ctl fps-opt" title="Show FPS"><input type="checkbox" id="fps-chk"> Show FPS</label>
      <button class="ctl" id="settings-btn" aria-label="Graphics settings" title="Graphics settings" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
      <button class="ctl" id="win-btn" onclick="toggleWindowMode()" aria-label="Window mode" title="Window mode">
        <svg class="icon-enter" viewBox="0 0 24 24"><path d="M3 6h18v12H3V6zm2 2v8h14V8H5z"/></svg>
        <svg class="icon-exit" viewBox="0 0 24 24"><path d="M5 8h14v8H5V8zm2 2v4h10v-4H7z"/></svg>
      </button>
      <button class="ctl" id="fs-btn" onclick="toggleFullscreen()" aria-label="Fullscreen" title="Fullscreen">

  <!-- Install worker: downloads the game archive into OPFS (resumable) and
       unpacks ZIP archives into the OPFS game directory. Kept as text and
       started from a Blob URL so the page stays a single file. -->
  <script type="text/plain" id="install-worker-src">
'use strict';
const FLUSH_EVERY = 32 * 1024 * 1024;
const MAX_RETRIES = 8;
let root = null;

self.onmessage = async (e) => {
  const m = e.data;
  try {
    root = await navigator.storage.getDirectory();
    let result = null;
    if (m.type === 'download') {
      result = await download(m);
    } else if (m.type === 'chunks') {
      result = await installChunks(m);
    } else if (m.type === 'extract') {
      const blob = m.blob || await (await root.getFileHandle(m.zipName)).getFile();
      result = await extract(blob, m);
    }
    self.postMessage({ type: 'done', result });
  } catch (err) {
    self.postMessage({ type: 'error', name: err && err.name, msg: String(err && err.message || err) });
  }
};

function progress(o) { self.postMessage(Object.assign({ type: 'progress' }, o)); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function writeJsonSync(h, obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  h.truncate(0);
  h.write(bytes, { at: 0 });
  h.flush();
}

async function writeJson(name, obj) {
  const fh = await root.getFileHandle(name, { create: true });
  const h = await fh.createSyncAccessHandle();
  try { writeJsonSync(h, obj); } finally { h.close(); }
}

// ------------------------------ download ------------------------------
// Streams the archive into an OPFS file through a sync access handle, so
// every written byte is on disk: an interrupted download (network error,
// pause, closed tab) resumes with an HTTP Range request.

function totalFromResponse(resp, have) {
  if (resp.status === 206) {
    const cr = resp.headers.get('Content-Range') || '';
    const t = /\/(\d+)\s*$/.exec(cr);
    if (t) return +t[1];
    return have + (+resp.headers.get('Content-Length') || 0);
  }
  return +resp.headers.get('Content-Length') || 0;
}

async function download(m) {
  const fh = await root.getFileHandle(m.zipName, { create: true });
  const h = await fh.createSyncAccessHandle();
  try {
    let total = m.expectTotal || 0;
    let have = h.getSize();
    if (total && have === total) return { total };
    if (total && have > total) { h.truncate(0); have = 0; }

    let spaceChecked = false;
    for (let attempt = 0; ; attempt++) {
      try {
        const headers = have > 0 ? { Range: 'bytes=' + have + '-' } : {};
        const resp = await fetch(m.url, { cache: 'no-store', headers });
        if (resp.status === 416) {
          // range past the end: the remote file changed, start over
          h.truncate(0); have = 0; total = 0;
          throw new Error('HTTP 416');
        }
        if (!resp.ok) {
          const err = new Error('server responded with HTTP ' + resp.status);
          if (resp.status >= 400 && resp.status < 500) err.fatal = true;
          throw err;
        }
        const remoteTotal = totalFromResponse(resp, have);
        const rangeStart = /bytes\s+(\d+)-/.exec(resp.headers.get('Content-Range') || '');
        if (resp.status !== 206 || (rangeStart && +rangeStart[1] !== have) ||
            (total && remoteTotal && remoteTotal !== total)) {
          // no resume possible (or another file behind the URL): from scratch
          h.truncate(0); have = 0;
          if (resp.status === 206) {
            resp.body.cancel().catch(() => {});
            total = 0;
            continue;
          }
        }
        total = remoteTotal;
        writeJsonSync(await stateHandle(m), { url: m.url, total });

        if (!spaceChecked && total && navigator.storage.estimate) {
          spaceChecked = true;
          const est = await navigator.storage.estimate();
          // archive + unpacked files (~1.5x of compressed) live side by side
          const need = (total - have) + total * 1.5;
          const free = (est.quota || 0) - (est.usage || 0);
          if (est.quota && free < need) {
            resp.body.cancel().catch(() => {});
            const err = new Error('not enough browser storage: need ~' +
              Math.ceil(need / 1048576) + ' MB, available ' + Math.floor(free / 1048576) + ' MB');
            err.fatal = true;
            throw err;
          }
        }

        const reader = resp.body.getReader();
        let sinceFlush = 0, lastPost = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          h.write(value, { at: have });
          have += value.byteLength;
          sinceFlush += value.byteLength;
          if (sinceFlush >= FLUSH_EVERY) { h.flush(); sinceFlush = 0; }
          const now = performance.now();
          if (now - lastPost > 200) {
            lastPost = now;
            progress({ phase: 'download', done: have, total });
          }
        }
        h.flush();
        if (total && have < total) throw new Error('connection lost');
        progress({ phase: 'download', done: have, total: total || have });
        return { total: total || have };
      } catch (err) {
        h.flush();
        if (err.fatal || attempt >= MAX_RETRIES) throw err;
        progress({ phase: 'retry', attempt: attempt + 1, max: MAX_RETRIES, msg: String(err.message || err) });
        await sleep(Math.min(15000, 1500 * (attempt + 1)));
        have = h.getSize();
      }
    }
  } finally {
    h.close();
    if (stateH) { stateH.close(); stateH = null; }
  }
}

let stateH = null;
async function stateHandle(m) {
  if (!stateH) {
    const fh = await root.getFileHandle(m.stateName, { create: true });
    stateH = await fh.createSyncAccessHandle();
  }
  return stateH;
}

// ------------------------------ extract ------------------------------

const CRC_TABLE = (() => {
  const t = new Int32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();

function crc32(crc, buf) {
  let c = ~crc;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return ~c;
}

async function readAt(blob, pos, len) {
  return new DataView(await blob.slice(pos, pos + len).arrayBuffer());
}

function u64(dv, off) { return Number(dv.getBigUint64(off, true)); }

async function readCentralDirectory(blob) {
  const size = blob.size;
  const tailLen = Math.min(size, 65535 + 22);
  const tail = await readAt(blob, size - tailLen, tailLen);
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) {
    if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a ZIP archive (corrupt or incomplete)');
  let count = tail.getUint16(eocd + 10, true);
  let cdSize = tail.getUint32(eocd + 12, true);
  let cdOff = tail.getUint32(eocd + 16, true);
  if (count === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    const loc = eocd - 20;
    if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('corrupt ZIP64 archive');
    const z = await readAt(blob, u64(tail, loc + 8), 56);
    if (z.getUint32(0, true) !== 0x06064b50) throw new Error('corrupt ZIP64 archive');
    count = u64(z, 32); cdSize = u64(z, 40); cdOff = u64(z, 48);
  }

  const cd = await readAt(blob, cdOff, cdSize);
  const bytes = new Uint8Array(cd.buffer);
  const utf8 = new TextDecoder('utf-8');
  const dos = new TextDecoder('ibm866');
  const entries = [];
  let p = 0;
  for (let i = 0; i < count; i++) {
    if (cd.getUint32(p, true) !== 0x02014b50) throw new Error('corrupt ZIP directory');
    const flags = cd.getUint16(p + 8, true);
    const method = cd.getUint16(p + 10, true);
    const crc = cd.getInt32(p + 16, true);
    let compSize = cd.getUint32(p + 20, true);
    let size = cd.getUint32(p + 24, true);
    const nameLen = cd.getUint16(p + 28, true);
    const extraLen = cd.getUint16(p + 30, true);
    const commentLen = cd.getUint16(p + 32, true);
    let localOff = cd.getUint32(p + 42, true);
    const nameBytes = bytes.subarray(p + 46, p + 46 + nameLen);
    const name = ((flags & 0x800) ? utf8 : dos).decode(nameBytes);
    // ZIP64 extended information: only the saturated fields are present
    let x = p + 46 + nameLen;
    const xEnd = x + extraLen;
    while (x + 4 <= xEnd) {
      const id = cd.getUint16(x, true), len = cd.getUint16(x + 2, true);
      if (id === 0x0001) {
        let q = x + 4;
        if (size === 0xffffffff) { size = u64(cd, q); q += 8; }
        if (compSize === 0xffffffff) { compSize = u64(cd, q); q += 8; }
        if (localOff === 0xffffffff) { localOff = u64(cd, q); q += 8; }
      }
      x += 4 + len;
    }
    entries.push({ name: name.replace(/\\/g, '/').replace(/^\/+/, ''), flags, method, crc, compSize, size, localOff });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

// The archive may wrap the game into one or more folders ("game/Data/...").
// The game root is the folder holding Data/ closest to the archive root.
function findGameRoot(entries) {
  let best = null;
  for (const e of entries) {
    const parts = e.name.split('/');
    for (let i = 0; i < parts.length - 1; i++) {
      if (/^data$/i.test(parts[i])) {
        if (best === null || i < best.length) best = parts.slice(0, i);
        break;
      }
    }
  }
  if (best === null) throw new Error('no Data folder in the archive: not a Gothic game archive');
  return best.length ? best.join('/') + '/' : '';
}

async function extract(blob, m) {
  const all = await readCentralDirectory(blob);
  const prefix = findGameRoot(all);
  const list = [];
  for (const e of all) {
    if (e.name.endsWith('/')) continue;
    if (prefix && e.name.slice(0, prefix.length).toLowerCase() !== prefix.toLowerCase()) continue;
    const rel = e.name.slice(prefix.length);
    if (!rel || rel.split('/').some(s => s === '..' || s === '.')) continue;
    if (m.skip.some(re => re.test(rel))) continue;
    if (e.method !== 0 && e.method !== 8) throw new Error('unsupported compression method ' + e.method + ': ' + rel);
    if (e.flags & 1) throw new Error('encrypted ZIP archives are not supported');
    list.push(Object.assign(e, { rel }));
  }
  if (list.length === 0) throw new Error('no game files in the archive');

  const gameDir = await root.getDirectoryHandle(m.gameDirName, { create: true });
  const dirs = new Map([['', gameDir]]);
  async function dirFor(parts) {
    let key = '', d = gameDir;
    for (const seg of parts) {
      key = key ? key + '/' + seg : seg;
      let next = dirs.get(key.toLowerCase());
      if (!next) {
        next = await d.getDirectoryHandle(seg, { create: true });
        dirs.set(key.toLowerCase(), next);
      }
      d = next;
    }
    return d;
  }

  const totalComp = list.reduce((a, e) => a + e.compSize, 0);
  let doneComp = 0, doneBytes = 0, lastPost = 0, n = 0;
  for (const e of list) {
    n++;
    const parts = e.rel.split('/');
    const fname = parts.pop();
    const d = await dirFor(parts);
    // savegames and settings made in the browser win over the archive copies
    if (m.persisted.some(re => re.test(e.rel))) {
      let exists = true;
      try { await d.getFileHandle(fname, { create: false }); } catch (_) { exists = false; }
      if (exists) { doneComp += e.compSize; continue; }
    }

    const lh = await readAt(blob, e.localOff, 30);
    if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('corrupt ZIP archive: ' + e.rel);
    const dataOff = e.localOff + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);

    const fh = await d.getFileHandle(fname, { create: true });
    const h = await fh.createSyncAccessHandle();
    try {
      h.truncate(0);
      let stream = blob.slice(dataOff, dataOff + e.compSize).stream();
      if (e.method === 8) stream = stream.pipeThrough(new DecompressionStream('deflate-raw'));
      const reader = stream.getReader();
      let pos = 0, crc = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        h.write(value, { at: pos });
        crc = crc32(crc, value);
        pos += value.byteLength;
        const now = performance.now();
        if (now - lastPost > 200) {
          lastPost = now;
          const part = e.size ? Math.min(1, pos / e.size) : 1;
          progress({ phase: 'extract', done: doneComp + e.compSize * part, total: totalComp,
                     index: n, count: list.length, name: e.rel });
        }
      }
      if (pos !== e.size || crc !== e.crc)
        throw new Error('corrupt file in the archive (checksum mismatch): ' + e.rel);
      h.flush();
    } finally {
      h.close();
    }
    doneComp += e.compSize;
    doneBytes += e.size;
  }
  progress({ phase: 'extract', done: totalComp, total: totalComp, index: list.length, count: list.length, name: '' });
  if (m.deleteZip) {
    try { await root.removeEntry(m.zipName); } catch (_) {}
  }
  return { files: list.length, bytes: doneBytes };
}

// --------------------------- chunked install ---------------------------
// manifest.json + self-contained chunks made by tools/pack_web.py. Up to
// CHUNK_JOBS chunks download at once and each one is unpacked the moment it
// arrives, so unpacking hides behind the download. Finished chunks are
// recorded in the state file: an interrupted install resumes chunk-wise.

const CHUNK_JOBS = 4;

// mirrors that failed are tried last by every later request
const hostFailures = new Map();
function failuresOf(url) { return hostFailures.get(new URL(url).host) || 0; }

// Fetches from the first mirror that works. A failed request switches to the
// next mirror right away; only after all of them failed it waits and retries.
// A mirror answering 4xx does not have the file and is dropped.
async function fetchMirrors(urls, what, consume) {
  const live = [...new Set(urls)].sort((a, b) => failuresOf(a) - failuresOf(b));
  for (let attempt = 0, round = 0; ; attempt++) {
    const url = live[attempt % live.length];
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) {
        const err = new Error('server responded with HTTP ' + resp.status + ' (' + what + ')');
        if (resp.status >= 400 && resp.status < 500) err.fatal = true;
        throw err;
      }
      return await consume(resp, url);
    } catch (err) {
      const host = new URL(url).host;
      hostFailures.set(host, (hostFailures.get(host) || 0) + 1);
      if (err.fatal && live.length > 1) {
        live.splice(live.indexOf(url), 1);
        attempt--;
        continue;
      }
      if ((attempt + 1) % live.length !== 0) continue;
      if (err.fatal || ++round > MAX_RETRIES) throw err;
      progress({ phase: 'retry', attempt: round, max: MAX_RETRIES, msg: String(err.message || err) });
      await sleep(Math.min(15000, 1500 * round));
    }
  }
}

function toHex(buf) {
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function installChunks(m) {
  let manifestUrl = m.urls[0];
  const man = await fetchMirrors(m.urls, 'manifest', (r, url) => { manifestUrl = url; return r.json(); });
  if (man.version !== 1) {
    const err = new Error('unsupported manifest version ' + man.version);
    err.fatal = true;
    throw err;
  }
  const names = man.chunks.map(c => c.name);

  const stateFh = await root.getFileHandle(m.stateName, { create: true });
  const stateH = await stateFh.createSyncAccessHandle();
  let state = null;
  try {
    const buf = new Uint8Array(stateH.getSize());
    stateH.read(buf, { at: 0 });
    state = JSON.parse(new TextDecoder().decode(buf));
  } catch (_) {}
  // a different pack behind the link: start over
  if (!state || state.url !== m.urls[0] || JSON.stringify(state.names) !== JSON.stringify(names))
    state = { url: m.urls[0], names, done: [], created: [] };
  const done = new Set(state.done);

  const gameDir = await root.getDirectoryHandle(m.gameDirName, { create: true });
  const dirs = new Map([['', gameDir]]);
  async function dirFor(parts) {
    let key = '', d = gameDir;
    for (const seg of parts) {
      key = key ? key + '/' + seg : seg;
      let next = dirs.get(key.toLowerCase());
      if (!next) {
        next = await d.getDirectoryHandle(seg, { create: true });
        dirs.set(key.toLowerCase(), next);
      }
      d = next;
    }
    return d;
  }

  const wanted = man.files.map(f => !f.path.split('/').some(s => s === '' || s === '.' || s === '..') &&
                                      !m.skip.some(re => re.test(f.path)));
  const totalBytes = man.files.reduce((a, f, i) => a + (wanted[i] ? f.size : 0), 0);
  if (navigator.storage.estimate) {
    const est = await navigator.storage.estimate();
    const free = (est.quota || 0) - (est.usage || 0);
    if (est.quota && free < totalBytes) {
      const err = new Error('not enough browser storage: need ~' + Math.ceil(totalBytes / 1048576) +
                            ' MB, available ' + Math.floor(free / 1048576) + ' MB');
      err.fatal = true;
      throw err;
    }
  }

  // one sync access handle per file, shared by all chunks writing into it
  // (handles are exclusive); null = file is skipped
  const handles = new Map();
  // the file handles stay referenced: Chrome never settles createSyncAccessHandle()
  // when its file handle gets garbage-collected meanwhile (chunk buffers churn the GC)
  const fileHandles = [];
  function handleFor(fi) {
    if (!handles.has(fi)) handles.set(fi, (async () => {
      const f = man.files[fi];
      if (!wanted[fi]) return null;
      const parts = f.path.split('/');
      const fname = parts.pop();
      const d = await dirFor(parts);
      // savegames and settings made in the browser win over the pack copies
      if (m.persisted.some(re => re.test(f.path)) && !state.created.includes(f.path)) {
        let exists = true;
        try { await d.getFileHandle(fname, { create: false }); } catch (_) { exists = false; }
        if (exists) return null;
        state.created.push(f.path);
      }
      const fh = await d.getFileHandle(fname, { create: true });
      fileHandles.push(fh);
      // after a page reload the previous page may still hold the file for a moment
      let h;
      for (let tries = 0; ; tries++) {
        try { h = await fh.createSyncAccessHandle(); break; }
        catch (e) {
          if (e.name !== 'NoModificationAllowedError' || tries >= 40) throw e;
          await sleep(250);
        }
      }
      if (h.getSize() !== f.size) h.truncate(f.size);
      return h;
    })());
    return handles.get(fi);
  }

  const pieces = man.chunks.map(() => []);
  for (const p of man.pieces) pieces[p.chunk].push(p);

  const total = man.chunks.reduce((a, c) => a + c.size, 0);
  let have = man.chunks.reduce((a, c) => a + (done.has(c.name) ? c.size : 0), 0);
  let lastPost = 0;
  function count(n) {
    have += n;
    const now = performance.now();
    if (now - lastPost > 200) {
      lastPost = now;
      progress({ phase: 'download', done: have, total });
    }
  }

  async function installChunk(ci) {
    const c = man.chunks[ci];
    // next to the manifest, in the mirror folders of the pack, then the
    // chunk's own links (tools/mirrorhost_mirror.py)
    const urls = [manifestUrl, ...(man.bases || [])].map(b => new URL(c.name, b).href).concat(c.mirrors || []);
    const data = await fetchMirrors(urls, c.name, async (resp) => {
      const buf = new Uint8Array(c.size);
      let at = 0;
      try {
        const reader = resp.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          if (at + value.byteLength > c.size) throw new Error('unexpected size of ' + c.name);
          buf.set(value, at);
          at += value.byteLength;
          count(value.byteLength);
        }
        if (at !== c.size) throw new Error('connection lost');
        if (toHex(await crypto.subtle.digest('SHA-256', buf)) !== c.sha256)
          throw new Error('corrupt download: ' + c.name);
      } catch (err) {
        count(-at);
        throw err;
      }
      return buf;
    });

    const touched = new Set();
    for (const p of pieces[ci]) {
      const h = await handleFor(p.file);
      if (!h) continue;
      let raw = data.subarray(p.off, p.off + p.len);
      if (p.method === 'deflate-raw') raw = await inflateRaw(raw);
      if (raw.byteLength !== p.raw || (crc32(0, raw) >>> 0) !== p.crc)
        throw new Error('corrupt pack: ' + man.files[p.file].path);
      h.write(raw, { at: p.at });
      touched.add(h);
    }
    for (const h of touched) h.flush();
    done.add(c.name);
    state.done = [...done];
    writeJsonSync(stateH, state);
  }

  try {
    // chunks start in pack order (core game data first), CHUNK_JOBS at a time
    const todo = man.chunks.map((c, i) => i).filter(i => !done.has(man.chunks[i].name));
    let next = 0;
    async function lane() {
      while (next < todo.length) await installChunk(todo[next++]);
    }
    await Promise.all(Array.from({ length: Math.min(CHUNK_JOBS, todo.length) }, lane));
    progress({ phase: 'download', done: total, total });

    // files no chunk wrote into (empty ones) still have to exist (a finished pack has them)
    if (todo.length) for (let fi = 0; fi < man.files.length; fi++) await handleFor(fi);
  } finally {
    for (const p of handles.values()) {
      const h = await p.catch(() => null);
      if (h) h.close();
    }
    stateH.close();
  }
  return { files: wanted.filter(Boolean).length, bytes: totalBytes, download: total };
}

    // before the module is instantiated binds them to undefined for good, so
    // nothing is called until the runtime is up.
    function ogGet(name) {
      if (!g_runtimeUp) return -1;
      return Module.ccall('og_setting_get', 'number', ['string'], [name]);
    }
    function ogSet(name, value) {
      if (!g_runtimeUp) return 0;
      return Module.ccall('og_setting_set', 'number', ['string', 'number'], [name, value]);
    }

    var Module = {
      noInitialRun: true,
      preRun: [],
      postRun: [function() {
        console.log("OpenGothic WebAssembly core ready.");
        bindErrnoError();
        g_runtimeUp = true;
        g_resolveRuntime();
      }],
      print: function(text) {
        console.log("[OpenGothic] " + text);
      },
      printErr: function(text) {
        console.error("[OpenGothic] " + text);
      },
      canvas: (function() {
        return canvas;
      })(),
      setStatus: function(text) {
        if (!text || window.__ogFatal) return; // a fatal message stays on the screen
        statusText.innerText = text;
        const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        if (m) {
          progressContainer.style.display = 'block';
          const loaded = parseFloat(m[2]);
          const total = parseInt(m[4]);
          const percent = Math.min(100, Math.round((loaded / total) * 100));
          progressBar.style.width = percent + '%';
        }
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Loading...' : 'Loading...');
      }
    };

    Module.setStatus('Loading...');

    window.onerror = function(event) {
      statusText.style.color = 'var(--danger)';
      statusText.innerText = 'Error: ' + event;
    };

    // Esc must reach the game instead of leaving fullscreen: Keyboard Lock
    // (Chromium) delivers it to the page; holding Esc still exits.
    function lockEscape() {
      try {
        if (navigator.keyboard && navigator.keyboard.lock) {
          navigator.keyboard.lock(['Escape']).catch(() => {});
        }
      } catch (e) {}
    }
    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) lockEscape();
      else if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
    });

    // FPS counter: counts the frames the engine renders (one canvas texture
    // per frame), so it stays right when frames are not tied to the display
    (function() {
      const chk = document.getElementById('fps-chk');
      const box = document.getElementById('fps-counter');
      let frames = 0, last = performance.now(), timer = 0;
      // frame stats shared with the automatic graphics settings
      const stats = window.ogFrameStats = { count: 0, last: 0, maxGap: 0 };
      if (window.GPUCanvasContext) {
        const orig = GPUCanvasContext.prototype.getCurrentTexture;
        GPUCanvasContext.prototype.getCurrentTexture = function() {
          frames++;
          const now = performance.now();
          if (stats.last) stats.maxGap = Math.max(stats.maxGap, now - stats.last);
          stats.last = now;
          stats.count++;
          return orig.apply(this, arguments);
        };
      }
      function tick() {
        const now = performance.now();
        box.textContent = Math.round(frames * 1000 / (now - last)) + ' FPS';
        frames = 0; last = now;
      }
      function apply() {
        box.style.display = chk.checked ? 'block' : 'none';
        try { localStorage.setItem('showFps', chk.checked ? '1' : '0'); } catch (e) {}
        clearInterval(timer);
        if (chk.checked) {
          frames = 0; last = performance.now();
          timer = setInterval(tick, 500);
        }
      }
      try { chk.checked = localStorage.getItem('showFps') === '1'; } catch (e) {}
      chk.addEventListener('change', apply);
      // keep clicks on the option from reaching the game canvas
      chk.addEventListener('click', e => e.stopPropagation());
      apply();
    })();

    // graphics settings menu: values live in the game's Gothic.ini, changes
    // apply at once (between frames) and are saved
    (function() {
      const btn   = document.getElementById('settings-btn');
      const panel = document.getElementById('settings-panel');
      const note  = document.getElementById('settings-note');
      const inputs = panel.querySelectorAll('[data-set]');
      // the engine answers once the game window exists
      const ready = () => ogGet('shadows') >= 0;
      function load() {
        let ok = false, err = '';
        try { ok = ready(); }
        catch (e) { ok = false; err = String((e && (e.message || e.name)) || e); console.warn('[settings] unavailable:', e); }
        panel.classList.toggle('disabled', !ok);
        note.textContent = ok ? 'Changes apply immediately and are saved.' :
                           err ? 'Settings are unavailable: ' + err : 'Start the game to change settings.';
        if (!ok) return;
        inputs.forEach(el => {
          const v = ogGet(el.dataset.set);
          if (el.type === 'checkbox') el.checked = v !== 0; else el.value = String(v);
        });
      }
      // the game may still be starting when the menu opens: check again while it is open
      let retry = 0;
      function setOpen(open) {
        player.classList.toggle('menu-open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        clearInterval(retry);
        if (!open) return;
        load();
        retry = setInterval(() => {
          if (!player.classList.contains('menu-open')) { clearInterval(retry); return; }
          if (panel.classList.contains('disabled')) load(); else clearInterval(retry);
        }, 1000);
      }
      btn.addEventListener('click', e => {
        e.stopPropagation();
        // the game holds the mouse while playing: clicks would go to it, not to the menu
        if (document.pointerLockElement) document.exitPointerLock();
        setOpen(!player.classList.contains('menu-open'));
      });
      window.ogSettingsReload = () => { if (player.classList.contains('menu-open')) load(); };
      inputs.forEach(el => el.addEventListener('change', () => {
        // the player chose: automatic settings leave the graphics alone from now on
        try { localStorage.setItem('gfxManual', '1'); } catch (e) {}
        const v = el.type === 'checkbox' ? (el.checked ? 1 : 0) : parseInt(el.value, 10);
        try { ogSet(el.dataset.set, v); } catch (e) {}
        el.blur(); // arrow keys go back to the game
      }));
      panel.addEventListener('click', e => e.stopPropagation());
      // a click on the game closes the menu
      canvas.addEventListener('mousedown', () => setOpen(false));
    })();

    // screen sharpness: the engine reads window.__ogPixelCap when it sizes the canvas
    // buffer and resizes by itself when the value changes
    (function() {
      const sel = document.getElementById('pixel-cap');
      let v = -1;
      try { const s = localStorage.getItem('pixelCap'); if (s !== null && !isNaN(parseFloat(s))) v = parseFloat(s); } catch (e) {}
      window.__ogPixelCap = v;
      sel.value = String(v);
      sel.addEventListener('change', () => {
        window.__ogPixelCap = parseFloat(sel.value);
        try { localStorage.setItem('pixelCap', sel.value); } catch (e) {}
        sel.blur();
      });
    })();

    // Automatic graphics settings: when the game runs below 25 fps, quality is
    // lowered one step at a time (least visible first, resolution last) until
    // it reaches 35 fps. Never raised again automatically; a setting changed
    // by the player in the menu turns this off.
    (function() {
      const LOW = 25, TARGET = 35, WINDOW = 3000, SETTLE = 2000;
      const get = ogGet;
      const set = ogSet;
      // Quality levels, each one lowers several settings a little (medium
      // shadows and medium distance beat one setting at its lowest) down to the
      // minimum; the resolution goes last. Values are "at least this low":
      // a setting the player already has lower is kept.
      // shadows: 2 high .. 0 off; reflections/ssao: 1 on; distances: higher = nearer
      // worldDist is in meters (0 = no limit)
      const levels = [
        { shadows: 1, drawDist: 1, worldDist: 0,   reflections: 1, ssao: 1, resScale: 0 },
        { shadows: 1, drawDist: 2, worldDist: 500, reflections: 0, ssao: 1, resScale: 0 },
        { shadows: 0, drawDist: 2, worldDist: 300, reflections: 0, ssao: 0, resScale: 0 },
        { shadows: 0, drawDist: 3, worldDist: 150, reflections: 0, ssao: 0, resScale: 0 },
        { shadows: 0, drawDist: 4, worldDist: 80,  reflections: 0, ssao: 0, resScale: 0 },
        { shadows: 0, drawDist: 4, worldDist: 30,  reflections: 0, ssao: 0, resScale: 0 },
        { shadows: 0, drawDist: 4, worldDist: 30,  reflections: 0, ssao: 0, resScale: 1 },
        { shadows: 0, drawDist: 4, worldDist: 30,  reflections: 0, ssao: 0, resScale: 2 },
        { shadows: 0, drawDist: 4, worldDist: 30,  reflections: 0, ssao: 0, resScale: 3 },
      ];
      // lower = smaller value for these, bigger value for the rest
      const lowerIsLess = { shadows: 1, reflections: 1, ssao: 1, worldDist: 1 };
      const names = { shadows: 'shadows', drawDist: 'draw distance', worldDist: 'world draw distance',
                      reflections: 'water reflections', ssao: 'ambient occlusion', resScale: 'resolution' };
      // applies a level; the names of the settings it lowered
      function applyLevel(lv) {
        const changed = [];
        for (const k in lv) {
          const cur = get(k), want = lv[k];
          // a world distance of 0 is "no limit", the farthest
          const lower = k === 'worldDist' ? want > 0 && (cur === 0 || want < cur)
                                          : lowerIsLess[k] ? want < cur : want > cur;
          if (!lower) continue;
          set(k, want);
          changed.push(k);
        }
        // far npcs are not animated once objects have a draw distance
        if (get('drawDist') > 0 && get('skipFarAnim') === 0) set('skipFarAnim', 1);
        return changed;
      }
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const manual = () => { try { return localStorage.getItem('gfxManual') === '1'; } catch (e) { return false; } };
      const inGame = () => {
        try { return get('shadows') >= 0 && !document.getElementById('og-video'); }
        catch (e) { return false; }
      };
      // average fps over a window; null when it is not a fair sample
      // (loading stall, hidden tab, intro video)
      async function measure() {
        const st = window.ogFrameStats;
        if (!st || document.hidden || !inGame()) return null;
        const c0 = st.count, t0 = performance.now();
        st.maxGap = 0;
        await sleep(WINDOW);
        if (document.hidden || !inGame() || st.maxGap > 250) return null;
        return (st.count - c0) * 1000 / (performance.now() - t0);
      }
      const toast = document.getElementById('gfx-toast');
      let toastTimer = 0;
      function showToast(text) {
        toast.textContent = text;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
      }
      window.ogToast = showToast;
      function listText(a) {
        return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
      }
      async function run() {
        let slow = 0;
        for (;;) {
          if (manual()) return;
          const fps = await measure();
          if (fps === null) { slow = 0; await sleep(1000); continue; }
          if (fps >= LOW) { slow = 0; continue; }
          if (++slow < 2) continue; // two slow windows in a row, not a hiccup
          // lower step by step until the target is reached
          const before = fps, lowered = [];
          let now = fps;
          for (const lv of levels) {
            if (manual()) break;
            let changed = [];
            try { changed = applyLevel(lv); } catch (e) { changed = []; }
            if (changed.length === 0) continue;
            for (const k of changed) if (!lowered.includes(names[k])) lowered.push(names[k]);
            if (window.ogSettingsReload) window.ogSettingsReload();
            await sleep(SETTLE);
            let m = null;
            for (let i = 0; i < 5 && m === null; ++i) m = await measure();
            if (m !== null) now = m;
            if (now >= TARGET) break;
          }
          slow = 0;
          if (lowered.length === 0) return; // nothing left to lower
          showToast('You had ' + Math.round(before) + ' FPS, so we lowered ' + listText(lowered) +
                    '. Now you have ' + Math.round(now) + ' FPS. If these settings don\'t suit you, ' +
                    'you can change them under the game player (\u2699 button).');
          await sleep(10000);
        }
      }
      run();
    })();

    // ---------------------------- savegames ----------------------------
    // save_slot_N.sav in the game root: in the game's file system while it
    // runs, in OPFS (gothic/) otherwise. Downloads are a stored ZIP archive.
    const SAVE_RE = /^save_slot_(\d+)\.sav$/i;

    const SAVE_CRC = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c >>> 0;
      }
      return t;
    })();
    function saveCrc32(buf) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < buf.length; i++) c = SAVE_CRC[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    function gameFsMounted() {
      try { return !!(Module.FS && Module.FS.analyzePath(GAME_ROOT).exists && Module.FS.readdir(GAME_ROOT).length > 2); }
      catch (e) { return false; }
    }

    // [{name, bytes, time}]
    async function collectSaves() {
      const out = [];
      if (gameFsMounted()) {
        for (const name of Module.FS.readdir(GAME_ROOT)) {
          if (!SAVE_RE.test(name)) continue;
          const path = GAME_ROOT + '/' + name;
          out.push({ name, bytes: Module.FS.readFile(path), time: +Module.FS.stat(path).mtime || 0 });
        }
        return out;
      }
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return out; }
      for await (const [name, h] of dir.entries()) {
        if (h.kind !== 'file' || !SAVE_RE.test(name)) continue;
        const f = await h.getFile();
        out.push({ name, bytes: new Uint8Array(await f.arrayBuffer()), time: f.lastModified });
      }
      return out;
    }

    function zipStore(files) {
      const enc = new TextEncoder(), parts = [], central = [];
      let off = 0;
      for (const f of files) {
        const name = enc.encode(f.name), crc = saveCrc32(f.bytes), size = f.bytes.length;
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
        lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
        lh.setUint16(26, name.length, true);
        parts.push(lh.buffer, name, f.bytes);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
        ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
        ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
        central.push(ch.buffer, name);
        off += 30 + name.length + size;
      }
      const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
      return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
    }

    // .sav files of a ZIP archive (stored or deflated), folders ignored
    async function unzipSaves(file) {
      const buf = new Uint8Array(await file.arrayBuffer());
      const dv = new DataView(buf.buffer);
      let eocd = -1;
      for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--)
        if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      if (eocd < 0) throw new Error(file.name + ' is not a ZIP archive');
      const count = dv.getUint16(eocd + 10, true);
      let p = dv.getUint32(eocd + 16, true);
      const out = [], dec = new TextDecoder();
      for (let i = 0; i < count; i++) {
        if (dv.getUint32(p, true) !== 0x02014b50) throw new Error(file.name + ': corrupt ZIP archive');
        const method = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true);
        const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
        const loc = dv.getUint32(p + 42, true);
        const name = dec.decode(buf.subarray(p + 46, p + 46 + nl)).split('/').pop();
        p += 46 + nl + xl + cl;
        if (!/\.sav$/i.test(name)) continue;
        const data = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true);
        let bytes = buf.slice(data, data + comp);
        if (method === 8) {
          const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          bytes = new Uint8Array(await new Response(s).arrayBuffer());
        } else if (method !== 0) {
          throw new Error(name + ': unsupported compression');
        }
        out.push({ name, bytes });
      }
      return out;
    }

    async function downloadSaves() {
      try {
        const saves = await collectSaves();
        if (saves.length === 0) { window.ogToast && window.ogToast('There are no savegames yet.'); return; }
        saves.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipStore(saves));
        a.download = 'gothic-saves.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      } catch (e) {
        alert('Could not collect the savegames: ' + (e.message || e));
      }
    }

    async function writeSave(name, bytes) {
      const dir = await opfsGameDir(true);
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(bytes); await w.close();
      // the running game sees it at once (the save/load menu lists it)
      if (gameFsMounted()) Module.FS.writeFile(GAME_ROOT + '/' + name, bytes);
    }

    async function onSavesPicked(ev) {
      const picked = [...ev.target.files];
      ev.target.value = '';
      try {
        let incoming = [];
        for (const f of picked) {
          if (/\.zip$/i.test(f.name)) incoming.push(...await unzipSaves(f));
          else incoming.push({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) });
        }
        if (incoming.length === 0) { window.ogToast && window.ogToast('No savegames (.sav) found in the chosen files.'); return; }
        let slots = 15;
        try { if (ogGet('gameVersion') === 2) slots = 20; } catch (e) {}
        const existing = await collectSaves();
        const taken = new Map(existing.map(s => [s.name.toLowerCase(), s.time]));
        // savegames named by slot go to that slot (replacing it), others take a
        // free slot, or the one saved longest ago when all are used
        const placed = [];
        for (const s of incoming.filter(s => SAVE_RE.test(s.name)).concat(incoming.filter(s => !SAVE_RE.test(s.name)))) {
          let name = s.name;
          if (!SAVE_RE.test(name)) {
            let slot = 0;
            for (let i = 1; i <= slots && !slot; i++) if (!taken.has(('save_slot_' + i + '.sav'))) slot = i;
            if (!slot) {
              let oldest = Infinity;
              for (let i = 1; i <= slots; i++) {
                const t = taken.get('save_slot_' + i + '.sav');
                if (t < oldest && !placed.includes(i)) { oldest = t; slot = i; }
              }
            }
            if (!slot) continue;
            name = 'save_slot_' + slot + '.sav';
          }
          name = name.toLowerCase();
          await writeSave(name, s.bytes);
          taken.set(name, Date.now());
          placed.push(+SAVE_RE.exec(name)[1]);
        }
        const list = placed.map(n => n === 0 ? 'quick save' : 'slot ' + n).join(', ');
        window.ogToast && window.ogToast('Savegames added: ' + list + '. Open Load game in the game menu to see them.');
      } catch (e) {
        alert('Could not add the savegames: ' + (e.message || e));
      }
    }

    // The canvas takes the player's size from CSS (the engine follows it).
    // Emscripten's Browser.updateCanvasDimensions writes the screen size into
    // the canvas' inline style (with !important) after the player was
    // fullscreen once; that style outlives fullscreen and crops the picture.
    new MutationObserver(() => {
      if (canvas.style.width || canvas.style.height) {
        canvas.style.removeProperty('width');
        canvas.style.removeProperty('height');
      }
    }).observe(canvas, { attributes: true, attributeFilter: ['style'] });
    canvas.style.removeProperty('width');
    canvas.style.removeProperty('height');

    // window mode: the player fills the browser page (the tabs stay)
    function setWindowMode(on) {
      document.body.classList.toggle('window-mode', on);
      try { localStorage.setItem('windowMode', on ? '1' : '0'); } catch (e) {}
    }
    function toggleWindowMode() {
      setWindowMode(!document.body.classList.contains('window-mode'));
    }
    try { if (localStorage.getItem('windowMode') === '1') setWindowMode(true); } catch (e) {}

    // ------------------------------ touch controls ------------------------------
    // Buttons press the game's keys (the same window key events the keyboard
    // sends); the layout follows what the player is doing (og_ui_state):
    // world (stick, contextual action button, look by swiping), dialog,
    // inventory, menus and videos.
    (function() {
      const chk  = document.getElementById('touch-chk');
      const ui   = document.getElementById('touch-ui');
      const look = document.getElementById('touch-look');
      const stickEl = document.getElementById('touch-stick');

      const KEYS = {
        Up: ['ArrowUp', 'ArrowUp', 38], Down: ['ArrowDown', 'ArrowDown', 40],
        Left: ['ArrowLeft', 'ArrowLeft', 37], Right: ['ArrowRight', 'ArrowRight', 39],
        W: ['w', 'KeyW', 87], S: ['s', 'KeyS', 83], A: ['a', 'KeyA', 65], D: ['d', 'KeyD', 68],
        '1': ['1', 'Digit1', 49], '2': ['2', 'Digit2', 50], '3': ['3', 'Digit3', 51], '4': ['4', 'Digit4', 52], '5': ['5', 'Digit5', 53],
        '6': ['6', 'Digit6', 54], '7': ['7', 'Digit7', 55], '8': ['8', 'Digit8', 56], '9': ['9', 'Digit9', 57], '0': ['0', 'Digit0', 48],
        Shift: ['Shift', 'ShiftLeft', 16], Ctrl: ['Control', 'ControlLeft', 17], Space: [' ', 'Space', 32], Alt: ['Alt', 'AltLeft', 18],
        End: ['End', 'End', 35], X: ['x', 'KeyX', 88], F: ['f', 'KeyF', 70], K: ['k', 'KeyK', 75], Tab: ['Tab', 'Tab', 9],
        N: ['n', 'KeyN', 78], B: ['b', 'KeyB', 66], M: ['m', 'KeyM', 77],
        Esc: ['Escape', 'Escape', 27], Enter: ['Enter', 'Enter', 13],
        F2: ['F2', 'F2', 113], F8: ['F8', 'F8', 119], O: ['o', 'KeyO', 79],
      };
      const held = new Map(); // key -> press count
      // force: send a fresh key-down even if the key is already held (the
      // stick holds W while a combo needs a new W press after Ctrl)
      function rawKey(k, down, repeat) {
        const [kk, code, kc] = KEYS[k];
        if (repeat && window.__touchDebug) console.log('[touch] repeat ' + k);
        window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',
          { key: kk, code, keyCode: kc, which: kc, repeat: !!repeat, bubbles: true, cancelable: true }));
      }
      function key(k, down, force) {
        const n = held.get(k) || 0;
        if (down) { held.set(k, n + 1); if (n > 0 && !force) return; }
        else { if (n === 0) return; held.set(k, n - 1); if (n > 1) return; }
        const [kk, code, kc] = KEYS[k];
        if (window.__touchDebug) console.log('[touch] ' + (down ? 'down ' : 'up ') + k);
        window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',
          { key: kk, code, keyCode: kc, which: kc, bubbles: true, cancelable: true }));
      }
      function strikeCancel(b) {
        if (!b.strike) return;

    // ---------------------------- Bridge worker ------------------------------
    // Holds FileSystemSyncAccessHandles for every installed file and serves
    // read/truncate requests from the main thread through a SharedArrayBuffer

    function makeBridgeWorkerSource() {

'use strict';
const OP_READ = 1, OP_TRUNCATE = 2, OP_SIZE = 3;
let cmd = null, dataView = null;
const handles = [];

async function openAll(paths) {
  const root = await navigator.storage.getDirectory();
  const dir = await root.getDirectoryHandle(${JSON.stringify(OPFS_ROOT_DIR)}, {create:false});
  for (const p of paths) {
    const parts = p.split('/');
    const name = parts.pop();
    let d = dir;
    for (const seg of parts) d = await d.getDirectoryHandle(seg, {create:false});
    const fh = await d.getFileHandle(name, {create:false});
    const h = await fh.createSyncAccessHandle();
    handles.push({ h, size: h.getSize() });
  }
}

self.onmessage = (e) => {
  const msg = e.data;
  if (msg.type === 'init') {
    cmd = new Int32Array(msg.cmd);
    dataView = new Uint8Array(msg.data);
    const open = msg.files
      ? Promise.resolve(msg.files.forEach(f => handles.push({ file: f, size: f.size })))
      : openAll(msg.paths);
    open.then(() => {
      Atomics.store(cmd, 7, 0);
      Atomics.store(cmd, 6, 1);
      Atomics.notify(cmd, 0);
      // start serving only now: the blocking loop below starves the event
      // loop, so any pending await in openAll would never resume
      setTimeout(serveLoop, 0);
    }, (err) => {
      self.postMessage({ type: 'error', msg: String(err && err.stack || err) });
      Atomics.store(cmd, 7, 1);
      Atomics.store(cmd, 6, 1);
      Atomics.notify(cmd, 0);
    });
    return;
  }
};

// Synchronous command loop: blocks in Atomics.wait until a request arrives.
function serveLoop() {
    while (true) {
      // sleep while there is no pending command (cmd[0] === 0)
      Atomics.wait(cmd, 0, 0);
      const op = Atomics.load(cmd, 0);
      if (op === 0) continue;
      try {
        if (op === OP_READ) {
          const hIdx = Atomics.load(cmd, 1);
          const pos = Atomics.load(cmd, 2);
          const len = Atomics.load(cmd, 3);
          const hd = handles[hIdx];
          let n = 0;
          if (hd.file) {
            // folder picked by the user: read straight from the File object
            const ab = new FileReaderSync().readAsArrayBuffer(hd.file.slice(pos, pos + len));
            dataView.set(new Uint8Array(ab), 0);
            n = ab.byteLength;
          } else {
            n = hd.h.read(dataView.subarray(0, len), { at: pos });
          }
          Atomics.store(cmd, 5, n);
          Atomics.store(cmd, 4, 1); // ok
        } else if (op === OP_TRUNCATE) {
          const hIdx = Atomics.load(cmd, 1);
          if (handles[hIdx].h) handles[hIdx].h.truncate(0);
          handles[hIdx].size = 0;
          Atomics.store(cmd, 5, 0);
          Atomics.store(cmd, 4, 1);
        } else if (op === OP_SIZE) {
          const hIdx = Atomics.load(cmd, 1);
          Atomics.store(cmd, 5, handles[hIdx].h ? handles[hIdx].h.getSize() : handles[hIdx].size);
          Atomics.store(cmd, 4, 1);
        } else {
          Atomics.store(cmd, 4, 2); // unknown op
        }
      } catch (err) {
        Atomics.store(cmd, 4, 3); // io error
      }
      Atomics.store(cmd, 0, 0); // request served
      Atomics.notify(cmd, 0);
    }
}
`;
