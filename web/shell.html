<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpenGothic Web</title>
  <style>
    :root {
      --bg: #151515;
      --line: #3a3a3a;
      --text: #ddd;
      --dim: #999;
      --accent: #fff;
      --danger: #e5484d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #keypad {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #keypad .key {
      min-width: 56px;
      height: 32px;
      padding: 0 12px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      cursor: pointer;
      touch-action: none;
      user-select: none;
    }
    #keypad .key:hover { border-color: var(--accent); color: var(--accent); }
    #keypad .key:active { background: var(--accent); color: #000; }

    #player {
      position: relative;
      width: min(100vw, calc((100vh - 44px) * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    #player:fullscreen {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
    }

    /* window mode: the player takes the whole browser page, nothing else is shown */
    body.window-mode { overflow: hidden; }
    body.window-mode #player {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }
    body.window-mode > :not(#player):not(script) { display: none !important; }
    #win-btn .icon-exit { display: none; }
    body.window-mode #win-btn .icon-enter { display: none; }
    body.window-mode #win-btn .icon-exit { display: block; }

    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
      border: none;
      background: #000;
      display: block;
    }

    #ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 16px 72px;
      text-align: center;
    }

    #ui-overlay.hidden { display: none; }
    #ui-overlay.drag-over { outline: 1px dashed var(--accent); outline-offset: -8px; }

    .status-box {
      min-height: 20px;
      color: var(--dim);
      word-break: break-word;
    }

    .progress-bar-container {
      width: min(320px, 70%);
      height: 2px;
      background: var(--line);
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
    }

    .source-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 52px;
      display: none;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 0;
      cursor: pointer;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .file-input { display: none; }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      height: 44px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      opacity: 0;
      transition: opacity 0.2s;
    }

    #player.active #controls,
    #player:not(.playing) #controls { opacity: 1; }

    .ctl {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 8px;
      font: 13px inherit;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
    }

    .ctl:hover { color: var(--accent); }
    .ctl-right, .ctl-left { display: flex; align-items: center; }
    .fps-opt { gap: 6px; user-select: none; }
    .fps-opt input { margin: 0; accent-color: var(--accent); cursor: pointer; }
    #fps-counter {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 15;
      padding: 2px 8px;
      font: 13px monospace;
      color: #5dff8a;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      display: none;
    }
    .ctl svg { width: 22px; height: 22px; fill: currentColor; }
    #fs-btn .icon-exit { display: none; }
    #player.menu-open #controls { opacity: 1; }
    #gfx-toast {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      max-width: min(360px, calc(100% - 24px));
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid var(--line);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.6s, transform 0.6s;
      pointer-events: none;
    }
    #gfx-toast.show { opacity: 1; transform: none; }
    #settings-btn[aria-expanded="true"] { color: var(--accent); }
    #settings-panel {
      position: absolute;
      right: 8px;
      bottom: 48px;
      z-index: 25;
      width: 260px;
      max-width: calc(100% - 16px);
      padding: 10px 12px;
      background: rgba(10, 10, 10, 0.92);
      border: 1px solid var(--line);
      display: none;
    }
    #player.menu-open #settings-panel { display: block; }
    #settings-panel .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 30px;
      font-size: 13px;
    }
    #settings-panel select {
      font: inherit;
      color: var(--text);
      background: #222;
      border: 1px solid var(--line);
      padding: 2px 4px;
    }
    #settings-panel input[type=checkbox] { accent-color: var(--accent); cursor: pointer; }
    #settings-panel .set-note { margin-top: 6px; font-size: 12px; color: var(--dim); }
    #settings-panel.disabled .set-row { opacity: 0.45; pointer-events: none; }
    #player:fullscreen #fs-btn .icon-enter { display: none; }
    #player:fullscreen #fs-btn .icon-exit { display: block; }
  </style>
</head>
<body>
  <div id="player">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <div id="ui-overlay">
      <div class="status-box" id="status-text">Loading...</div>
      <div class="progress-bar-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <button class="btn" id="retry-btn" style="display:none;" onclick="downloadGame()">Download</button>

      <input type="file" id="folder-picker" class="file-input" webkitdirectory directory multiple onchange="onFolderSelected(event)">
      <input type="file" id="zip-picker" class="file-input" accept=".zip" onchange="onZipSelected(event)">

      <div class="source-row" id="source-row">
        <button class="btn" id="folder-btn" onclick="pickOffline('folder-picker')">Select folder</button>
        <button class="btn" id="zip-btn" onclick="pickOffline('zip-picker')">Select ZIP</button>
      </div>
    </div>

    <div id="fps-counter">0 FPS</div>
    <div id="gfx-toast" role="status" aria-live="polite"></div>

    <div id="settings-panel" class="disabled">
      <label class="set-row" title="Display refresh rate: no game limit, smooth (frames follow the monitor). Unlimited: for benchmarks, frames the monitor cannot show make motion uneven">FPS limit
        <select data-set="fpsUnlock">
          <option value="0">Game setting</option><option value="1">Display refresh rate</option>
          <option value="2">Unlimited (jerky)</option>
        </select>
      </label>
      <label class="set-row">Render resolution
        <select data-set="resScale">
          <option value="0">100%</option><option value="1">75%</option>
          <option value="2">50%</option><option value="3">40%</option>
        </select>
      </label>
      <label class="set-row">Shadows
        <select data-set="shadows">
          <option value="2">High</option><option value="1">Low</option><option value="0">Off</option>
        </select>
      </label>
      <label class="set-row">Object draw distance
        <select data-set="drawDist">
          <option value="0">Unlimited</option><option value="1">Far (150 m)</option>
          <option value="2">Medium (80 m)</option><option value="3">Near (40 m)</option>
          <option value="4">Nearest (20 m)</option>
        </select>
      </label>
      <label class="set-row">World draw distance
        <select data-set="worldDist">
          <option value="0">Unlimited</option><option value="1">500 m</option>
          <option value="2">300 m</option><option value="3">150 m</option><option value="4">80 m</option>
        </select>
      </label>
      <label class="set-row" title="NPCs beyond the object draw distance are not animated (their bones freeze until they come closer)">Skip hidden NPC animation <input type="checkbox" data-set="skipFarAnim"></label>
      <label class="set-row">Water reflections <input type="checkbox" data-set="reflections"></label>
      <label class="set-row">Ambient occlusion <input type="checkbox" data-set="ssao"></label>
      <div class="set-note" id="settings-note">Start the game to change settings.</div>
    </div>

    <div id="controls">
      <div class="ctl-left">
      <button class="ctl" id="clear-btn" style="display:none;" onclick="clearStorage()">Delete game</button>
      <button class="ctl" id="saves-dl-btn" onclick="downloadSaves()" title="Download all savegames as a ZIP archive">Download saves</button>
      <button class="ctl" id="saves-ul-btn" onclick="document.getElementById('saves-picker').click()" title="Add savegames from a ZIP archive or .sav files">Upload saves</button>
      <input type="file" id="saves-picker" class="file-input" accept=".zip,.sav" multiple onchange="onSavesPicked(event)">
      </div>
      <div class="ctl-right">
      <label class="ctl fps-opt" title="Show FPS"><input type="checkbox" id="fps-chk"> Show FPS</label>
      <button class="ctl" id="settings-btn" aria-label="Graphics settings" title="Graphics settings" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
      <button class="ctl" id="win-btn" onclick="toggleWindowMode()" aria-label="Window mode" title="Window mode">
        <svg class="icon-enter" viewBox="0 0 24 24"><path d="M3 6h18v12H3V6zm2 2v8h14V8H5z"/></svg>
        <svg class="icon-exit" viewBox="0 0 24 24"><path d="M5 8h14v8H5V8zm2 2v4h10v-4H7z"/></svg>
      </button>
      <button class="ctl" id="fs-btn" onclick="toggleFullscreen()" aria-label="Fullscreen" title="Fullscreen">
        <svg class="icon-enter" viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4V4zm10 0h6v6h-2V6h-4V4zM4 14h2v4h4v2H4v-6zm14 0h2v6h-6v-2h4v-4z"/></svg>
        <svg class="icon-exit" viewBox="0 0 24 24"><path d="M8 4h2v6H4V8h4V4zm6 0h2v4h4v2h-6V4zM4 14h6v6H8v-4H4v-2zm10 0h6v2h-4v4h-2v-6z"/></svg>
      </button>
      </div>
    </div>
  </div>

  <div id="keypad">
    <button class="key" data-key="w" data-code="KeyW" data-kc="87">W</button>
    <button class="key" data-key="a" data-code="KeyA" data-kc="65">A</button>
    <button class="key" data-key="Enter" data-code="Enter" data-kc="13">Enter</button>
    <button class="key" data-key="Escape" data-code="Escape" data-kc="27">Esc</button>
  </div>

  <!-- Install worker: downloads the game archive into OPFS (resumable) and
       unpacks ZIP archives into the OPFS game directory. Kept as text and
       started from a Blob URL so the page stays a single file. -->
  <script type="text/plain" id="install-worker-src">
'use strict';
const FLUSH_EVERY = 32 * 1024 * 1024;
const MAX_RETRIES = 8;
let root = null;

self.onmessage = async (e) => {
  const m = e.data;
  try {
    root = await navigator.storage.getDirectory();
    let result = null;
    if (m.type === 'download') {
      result = await download(m);
    } else if (m.type === 'chunks') {
      result = await installChunks(m);
    } else if (m.type === 'extract') {
      const blob = m.blob || await (await root.getFileHandle(m.zipName)).getFile();
      result = await extract(blob, m);
    }
    self.postMessage({ type: 'done', result });
  } catch (err) {
    self.postMessage({ type: 'error', name: err && err.name, msg: String(err && err.message || err) });
  }
};

function progress(o) { self.postMessage(Object.assign({ type: 'progress' }, o)); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

function writeJsonSync(h, obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  h.truncate(0);
  h.write(bytes, { at: 0 });
  h.flush();
}

async function writeJson(name, obj) {
  const fh = await root.getFileHandle(name, { create: true });
  const h = await fh.createSyncAccessHandle();
  try { writeJsonSync(h, obj); } finally { h.close(); }
}

// ------------------------------ download ------------------------------
// Streams the archive into an OPFS file through a sync access handle, so
// every written byte is on disk: an interrupted download (network error,
// pause, closed tab) resumes with an HTTP Range request.

function totalFromResponse(resp, have) {
  if (resp.status === 206) {
    const cr = resp.headers.get('Content-Range') || '';
    const t = /\/(\d+)\s*$/.exec(cr);
    if (t) return +t[1];
    return have + (+resp.headers.get('Content-Length') || 0);
  }
  return +resp.headers.get('Content-Length') || 0;
}

async function download(m) {
  const fh = await root.getFileHandle(m.zipName, { create: true });
  const h = await fh.createSyncAccessHandle();
  try {
    let total = m.expectTotal || 0;
    let have = h.getSize();
    if (total && have === total) return { total };
    if (total && have > total) { h.truncate(0); have = 0; }

    let spaceChecked = false;
    for (let attempt = 0; ; attempt++) {
      try {
        const headers = have > 0 ? { Range: 'bytes=' + have + '-' } : {};
        const resp = await fetch(m.url, { cache: 'no-store', headers });
        if (resp.status === 416) {
          // range past the end: the remote file changed, start over
          h.truncate(0); have = 0; total = 0;
          throw new Error('HTTP 416');
        }
        if (!resp.ok) {
          const err = new Error('server responded with HTTP ' + resp.status);
          if (resp.status >= 400 && resp.status < 500) err.fatal = true;
          throw err;
        }
        const remoteTotal = totalFromResponse(resp, have);
        const rangeStart = /bytes\s+(\d+)-/.exec(resp.headers.get('Content-Range') || '');
        if (resp.status !== 206 || (rangeStart && +rangeStart[1] !== have) ||
            (total && remoteTotal && remoteTotal !== total)) {
          // no resume possible (or another file behind the URL): from scratch
          h.truncate(0); have = 0;
          if (resp.status === 206) {
            resp.body.cancel().catch(() => {});
            total = 0;
            continue;
          }
        }
        total = remoteTotal;
        writeJsonSync(await stateHandle(m), { url: m.url, total });

        if (!spaceChecked && total && navigator.storage.estimate) {
          spaceChecked = true;
          const est = await navigator.storage.estimate();
          // archive + unpacked files (~1.5x of compressed) live side by side
          const need = (total - have) + total * 1.5;
          const free = (est.quota || 0) - (est.usage || 0);
          if (est.quota && free < need) {
            resp.body.cancel().catch(() => {});
            const err = new Error('not enough browser storage: need ~' +
              Math.ceil(need / 1048576) + ' MB, available ' + Math.floor(free / 1048576) + ' MB');
            err.fatal = true;
            throw err;
          }
        }

        const reader = resp.body.getReader();
        let sinceFlush = 0, lastPost = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          h.write(value, { at: have });
          have += value.byteLength;
          sinceFlush += value.byteLength;
          if (sinceFlush >= FLUSH_EVERY) { h.flush(); sinceFlush = 0; }
          const now = performance.now();
          if (now - lastPost > 200) {
            lastPost = now;
            progress({ phase: 'download', done: have, total });
          }
        }
        h.flush();
        if (total && have < total) throw new Error('connection lost');
        progress({ phase: 'download', done: have, total: total || have });
        return { total: total || have };
      } catch (err) {
        h.flush();
        if (err.fatal || attempt >= MAX_RETRIES) throw err;
        progress({ phase: 'retry', attempt: attempt + 1, max: MAX_RETRIES, msg: String(err.message || err) });
        await sleep(Math.min(15000, 1500 * (attempt + 1)));
        have = h.getSize();
      }
    }
  } finally {
    h.close();
    if (stateH) { stateH.close(); stateH = null; }
  }
}

let stateH = null;
async function stateHandle(m) {
  if (!stateH) {
    const fh = await root.getFileHandle(m.stateName, { create: true });
    stateH = await fh.createSyncAccessHandle();
  }
  return stateH;
}

// ------------------------------ extract ------------------------------

const CRC_TABLE = (() => {
  const t = new Int32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();

function crc32(crc, buf) {
  let c = ~crc;
  for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
  return ~c;
}

async function readAt(blob, pos, len) {
  return new DataView(await blob.slice(pos, pos + len).arrayBuffer());
}

function u64(dv, off) { return Number(dv.getBigUint64(off, true)); }

async function readCentralDirectory(blob) {
  const size = blob.size;
  const tailLen = Math.min(size, 65535 + 22);
  const tail = await readAt(blob, size - tailLen, tailLen);
  let eocd = -1;
  for (let i = tailLen - 22; i >= 0; i--) {
    if (tail.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a ZIP archive (corrupt or incomplete)');
  let count = tail.getUint16(eocd + 10, true);
  let cdSize = tail.getUint32(eocd + 12, true);
  let cdOff = tail.getUint32(eocd + 16, true);
  if (count === 0xffff || cdSize === 0xffffffff || cdOff === 0xffffffff) {
    const loc = eocd - 20;
    if (loc < 0 || tail.getUint32(loc, true) !== 0x07064b50) throw new Error('corrupt ZIP64 archive');
    const z = await readAt(blob, u64(tail, loc + 8), 56);
    if (z.getUint32(0, true) !== 0x06064b50) throw new Error('corrupt ZIP64 archive');
    count = u64(z, 32); cdSize = u64(z, 40); cdOff = u64(z, 48);
  }

  const cd = await readAt(blob, cdOff, cdSize);
  const bytes = new Uint8Array(cd.buffer);
  const utf8 = new TextDecoder('utf-8');
  const dos = new TextDecoder('ibm866');
  const entries = [];
  let p = 0;
  for (let i = 0; i < count; i++) {
    if (cd.getUint32(p, true) !== 0x02014b50) throw new Error('corrupt ZIP directory');
    const flags = cd.getUint16(p + 8, true);
    const method = cd.getUint16(p + 10, true);
    const crc = cd.getInt32(p + 16, true);
    let compSize = cd.getUint32(p + 20, true);
    let size = cd.getUint32(p + 24, true);
    const nameLen = cd.getUint16(p + 28, true);
    const extraLen = cd.getUint16(p + 30, true);
    const commentLen = cd.getUint16(p + 32, true);
    let localOff = cd.getUint32(p + 42, true);
    const nameBytes = bytes.subarray(p + 46, p + 46 + nameLen);
    const name = ((flags & 0x800) ? utf8 : dos).decode(nameBytes);
    // ZIP64 extended information: only the saturated fields are present
    let x = p + 46 + nameLen;
    const xEnd = x + extraLen;
    while (x + 4 <= xEnd) {
      const id = cd.getUint16(x, true), len = cd.getUint16(x + 2, true);
      if (id === 0x0001) {
        let q = x + 4;
        if (size === 0xffffffff) { size = u64(cd, q); q += 8; }
        if (compSize === 0xffffffff) { compSize = u64(cd, q); q += 8; }
        if (localOff === 0xffffffff) { localOff = u64(cd, q); q += 8; }
      }
      x += 4 + len;
    }
    entries.push({ name: name.replace(/\\/g, '/').replace(/^\/+/, ''), flags, method, crc, compSize, size, localOff });
    p += 46 + nameLen + extraLen + commentLen;
  }
  return entries;
}

// The archive may wrap the game into one or more folders ("game/Data/...").
// The game root is the folder holding Data/ closest to the archive root.
function findGameRoot(entries) {
  let best = null;
  for (const e of entries) {
    const parts = e.name.split('/');
    for (let i = 0; i < parts.length - 1; i++) {
      if (/^data$/i.test(parts[i])) {
        if (best === null || i < best.length) best = parts.slice(0, i);
        break;
      }
    }
  }
  if (best === null) throw new Error('no Data folder in the archive: not a Gothic game archive');
  return best.length ? best.join('/') + '/' : '';
}

async function extract(blob, m) {
  const all = await readCentralDirectory(blob);
  const prefix = findGameRoot(all);
  const list = [];
  for (const e of all) {
    if (e.name.endsWith('/')) continue;
    if (prefix && e.name.slice(0, prefix.length).toLowerCase() !== prefix.toLowerCase()) continue;
    const rel = e.name.slice(prefix.length);
    if (!rel || rel.split('/').some(s => s === '..' || s === '.')) continue;
    if (m.skip.some(re => re.test(rel))) continue;
    if (e.method !== 0 && e.method !== 8) throw new Error('unsupported compression method ' + e.method + ': ' + rel);
    if (e.flags & 1) throw new Error('encrypted ZIP archives are not supported');
    list.push(Object.assign(e, { rel }));
  }
  if (list.length === 0) throw new Error('no game files in the archive');

  const gameDir = await root.getDirectoryHandle(m.gameDirName, { create: true });
  const dirs = new Map([['', gameDir]]);
  async function dirFor(parts) {
    let key = '', d = gameDir;
    for (const seg of parts) {
      key = key ? key + '/' + seg : seg;
      let next = dirs.get(key.toLowerCase());
      if (!next) {
        next = await d.getDirectoryHandle(seg, { create: true });
        dirs.set(key.toLowerCase(), next);
      }
      d = next;
    }
    return d;
  }

  const totalComp = list.reduce((a, e) => a + e.compSize, 0);
  let doneComp = 0, doneBytes = 0, lastPost = 0, n = 0;
  for (const e of list) {
    n++;
    const parts = e.rel.split('/');
    const fname = parts.pop();
    const d = await dirFor(parts);
    // savegames and settings made in the browser win over the archive copies
    if (m.persisted.some(re => re.test(e.rel))) {
      let exists = true;
      try { await d.getFileHandle(fname, { create: false }); } catch (_) { exists = false; }
      if (exists) { doneComp += e.compSize; continue; }
    }

    const lh = await readAt(blob, e.localOff, 30);
    if (lh.getUint32(0, true) !== 0x04034b50) throw new Error('corrupt ZIP archive: ' + e.rel);
    const dataOff = e.localOff + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);

    const fh = await d.getFileHandle(fname, { create: true });
    const h = await fh.createSyncAccessHandle();
    try {
      h.truncate(0);
      let stream = blob.slice(dataOff, dataOff + e.compSize).stream();
      if (e.method === 8) stream = stream.pipeThrough(new DecompressionStream('deflate-raw'));
      const reader = stream.getReader();
      let pos = 0, crc = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        h.write(value, { at: pos });
        crc = crc32(crc, value);
        pos += value.byteLength;
        const now = performance.now();
        if (now - lastPost > 200) {
          lastPost = now;
          const part = e.size ? Math.min(1, pos / e.size) : 1;
          progress({ phase: 'extract', done: doneComp + e.compSize * part, total: totalComp,
                     index: n, count: list.length, name: e.rel });
        }
      }
      if (pos !== e.size || crc !== e.crc)
        throw new Error('corrupt file in the archive (checksum mismatch): ' + e.rel);
      h.flush();
    } finally {
      h.close();
    }
    doneComp += e.compSize;
    doneBytes += e.size;
  }
  progress({ phase: 'extract', done: totalComp, total: totalComp, index: list.length, count: list.length, name: '' });
  if (m.deleteZip) {
    try { await root.removeEntry(m.zipName); } catch (_) {}
  }
  return { files: list.length, bytes: doneBytes };
}

// --------------------------- chunked install ---------------------------
// manifest.json + self-contained chunks made by tools/pack_web.py. Up to
// CHUNK_JOBS chunks download at once and each one is unpacked the moment it
// arrives, so unpacking hides behind the download. Finished chunks are
// recorded in the state file: an interrupted install resumes chunk-wise.

const CHUNK_JOBS = 4;

// mirrors that failed are tried last by every later request
const hostFailures = new Map();
function failuresOf(url) { return hostFailures.get(new URL(url).host) || 0; }

// Fetches from the first mirror that works. A failed request switches to the
// next mirror right away; only after all of them failed it waits and retries.
// A mirror answering 4xx does not have the file and is dropped.
async function fetchMirrors(urls, what, consume) {
  const live = [...new Set(urls)].sort((a, b) => failuresOf(a) - failuresOf(b));
  for (let attempt = 0, round = 0; ; attempt++) {
    const url = live[attempt % live.length];
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) {
        const err = new Error('server responded with HTTP ' + resp.status + ' (' + what + ')');
        if (resp.status >= 400 && resp.status < 500) err.fatal = true;
        throw err;
      }
      return await consume(resp, url);
    } catch (err) {
      const host = new URL(url).host;
      hostFailures.set(host, (hostFailures.get(host) || 0) + 1);
      if (err.fatal && live.length > 1) {
        live.splice(live.indexOf(url), 1);
        attempt--;
        continue;
      }
      if ((attempt + 1) % live.length !== 0) continue;
      if (err.fatal || ++round > MAX_RETRIES) throw err;
      progress({ phase: 'retry', attempt: round, max: MAX_RETRIES, msg: String(err.message || err) });
      await sleep(Math.min(15000, 1500 * round));
    }
  }
}

function toHex(buf) {
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function installChunks(m) {
  let manifestUrl = m.urls[0];
  const man = await fetchMirrors(m.urls, 'manifest', (r, url) => { manifestUrl = url; return r.json(); });
  if (man.version !== 1) {
    const err = new Error('unsupported manifest version ' + man.version);
    err.fatal = true;
    throw err;
  }
  const names = man.chunks.map(c => c.name);

  const stateFh = await root.getFileHandle(m.stateName, { create: true });
  const stateH = await stateFh.createSyncAccessHandle();
  let state = null;
  try {
    const buf = new Uint8Array(stateH.getSize());
    stateH.read(buf, { at: 0 });
    state = JSON.parse(new TextDecoder().decode(buf));
  } catch (_) {}
  // a different pack behind the link: start over
  if (!state || state.url !== m.urls[0] || JSON.stringify(state.names) !== JSON.stringify(names))
    state = { url: m.urls[0], names, done: [], created: [] };
  const done = new Set(state.done);

  const gameDir = await root.getDirectoryHandle(m.gameDirName, { create: true });
  const dirs = new Map([['', gameDir]]);
  async function dirFor(parts) {
    let key = '', d = gameDir;
    for (const seg of parts) {
      key = key ? key + '/' + seg : seg;
      let next = dirs.get(key.toLowerCase());
      if (!next) {
        next = await d.getDirectoryHandle(seg, { create: true });
        dirs.set(key.toLowerCase(), next);
      }
      d = next;
    }
    return d;
  }

  const wanted = man.files.map(f => !f.path.split('/').some(s => s === '' || s === '.' || s === '..') &&
                                      !m.skip.some(re => re.test(f.path)));
  const totalBytes = man.files.reduce((a, f, i) => a + (wanted[i] ? f.size : 0), 0);
  if (navigator.storage.estimate) {
    const est = await navigator.storage.estimate();
    const free = (est.quota || 0) - (est.usage || 0);
    if (est.quota && free < totalBytes) {
      const err = new Error('not enough browser storage: need ~' + Math.ceil(totalBytes / 1048576) +
                            ' MB, available ' + Math.floor(free / 1048576) + ' MB');
      err.fatal = true;
      throw err;
    }
  }

  // one sync access handle per file, shared by all chunks writing into it
  // (handles are exclusive); null = file is skipped
  const handles = new Map();
  // the file handles stay referenced: Chrome never settles createSyncAccessHandle()
  // when its file handle gets garbage-collected meanwhile (chunk buffers churn the GC)
  const fileHandles = [];
  function handleFor(fi) {
    if (!handles.has(fi)) handles.set(fi, (async () => {
      const f = man.files[fi];
      if (!wanted[fi]) return null;
      const parts = f.path.split('/');
      const fname = parts.pop();
      const d = await dirFor(parts);
      // savegames and settings made in the browser win over the pack copies
      if (m.persisted.some(re => re.test(f.path)) && !state.created.includes(f.path)) {
        let exists = true;
        try { await d.getFileHandle(fname, { create: false }); } catch (_) { exists = false; }
        if (exists) return null;
        state.created.push(f.path);
      }
      const fh = await d.getFileHandle(fname, { create: true });
      fileHandles.push(fh);
      const h = await fh.createSyncAccessHandle();
      if (h.getSize() !== f.size) h.truncate(f.size);
      return h;
    })());
    return handles.get(fi);
  }

  const pieces = man.chunks.map(() => []);
  for (const p of man.pieces) pieces[p.chunk].push(p);

  const total = man.chunks.reduce((a, c) => a + c.size, 0);
  let have = man.chunks.reduce((a, c) => a + (done.has(c.name) ? c.size : 0), 0);
  let lastPost = 0;
  function count(n) {
    have += n;
    const now = performance.now();
    if (now - lastPost > 200) {
      lastPost = now;
      progress({ phase: 'download', done: have, total });
    }
  }

  async function installChunk(ci) {
    const c = man.chunks[ci];
    // next to the manifest, in the mirror folders of the pack, then the
    // chunk's own links (tools/mirrorhost_mirror.py)
    const urls = [manifestUrl, ...(man.bases || [])].map(b => new URL(c.name, b).href).concat(c.mirrors || []);
    const data = await fetchMirrors(urls, c.name, async (resp) => {
      const buf = new Uint8Array(c.size);
      let at = 0;
      try {
        const reader = resp.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          if (at + value.byteLength > c.size) throw new Error('unexpected size of ' + c.name);
          buf.set(value, at);
          at += value.byteLength;
          count(value.byteLength);
        }
        if (at !== c.size) throw new Error('connection lost');
        if (toHex(await crypto.subtle.digest('SHA-256', buf)) !== c.sha256)
          throw new Error('corrupt download: ' + c.name);
      } catch (err) {
        count(-at);
        throw err;
      }
      return buf;
    });

    const touched = new Set();
    for (const p of pieces[ci]) {
      const h = await handleFor(p.file);
      if (!h) continue;
      let raw = data.subarray(p.off, p.off + p.len);
      if (p.method === 'deflate-raw') raw = await inflateRaw(raw);
      if (raw.byteLength !== p.raw || (crc32(0, raw) >>> 0) !== p.crc)
        throw new Error('corrupt pack: ' + man.files[p.file].path);
      h.write(raw, { at: p.at });
      touched.add(h);
    }
    for (const h of touched) h.flush();
    done.add(c.name);
    state.done = [...done];
    writeJsonSync(stateH, state);
  }

  try {
    // chunks start in pack order (core game data first), CHUNK_JOBS at a time
    const todo = man.chunks.map((c, i) => i).filter(i => !done.has(man.chunks[i].name));
    let next = 0;
    async function lane() {
      while (next < todo.length) await installChunk(todo[next++]);
    }
    await Promise.all(Array.from({ length: Math.min(CHUNK_JOBS, todo.length) }, lane));
    progress({ phase: 'download', done: total, total });

    // files no chunk wrote into (empty ones) still have to exist
    for (let fi = 0; fi < man.files.length; fi++) await handleFor(fi);
  } finally {
    for (const p of handles.values()) {
      const h = await p.catch(() => null);
      if (h) h.close();
    }
    stateH.close();
  }
  return { files: wanted.filter(Boolean).length, bytes: totalBytes, download: total };
}
