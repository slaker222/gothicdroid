      bridge: null,          // {worker, cmd, data}
      workerSrc: null,

      lower(p) { return p.toLowerCase(); },

      // registry key of `name` inside the entry `parent` (root has empty path)
      childKey(parentEntry, name) {
        const p = (parentEntry === this.rootEntry) ? '' : parentEntry.path;
        return this.lower(p ? p + '/' + name : name);
      },

      addEntry(path, isDir, size) {
        const key = this.lower(path);
        let e = this.files.get(key);
        if (!e) {
          e = { path, isDir, size: size || 0, hIdx: -1, mem: null, dirty: false, node: null };
          this.files.set(key, e);
        } else {
          e.path = path;
          e.isDir = isDir;
          if (size !== undefined) e.size = size;
        }
        return e;
      },

      childrenOf(entry) {
        // direct children of a directory entry
        const prefix = entry === this.rootEntry ? '' : this.lower(entry.path) + '/';
        const out = [];
        for (const [k, v] of this.files) {
          if (!k.startsWith(prefix)) continue;
          const rest = k.slice(prefix.length);
          if (rest.length === 0 || rest.includes('/')) continue;
          out.push(v);
        }
        return out;
      },

      rootEntry: null,

      // ---- Emscripten filesystem interface ----
      DIR_MODE: 0x4000 | 0x1ff,
      FILE_MODE: 0x8000 | 0x1ff,

      mount(mount) {
        return this.mkNode(null, '', this.rootEntry);
      },

      mkNode(parent, name, entry) {
        const FS = Module.FS;
        const node = FS.createNode(parent, name || '/', entry.isDir ? this.DIR_MODE : this.FILE_MODE);
        node.mode = entry.isDir ? this.DIR_MODE : this.FILE_MODE;
        node.node_ops = this.node_ops;
        node.stream_ops = this.stream_ops;
        node.timestamp = Date.now();
        node.gameEntry = entry;
        entry.node = node;
        if (entry.isDir) {
          node.size = 4096;
        } else {
          node.size = entry.size;
        }
        return node;
      },

      node_ops: {
        getattr(node) {
          const e = node.gameEntry;
          return {
            dev: 1,
            ino: 0,
            mode: node.mode,
            nlink: 1,
            uid: 0,
            gid: 0,
            rdev: 0,
            size: e.isDir ? 4096 : e.size,
            atime: new Date(node.timestamp),
            mtime: new Date(node.timestamp),
            ctime: new Date(node.timestamp),
            blksize: 4096,
            blocks: Math.ceil(e.size / 4096)
          };
        },
        setattr(node, attr) {
          if (attr.mode !== undefined) node.mode = attr.mode;
          if (attr.size !== undefined && !node.gameEntry.isDir) {
            node.gameEntry.size = attr.size;
            node.size = attr.size;
            if (node.gameEntry.mem && node.gameEntry.mem.length !== attr.size) {
              const nm = new Uint8Array(attr.size);
              nm.set(node.gameEntry.mem.subarray(0, Math.min(attr.size, node.gameEntry.mem.length)));
              node.gameEntry.mem = nm;
            }
          }
          if (attr.timestamp !== undefined) node.timestamp = attr.timestamp;
        },
        lookup(parent, name) {
          const key = GameFS.childKey(parent.gameEntry, name);
          const e = GameFS.files.get(key);
          if (!e) throw new GameFS.ErrnoError(44 /*ENOENT*/);
          if (e.node) return e.node;
          return GameFS.mkNode(parent, name, e);
        },
        mknod(parent, name, mode, dev) {
          const parentPath = parent.gameEntry === GameFS.rootEntry ? '' : parent.gameEntry.path;
          const path = parentPath ? parentPath + '/' + name : name;
          const e = GameFS.addEntry(path, GameFS.isDirMode(mode), 0);
          e.mem = new Uint8Array(0);
          e.dirty = true;
          e.hIdx = -1;
          const node = GameFS.mkNode(parent, name, e);
          GameFS.persistEntryAsync(e, new Uint8Array(0));
          return node;
        },
        rename(oldNode, newDirNode, newName) {
          const oldE = oldNode.gameEntry;
          const oldKey = GameFS.lower(oldE.path);
          const newParentPath = newDirNode.gameEntry === GameFS.rootEntry ? '' : newDirNode.gameEntry.path;
          const newPath = newParentPath ? newParentPath + '/' + newName : newName;
          // move entry and all descendants
          const moves = [];
          for (const [k, v] of GameFS.files) {
            if (k === oldKey || k.startsWith(oldKey + '/')) {
              moves.push([k, v]);
            }
          }
          for (const [k, v] of moves) {
            GameFS.files.delete(k);
            const rel = v.path.slice(oldE.path.length);
            v.path = newPath + rel;
            v.node = null;
            GameFS.files.set(GameFS.lower(v.path), v);
          }
          oldE.dirty = true;
          GameFS.moveOpfsAsync(oldE.path, newPath);
        },
        unlink(parent, name) {
          const key = GameFS.childKey(parent.gameEntry, name);
          const e = GameFS.files.get(key);
          if (!e) throw new GameFS.ErrnoError(44);
          e.deleted = true;
          GameFS.files.delete(key);
          // remove descendants too
          const pref = key + '/';
          for (const k of [...GameFS.files.keys()]) {
            if (k.startsWith(pref)) GameFS.files.delete(k);
          }
          GameFS.deleteOpfsAsync(e.path);
        },
        rmdir(parent, name) {
          GameFS.node_ops.unlink(parent, name);
        },
        readdir(node) {
          const entries = ['.', '..'];
          for (const c of GameFS.childrenOf(node.gameEntry)) {
            entries.push(c.path.split('/').pop());
          }
          return entries;
        },
        symlink() {
          throw new GameFS.ErrnoError(1 /*EPERM*/);
        }
      },

      stream_ops: {
        // NOTE: no `open` hook on purpose — opendir() opens directories
        // through the regular open path and must not fail.
        close(stream) {
          const e = stream.node.gameEntry;
          if (stream.gameBuffer) {
            // the write buffer grows geometrically: keep only the file bytes
            const bytes = stream.gameBuffer.slice(0, e.size);
            e.mem = bytes;
            e.dirty = true;
            stream.node.size = e.size;
            GameFS.persistEntryAsync(e, bytes);
          }
          stream.gameBuffer = null;
        },
        read(stream, buffer, offset, length, position) {
          const e = stream.node.gameEntry;
          if (length <= 0) return 0;
          if (position >= e.size) return 0;
          let toRead = Math.min(length, e.size - position);
          if (e.mem !== null && e.mem !== undefined) {
            const n = Math.min(toRead, e.mem.length - position);
            if (n <= 0) return 0;
            buffer.set(e.mem.subarray(position, position + n), offset);
            return n;
          }
          if (GameFS.lazy) {
            return GameFS.bridgeReadInto(e, buffer, offset, position, toRead);
          }
          // preload backend must have materialized the file
          return 0;
        },
        write(stream, buffer, offset, length, position) {
          const e = stream.node.gameEntry;
          const end = position + length;
          if (!stream.gameBuffer || stream.gameBuffer.length < end) {
            const cur = stream.gameBuffer ? stream.gameBuffer.length : 0;
            const nb = new Uint8Array(Math.max(end, cur * 2, 1024));
            if (stream.gameBuffer) nb.set(stream.gameBuffer.subarray(0, Math.min(e.size, cur)));
            else if (e.mem) nb.set(e.mem.subarray(0, Math.min(e.size, e.mem.length)));
            stream.gameBuffer = nb;
          }
          stream.gameBuffer.set(buffer.subarray(offset, offset + length), position);
          if (end > e.size) {
            e.size = end;
            stream.node.size = end;
          }
          e.dirty = true;
          return length;
        },
        llseek(stream, offset, whence) {
          let position = offset;
          if (whence === 1) position += stream.position;
          else if (whence === 2) {
            if (GameFS.isDirMode(stream.node.mode) === false) position += stream.node.gameEntry.size;
          }
          if (position < 0) throw new GameFS.ErrnoError(28 /*EINVAL*/);
          return position;
        },
        // mmap is required: ZenKit memory-maps every game file it reads.
        // Without this op FS.mmap throws ENODEV, musl returns MAP_FAILED(-1)
        // and the engine dereferences 0xFFFFFFFF.
        mmap(stream, length, position, prot, flags) {
          const e = stream.node.gameEntry;
          if (e.isDir) throw new GameFS.ErrnoError(19 /*ENODEV*/);
          const ptr = Module['mmapAlloc'](length);
          // mmapAlloc may grow the heap: HEAPU8 must be re-read AFTER it
          const HEAPU8 = Module.HEAPU8;
          if (!ptr) throw new GameFS.ErrnoError(12 /*ENOMEM*/);
          const avail = Math.max(0, Math.min(length, e.size - position));
          if (avail > 0) {
            if (e.mem) {
              HEAPU8.set(e.mem.subarray(position, position + avail), ptr);
            } else if (GameFS.lazy) {
              GameFS.bridgeReadInto(e, HEAPU8, ptr, position, avail);
            }
            // neither mem nor lazy: preload backend guarantees e.mem
          }
          return { ptr, allocated: true };
        },
        msync(stream, buffer, offset, length, mmapFlags) {
          // MAP_SHARED write-back: the engine never writes game data files
          // through mappings (saves go through the write() path)
          return 0;
        }
      },

      isDirMode(mode) {
        return (mode & 0x1700) === 0x4000; // S_IFDIR
      },

      // ---- lazy bridge helpers ----
      bridgeReadInto(e, heapBuffer, offset, position, length) {
        const br = e.br || GameFS.bridge; // a voice language added while the game runs has its own
        // loop over 16MB chunks until the whole request is satisfied
        let done = 0;
        while (done < length) {
          const chunk = Math.min(length - done, BRIDGE_CHUNK);
          Atomics.store(br.cmd, 1, e.hIdx);
          Atomics.store(br.cmd, 2, position + done);
          Atomics.store(br.cmd, 3, chunk);
          Atomics.store(br.cmd, 4, 0); // clear status
          Atomics.store(br.cmd, 0, 1); // OP_READ
          Atomics.notify(br.cmd, 0);
          // wait for the worker to serve the command
          const deadline = performance.now() + 10000;
          while (Atomics.load(br.cmd, 0) !== 0) {
            if (performance.now() > deadline) throw new GameFS.ErrnoError(29 /*EIO*/);
          }
          const status = Atomics.load(br.cmd, 4);
          if (status !== 1) throw new GameFS.ErrnoError(29 /*EIO*/);
          const n = Atomics.load(br.cmd, 5);
          if (n <= 0) break;
          heapBuffer.set(br.data.subarray(0, n), offset + done);
          done += n;
          if (n < chunk) break;
        }
        return done;
      },

      // ---- async persistence (fire and forget) ----
      persistQueue: new Map(),
      liveHandles: new Set(),
      persistEntryAsync(e, bytes) {
        // writes to one file run strictly one after another: overlapping
        // createWritable() calls on the same handle fail or lose data
        const key = e.path;
        const prev = GameFS.persistQueue.get(key) || Promise.resolve();
        const next = prev.then(() => GameFS.persistNow(e, bytes));
        GameFS.persistQueue.set(key, next);
        next.finally(() => { if (GameFS.persistQueue.get(key) === next) GameFS.persistQueue.delete(key); });
      },

      persistNow(e, bytes) {
        return opfsGameDir(true).then(async (dir) => {
          const parts = e.path.split('/');
          const name = parts.pop();
          const d = await opfsEnsureDir(dir, parts);
          const fh = await d.getFileHandle(name, { create: true });
          // Chrome may garbage-collect an unreferenced handle mid-call and the
          // promise then never settles: keep every OPFS object reachable
          GameFS.liveHandles.add(fh); GameFS.liveHandles.add(d);
          try {
            const w = await fh.createWritable();
            GameFS.liveHandles.add(w);
            try { await w.write(bytes); await w.close(); }
            finally { GameFS.liveHandles.delete(w); }
          } finally {
            GameFS.liveHandles.delete(fh); GameFS.liveHandles.delete(d);
          }
        }).catch(err => console.warn('OPFS persist failed:', e.path, err));
      },

      deleteOpfsAsync(path) {
        opfsGameDir(false).then(async (dir) => {
          const parts = path.split('/');
          const name = parts.pop();
          const d = await opfsEnsureDir(dir, parts);
          try { await d.removeEntry(name, { recursive: true }); } catch (e) {}
        }).catch(() => {});
      },

      moveOpfsAsync(oldPath, newPath) {
        // OPFS has no native move: copy bytes then delete the source
        opfsGameDir(false).then(async (dir) => {
          try {
            const oldParts = oldPath.split('/');
            const oldName = oldParts.pop();
            const oldDir = await opfsEnsureDir(dir, oldParts);
            const fh = await oldDir.getFileHandle(oldName, { create: false });
            const blob = await fh.getFile();
            const newParts = newPath.split('/');
            const newName = newParts.pop();
            const newDir = await opfsEnsureDir(dir, newParts);
            const nfh = await newDir.getFileHandle(newName, { create: true });
            const w = await nfh.createWritable();
            await w.write(blob);
            await w.close();
            try { await oldDir.removeEntry(oldName); } catch (e) {}
          } catch (err) {
            console.warn('OPFS move failed', err);
          }
        }).catch(() => {});
      }
    };

    // Patch in ErrnoError once the runtime is up
    function bindErrnoError() {
      if (Module.FS && Module.FS.ErrnoError) {
        GameFS.ErrnoError = Module.FS.ErrnoError;
      }
    }

    // ---------------------------- Startup / storage ----------------------------

    let g_bridgeInitBusy = false;

    // TEMPORARY: the game folder is picked on every start and read directly
    // from disk; nothing but savegames/settings is copied into OPFS.
    // A game downloaded from ARCHIVE_URLS or unpacked from a ZIP is installed
    // into OPFS in both modes.
    const DIRECT_FOLDER_MODE = true;

    // The whole game: a ZIP archive (game folder with Data/ inside, any nesting)
    // or a chunked pack (manifest.json, tools/pack_web.py; chunks next to it).
    // Further links are mirrors of the same pack, used when the first one fails.
    // Overridden by ?archive=<url>. The server must allow CORS; mirrorhost share
    // links are rewritten to their CORS-enabled download host.
    const ARCHIVE_URLS = [
      'https://example.invalid/removed',
      'https://example.invalid/removed',
      'https://example.invalid/removed'
    ];

    // OPFS root entries next to the game directory
    const DL_ZIP = 'gothic-download' + GAME_SUF + '.zip';     // archive being downloaded
    const DL_STATE = 'gothic-download' + GAME_SUF + '.json';  // {url, total} of that download
    const INSTALL_MARK = 'gothic-install' + GAME_SUF + '.json'; // written once the game is unpacked
    const CHUNK_STATE = 'gothic-chunks' + GAME_SUF + '.json'; // chunks installed from a manifest.json pack

    // savegames and settings written by the engine (see loadPersistedFiles)
    function isPersistedPath(rel) {
      return /^[^/]+\.(sav|ini)$/i.test(rel) || /^saves[^/]*\//i.test(rel);
    }

    // ?archive=<url> overrides the built-in links
    function archiveUrls() {
      const q = new URLSearchParams(location.search).get('archive');
      return (q ? [q] : ARCHIVE_URLS).map(normalizeArchiveUrl);
    }

    function normalizeArchiveUrl(u) {
      // absolute links only; "/path" addresses a file on this server
      const url = u.startsWith('/') && !u.startsWith('//') ? new URL(u, location.href) : new URL(u);
      if (url.protocol !== 'https:' && url.protocol !== 'http:')
        throw new Error('not an http(s) link');
      // www.mirrorhost.com answers with a redirect that has no CORS headers;
      // dl.mirrorhostusercontent.com serves the same file with CORS and Range
      if (/(^|\.)mirrorhost\.com$/i.test(url.hostname)) {
        url.hostname = 'dl.mirrorhostusercontent.com';
        url.searchParams.delete('st');
        url.searchParams.delete('e');
        url.searchParams.set('dl', '1');
      }
      return url.href;
    }

    async function readRootJson(name) {
      try {
        const root = await navigator.storage.getDirectory();
        const f = await (await root.getFileHandle(name)).getFile();
        return JSON.parse(await f.text());
      } catch (e) {
        return null;
      }
    }

    async function writeRootJson(name, obj) {
      const root = await navigator.storage.getDirectory();
      const w = await (await root.getFileHandle(name, { create: true })).createWritable();
      await w.write(JSON.stringify(obj));
      await w.close();
    }

    async function removeRootEntry(name) {
      try { await (await navigator.storage.getDirectory()).removeEntry(name, { recursive: true }); } catch (e) {}
    }

    function mb(bytes) { return (bytes / 1048576).toFixed(0); }

    function showSourceButtons(show) {
      sourceRow.style.display = show ? 'flex' : 'none';
    }

    // The game starts by itself: an installed game is mounted and launched,
    // otherwise the archive download begins right away. The offline buttons
    // stay available and stop the download when used.
    async function bootstrap() {
      try {
        g_langIndex = await loadLangIndex();
        await applyLinkLanguages();
        await initGameSelect();
        if (g_langIndex) await adoptLiveVoice();
        if (g_langIndex) await initLangBar();
        // Apply on the language bar: install the chosen packs instead of mounting
        const applyLang = !!g_langIndex && lsGet(LANG_APPLY) === '1';
        lsSet(LANG_APPLY, null);
        const installed = await readRootJson(INSTALL_MARK);
        // without the direct mode a game imported into OPFS is used as well
        if (!applyLang && (installed || !DIRECT_FOLDER_MODE)) {
          await g_runtimeReady;
          if (await mountInstalledGame()) {
            startGame();
            return;
          }
        }
      } catch (e) {
        console.warn('bootstrap error:', e);
      }
      showSourceButtons(true);
      progressContainer.style.display = 'none';
      downloadGame();
    }

    // an offline source replaces the download: stop it, and continue it
    // again when the file dialog is dismissed without a choice
    function pickOffline(inputId) {
      if (g_gameReady) return;
      const input = document.getElementById(inputId);
      pauseInstall();
      input.value = '';
      input.addEventListener('cancel', () => {
        if (!g_gameReady && !g_installWorker && !g_offlineBusy) downloadGame();
      }, { once: true });
      input.click();
    }
    let g_offlineBusy = false;

    // Mounts the game installed into OPFS (downloaded, unpacked or imported).
    // Returns false when there is no game there.
    async function mountInstalledGame() {
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return false; }
      const all = [];
      await opfsWalk(dir, '', all);
      if (!all.some(f => f.path.toLowerCase().startsWith('data/')))
        return false;

      // savegames/settings are rewritten by the game: they are kept in memory
      // (and persisted on close), the bridge only holds read-only game files
      const listing = all.filter(f => !isPersistedPath(f.path));
      const totalBytes = listing.reduce((a, f) => a + f.size, 0);
      setStatus('Preparing...');

      // Build the registry (directories inferred from paths)
      GameFS.rootEntry = { path: '', isDir: true, size: 0, node: null };
      GameFS.addEntry('', true);
      const addPath = (path, size) => {
        const parts = path.split('/'); parts.pop();
        let cur = '';
        for (const p of parts) { cur = cur ? cur + '/' + p : p; GameFS.addEntry(cur, true); }
        return GameFS.addEntry(path, false, size);
      };
      for (const f of listing) addPath(f.path, f.size).mem = null;

      // Choose a backend for file contents
      const canLazy = typeof SharedArrayBuffer !== 'undefined' && self.crossOriginIsolated;
      if (canLazy) {
        try {
          await initLazyBackend(listing.map(f => f.path));
        } catch (err) {
          console.warn('Lazy backend failed, falling back to preload:', err);
          GameFS.lazy = false;
        }
      }
      if (!GameFS.lazy) {
        await preloadAllFiles(listing);
      }

      for (const p of await loadPersistedFiles()) {
        const e = addPath(p.path, p.mem.length);
        e.mem = p.mem;
        e.hIdx = -1;
      }

      Module.FS.mkdir(GAME_ROOT);
      Module.FS.mount(GameFS, {}, GAME_ROOT);

      showSourceButtons(false);
      retryBtn.style.display = 'none';
      progressContainer.style.display = 'none';
      statusText.style.color = '';
      setStatus('Starting...');
      clearBtn.style.display = 'inline-flex';
      g_gameReady = true;
      return true;
    }

    // ---------------------------- Download / install ----------------------------

    let g_installWorker = null;

    function runInstallWorker(msg, onProgress) {
      return new Promise((resolve, reject) => {
        const src = document.getElementById('install-worker-src').textContent;
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        const worker = new Worker(url);
        URL.revokeObjectURL(url);
        g_installWorker = { worker, reject };
        const finish = () => { worker.terminate(); g_installWorker = null; };
        worker.onerror = (e) => { finish(); reject(new Error('install worker: ' + e.message)); };
        worker.onmessage = (e) => {
          const m = e.data;
          if (m.type === 'progress') {
            onProgress(m);
          } else if (m.type === 'done') {
            finish(); resolve(m.result);
          } else if (m.type === 'error') {
            finish();
            const err = new Error(m.msg);
            err.name = m.name || 'Error';
            reject(err);
          }
        };
        worker.postMessage(Object.assign({
          gameDirName: OPFS_ROOT_DIR,
          skip: IMPORT_SKIP,
          persisted: [/^[^/]+\.(sav|ini)$/i, /^saves[^/]*\//i]
        }, msg));
      });
    }

    function pauseInstall() {
      if (!g_installWorker) return;
      const { worker, reject } = g_installWorker;
      worker.terminate();
      g_installWorker = null;
      const err = new Error('paused');
      err.paused = true;
      reject(err);
    }

    function fmtTime(sec) {
      if (!isFinite(sec) || sec < 0) return '…';
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
    }

    function makeProgressReporter() {
      let t0 = 0, b0 = 0, speed = 0;
      return (m) => {
        const pct = m.total ? Math.min(100, Math.floor(m.done / m.total * 100)) : 0;
        if (m.phase === 'download') {
          const now = performance.now();
          if (!t0) { t0 = now; b0 = m.done; }
          else if (now - t0 > 1000) {
            const s = (m.done - b0) / ((now - t0) / 1000);
            speed = speed ? speed * 0.7 + s * 0.3 : s;
            t0 = now; b0 = m.done;
          }
          let msg = 'Downloading: ' + mb(m.done) + ' / ' + (m.total ? mb(m.total) : '?') + ' MB';
          if (speed > 0)
            msg += ' · ' + (speed / 1048576).toFixed(1) + ' MB/s · ' + fmtTime((m.total - m.done) / speed);
          setStatus(msg, pct);
        } else if (m.phase === 'retry') {
          setStatus('Network error, retry ' + m.attempt + '/' + m.max);
        } else if (m.phase === 'extract') {
          setStatus('Unpacking: ' + m.index + ' / ' + m.count + ' (' + pct + '%)', pct);
        }
      };
    }

    function installError(err, what, retry) {
      if (err.paused) {
        statusText.style.color = '';
        setStatus('Download stopped');
        progressContainer.style.display = 'none';
      } else {
        console.error(what, err);
        statusText.style.color = 'var(--danger)';
        let msg = err.message || String(err);
        if (err.name === 'QuotaExceededError')
          msg = 'not enough browser storage';
        else if (err.name === 'TypeError' && /fetch/i.test(msg))
          msg = 'cannot reach the archive server (' + msg + ')';
        setStatus(what + ': ' + msg);
      }
      showSourceButtons(true);
      if (!err.paused && retry) retryBtn.style.display = 'inline-block';
    }

    let g_downloading = false;
    // set by web/threads_check.js when a threaded build runs on a page that is
    // not cross-origin isolated: the engine cannot start, keep its message
    function isolationBlocked() {
      if (!window.__ogIsolationError) return false;
      progressContainer.style.display = 'none';
      statusText.style.color = 'var(--danger)';
      statusText.innerText = window.__ogIsolationError;
      return true;
    }

    async function downloadGame() {
      if (g_langIndex) return installLanguagePacks();
      if (GAME_ID === 'g2') {
        // the single archive (?archive=, game_web.zip) is Gothic 1
        progressContainer.style.display = 'none';
        showSourceButtons(false);
        statusText.style.color = 'var(--danger)';
        statusText.innerText = 'Gothic 2 is not available on this server (no ' + langDir('g2') + '/languages.json). Pick Gothic 1 in the bar above.';
        return;
      }
      if (isolationBlocked()) return;
      if (await webgpuBlocked()) return;
      if (g_gameReady || g_installWorker || g_offlineBusy || g_downloading) return;
      let urls, url;
      try {
        urls = archiveUrls();
        url = urls[0];
      } catch (e) {
        installError(new Error('invalid archive link'), 'Error', false);
        return;
      }
      g_downloading = true;
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus('Connecting...');
      // keep the browser from evicting a multi-GB install under storage pressure
      try { if (navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}

      let state = await readRootJson(DL_STATE);
      if (state && state.url !== url) {
        await removeRootEntry(DL_ZIP);
        state = null;
      }
      const report = makeProgressReporter();
      try {
        // a link to manifest.json is a chunked pack (tools/pack_web.py): chunks
        // are unpacked while the next ones download
        if (/\/manifest\.json$/i.test(new URL(url).pathname)) {
          const res = await runInstallWorker({ type: 'chunks', urls, stateName: CHUNK_STATE }, report);
          await finishInstall({ source: url, archiveBytes: res.download }, res);
          return;
        }
        const dl = await runInstallWorker({ type: 'download', url, zipName: DL_ZIP, stateName: DL_STATE,
                                            expectTotal: state ? state.total : 0 }, report);
        setStatus('Checking...', 0);
        const res = await runInstallWorker({ type: 'extract', zipName: DL_ZIP, deleteZip: true }, report);
        await finishInstall({ source: url, archiveBytes: dl.total }, res);
      } catch (err) {
        installError(err, 'Error', true);
      } finally {
        g_downloading = false;
      }
    }

    // ------------------------- language packs (test) -------------------------
    // The server may offer lang/languages.json (tools/pack_langs.py): a shared
    // base pack plus, per language, a text pack and a voice pack. The bar above
    // the player picks the text and the voice language independently. A choice
    // is applied at the next start (Apply reloads the page): the packs of the
    // choice are installed over the base and the game mounts as usual.
    // ?langs=<url of languages.json> overrides the address.
    const LANG_STATE = 'gothic-langs' + GAME_SUF + '.json';  // {text, voice, files:{base,text,voice}} of the installed game
    const LANG_SEL = 'langSel' + GAME_SUF;              // localStorage: {text, voice} chosen on the bar
    const LANG_APPLY = 'langApply' + GAME_SUF;          // localStorage: install the choice at this start
    let g_langIndex = null;
    let g_langBase = '';

    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }

    // folder of the language packs of a game on the server (tools/pack_langs.py output)
    function langDir(game) { return game === 'g2' ? 'lang_g2' : 'lang'; }

    async function loadLangIndex() {
      try {
        const q = new URLSearchParams(location.search).get('langs');
        const r = await fetch(new URL(q || langDir(GAME_ID) + '/languages.json', location.href).href, { cache: 'no-store' });
        if (!r.ok) return null;
        const idx = await r.json();
        if (idx.version !== 1 || !idx.base || !Array.isArray(idx.languages)) return null;
        g_langBase = new URL('.', r.url).href;
        return idx;
      } catch (e) {
        return null;
      }
    }

    // the choice made on the bar; first start: Russian when the server has it
    function langSelection() {
      let s = null;
      try { s = JSON.parse(lsGet(LANG_SEL)); } catch (e) {}
      const text = g_langIndex.languages.filter(l => l.text);
      const voice = g_langIndex.languages.filter(l => l.voice);
      const pick = (list, id) => (list.find(l => l.id === id) || list.find(l => l.id === 'ru') || list[0] || {}).id;
      return { text: pick(text, s && s.text), voice: pick(voice, s && s.voice) };
    }

    // The game selector of the bar: both games are offered when the server has language packs of them.
    // A change reloads the page (every game has its own folder, saves and settings).
    // the languages of the link (see LINK_CHOICE): they are taken as the choice of the bar; installed with
    // other languages, the game installs these at this start
    async function applyLinkLanguages() {
      if (!g_langIndex || !(LINK_CHOICE.text || LINK_CHOICE.voice)) return;
      const L = id => g_langIndex.languages.find(l => l.id === id);
      const cur = langSelection();
      const text = LINK_CHOICE.text && L(LINK_CHOICE.text) && L(LINK_CHOICE.text).text ? LINK_CHOICE.text : cur.text;
      const voice = LINK_CHOICE.voice && L(LINK_CHOICE.voice) && L(LINK_CHOICE.voice).voice ? LINK_CHOICE.voice : cur.voice;
      lsSet(LANG_SEL, JSON.stringify({ text, voice }));
      const st = await readRootJson(LANG_STATE);
      if (!st || st.text !== text || st.voice !== voice) lsSet(LANG_APPLY, '1');
    }

    async function initGameSelect() {
      const sel = document.getElementById('game-select');
      const has = {};
      for (const g of ['g1', 'g2']) {
        try {
          const r = await fetch(new URL(langDir(g) + '/languages.json', location.href).href, { method: 'HEAD', cache: 'no-store' });
          has[g] = r.ok;
        } catch (e) { has[g] = false; }
      }
      for (const o of sel.options) o.disabled = !has[o.value] && o.value !== GAME_ID;
      sel.value = GAME_ID;
      if (has.g1 && has.g2 || !has[GAME_ID]) {
        document.getElementById('lang-bar').hidden = false;
        document.body.classList.add('has-lang');
      } else {
        sel.closest('label').hidden = true; // only one game on this server
      }
    }

    function gameChosen() {
      const sel = document.getElementById('game-select');
      if (sel.value === GAME_ID) return;
      if (g_gameReady && !confirm('The game restarts to switch to ' + sel.options[sel.selectedIndex].text +
                                  '. Unsaved progress is lost. Continue?')) {
        sel.value = GAME_ID;
        return;
      }
      lsSet('game', sel.value === 'g2' ? '2' : '1');
      const url = new URL(location.href);
      url.searchParams.delete('game');
      location.href = url.href;
    }

    async function initLangBar() {
      const st = await readRootJson(LANG_STATE);
      // a choice waiting for its install (Apply) is shown, otherwise what is installed
      const sel = st && lsGet(LANG_APPLY) !== '1' ? { text: st.text, voice: st.voice } : langSelection();
      const fill = (el, kind, cur) => {
        el.textContent = '';
        for (const l of g_langIndex.languages) {
          if (!l[kind]) continue;
          const o = document.createElement('option');
          o.value = l.id;
          o.textContent = l.name + ' (' + mb(l[kind].size) + ' MB)';
          o.selected = l.id === cur;
          el.appendChild(o);
        }
      };
      fill(document.getElementById('lang-text'), 'text', sel.text);
      fill(document.getElementById('lang-voice'), 'voice', sel.voice);
      document.getElementById('lang-note').textContent = st ? '' : 'game installed without language packs';
      document.getElementById('lang-text-label').hidden = false;
      document.getElementById('lang-voice-label').hidden = false;
      document.getElementById('lang-apply').style.display = '';
      document.getElementById('lang-bar').hidden = false;
      document.body.classList.add('has-lang');
    }

    async function applyLanguages() {
      const sel = { text: document.getElementById('lang-text').value, voice: document.getElementById('lang-voice').value };
      const st = await readRootJson(LANG_STATE);
      const note = document.getElementById('lang-note');
      if (st && st.text === sel.text && st.voice === sel.voice) {
        note.textContent = 'this choice is already installed';
        return;
      }
      // only the voice changes in a running game: it is swapped without a restart
      if (g_gameReady && st && st.text === sel.text) {
        const v = g_langIndex.languages.find(l => l.id === sel.voice);
        if (v && v.voice) { swapVoiceLive(v); return; }
      }
      if (g_gameReady && !confirm('The game restarts to change the language. Unsaved progress is lost. Continue?'))
        return;
      lsSet(LANG_SEL, JSON.stringify(sel));
      lsSet(LANG_APPLY, '1');
      location.reload();
    }

    // removeEntry that waits while the previous page (before a reload) still holds the file
    async function removeEntryRetry(dir, name) {
      for (let tries = 0; ; tries++) {
        try { await dir.removeEntry(name, { recursive: true }); return; }
        catch (e) {
          if (e.name === 'NotFoundError') return;
          if (e.name !== 'NoModificationAllowedError' || tries >= 60) throw e;
          await new Promise(r => setTimeout(r, 250));
        }
      }
    }

    // Removes game files that do not belong to the install: with `expected` (a Set of paths)
    // everything under Data/ and _work/ that is not in it (an older language's archives,
    // cutscenes, scripts); without it every game file. Savegames and settings stay.
    async function pruneGameFiles(expected) {
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return 0; }
      let removed = 0;
      async function walk(d, prefix) {
        const list = [];
        for await (const e of d.entries()) list.push(e);
        for (const [name, h] of list) {
          const path = prefix + name;
          if (h.kind === 'directory') {
            if (!prefix && /^saves/i.test(name)) continue;
            await walk(h, path + '/');
            continue;
          }
          if (isPersistedPath(path)) continue;
          if (expected && (expected.has(path) || !/^(data|_work)\//i.test(path))) continue;
          await removeEntryRetry(d, name);
          removed++;
        }
      }
      await walk(dir, '');
      return removed;
    }

    // --------------------- voice language in a running game ---------------------
    // The new voice pack is downloaded into its own OPFS folder (the files of the current voice
    // are in use), read through a second bridge worker and mounted over the old archives by the
    // engine (dialogue lines are read from the archives when they are spoken). The next start
    // moves the new files into the game folder (adoptLiveVoice) in place of the old ones.
    const LIVE_VOICE_DIR = 'gothic-voice' + GAME_SUF + '-';
    const LIVE_VOICE_STATE = 'gothic-voice-live' + GAME_SUF + '-';
    let g_liveBusy = false;
    let g_liveSeq = 0;

    function voiceBar(text, pct) {
      document.getElementById('voice-bar').classList.toggle('idle', text === null);
      document.getElementById('voice-text').textContent = text || '';
      document.getElementById('voice-fill').style.width = (pct || 0) + '%';
    }

    // a bridge worker (see makeBridgeWorkerSource) over File objects: they are read without locking
    function startVoiceBridge(files) {
      return new Promise((resolve, reject) => {
        const cmdSab = new SharedArrayBuffer(8 * 4);
        const dataSab = new SharedArrayBuffer(BRIDGE_CHUNK);
        const cmd = new Int32Array(cmdSab);
        const data = new Uint8Array(dataSab);
        const url = URL.createObjectURL(new Blob([makeBridgeWorkerSource()], { type: 'text/javascript' }));
        const worker = new Worker(url);
        URL.revokeObjectURL(url);
        worker.onerror = (e) => reject(new Error('voice bridge: ' + e.message));
        worker.postMessage({ type: 'init', cmd: cmdSab, data: dataSab, files });
        const wait = () => {
          if (Atomics.load(cmd, 6) !== 1) { setTimeout(wait, 20); return; }
          if (Atomics.load(cmd, 7) !== 0) reject(new Error('voice bridge init failed'));
          else resolve({ worker, cmd, data });
        };
        wait();
      });
    }

    async function swapVoiceLive(voice) {
      if (g_liveBusy) return;
      g_liveBusy = true;
      const note = document.getElementById('lang-note');
      const applyBtn = document.getElementById('lang-apply');
      applyBtn.disabled = true;
      note.textContent = '';
      try {
        const url = new URL(voice.voice.path, g_langBase).href;
        const man = await (await fetch(url, { cache: 'no-store' })).json();
        const dirName = LIVE_VOICE_DIR + voice.id;
        const stateName = LIVE_VOICE_STATE + voice.id + '.json';
        voiceBar('Voice ' + voice.name + ': connecting...', 0);
        await runInstallWorker({ type: 'chunks', urls: [url], stateName, gameDirName: dirName }, (m) => {
          if (m.phase === 'download')
            voiceBar('Voice ' + voice.name + ': ' + mb(m.done) + ' / ' + mb(m.total) + ' MB',
                     m.total ? Math.min(100, Math.floor(m.done / m.total * 100)) : 0);
          else if (m.phase === 'retry')
            voiceBar('Voice ' + voice.name + ': network error, retry ' + m.attempt + '/' + m.max, 0);
        });

        voiceBar('Voice ' + voice.name + ': applying...', 100);
        const root = await navigator.storage.getDirectory();
        const vdir = await root.getDirectoryHandle(dirName);
        const archives = [];
        for (const f of man.files) {
          if (!/^data\/speech[^/]*\.vdf$/i.test(f.path)) continue;
          const parts = f.path.split('/');
          const name = parts.pop();
          let d = vdir;
          for (const seg of parts) d = await d.getDirectoryHandle(seg);
          archives.push({ path: f.path, file: await (await d.getFileHandle(name)).getFile() });
        }
        if (!archives.length) throw new Error('no speech archive in the voice pack');
        const br = await startVoiceBridge(archives.map(a => a.file));
        let mounted = 0;
        g_liveSeq++;
        archives.forEach((a, i) => {
          const vname = 'voice_live' + g_liveSeq + '_' + a.path.split('/').pop();
          const e = GameFS.addEntry('Data/' + vname, false, a.file.size);
          e.hIdx = i;
          e.br = br;
          if (Module.ccall('og_voice_mount', 'number', ['string'], [GAME_ROOT + '/Data/' + vname]) === 1) mounted++;
        });
        if (!mounted) throw new Error('the engine could not mount the voice archives');

        // the next start moves these files into the game folder (adoptLiveVoice)
        const st = await readRootJson(LANG_STATE);
        const prev = st.liveVoice;
        const prevVoice = prev ? prev.prevVoice : st.voice; // the voice the files on disk belong to
        st.voice = voice.id;
        st.liveVoice = { id: voice.id, prevVoice, dir: dirName, state: stateName, files: man.files.map(f => f.path),
                         dirs: [...new Set([...(prev ? prev.dirs : []), dirName])] };
        await writeRootJson(LANG_STATE, st);
        lsSet(LANG_SEL, JSON.stringify({ text: st.text, voice: voice.id }));
        voiceBar('Voice ' + voice.name + ': ready', 100);
        note.textContent = 'voice changed to ' + voice.name;
        setTimeout(() => voiceBar(null), 4000);
      } catch (err) {
        console.error('voice change failed:', err);
        voiceBar('Voice change failed: ' + String(err && err.message || err), 0);
      } finally {
        applyBtn.disabled = false;
        g_liveBusy = false;
      }
    }

    async function removeGamePath(dir, path) {
      try {
        const parts = path.split('/');
        const name = parts.pop();
        let d = dir;
        for (const seg of parts) d = await d.getDirectoryHandle(seg);
        await removeEntryRetry(d, name);
      } catch (e) { /* already gone */ }
    }

    // moves a file between OPFS folders (copies where move() is missing)
    async function moveOpfsFile(srcDir, name, destDir, newName) {
      const fh = await srcDir.getFileHandle(name);
      try { await fh.move(destDir, newName); return; } catch (e) { /* copy instead */ }
      const w = await (await destDir.getFileHandle(newName, { create: true })).createWritable();
      await (await fh.getFile()).stream().pipeTo(w);
    }

    // at a start after a live voice change: the downloaded voice files take the place of the old ones
    async function adoptLiveVoice() {
      const st = await readRootJson(LANG_STATE);
      if (!st || !st.liveVoice) return;
      const lv = st.liveVoice;
      const root = await navigator.storage.getDirectory();
      let vdir = null;
      try { vdir = await root.getDirectoryHandle(lv.dir); } catch (e) {}
      if (vdir) {
        const game = await opfsGameDir(true);
        for (const p of st.files.voice) await removeGamePath(game, p);
        for (const p of lv.files) {
          const parts = p.split('/');
          const name = parts.pop();
          try {
            let sd = vdir;
            for (const seg of parts) sd = await sd.getDirectoryHandle(seg);
            const dd = await opfsEnsureDir(game, parts);
            await removeGamePath(game, p);
            await moveOpfsFile(sd, name, dd, name);
          } catch (e) { /* a file the installer skips */ }
        }
        // the pack counts as installed in the game folder: same state, new place
        const ls = await readRootJson(lv.state);
        if (ls) await writeRootJson('gothic-chunks-voice.json', ls);
        st.files.voice = lv.files;
      } else {
        st.voice = lv.prevVoice; // the new files are gone: the old voice is still in the game folder
      }
      for (const d of lv.dirs) {
        await removeRootEntry(d);
        await removeRootEntry(LIVE_VOICE_STATE + d.slice(LIVE_VOICE_DIR.length) + '.json');
      }
      delete st.liveVoice;
      await writeRootJson(LANG_STATE, st);
    }

    // every file of a pack is in the game directory with the size the pack says
    async function packIntact(files) {
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return false; }
      const dirs = new Map([['', dir]]);
      // what the installer skips (junk) or leaves to the game (savegames, settings) is not checked
      for (const f of files.filter(f => shouldImport(f.path) && !isPersistedPath(f.path))) {
        try {
          const parts = f.path.split('/');
          const name = parts.pop();
          let key = '', d = dir;
          for (const seg of parts) {
            key += '/' + seg;
            if (!dirs.has(key)) dirs.set(key, await d.getDirectoryHandle(seg));
            d = dirs.get(key);
          }
          if ((await (await d.getFileHandle(name)).getFile()).size !== f.size) return false;
        } catch (e) {
          return false;
        }
      }
      return true;
    }

    async function installLanguagePacks() {
      if (isolationBlocked()) return;
      if (await webgpuBlocked()) return;
      if (g_gameReady || g_installWorker || g_offlineBusy || g_downloading) return;
      const sel = langSelection();
      const L = id => g_langIndex.languages.find(l => l.id === id);
      const text = L(sel.text), voice = L(sel.voice);
      g_downloading = true;
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus('Connecting...');
      try { if (navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
      try {
        if (!text || !text.text || !voice || !voice.voice) throw new Error('no such language pack');
        const steps = [
          { key: 'base', info: g_langIndex.base, state: 'gothic-chunks-base.json' },
          { key: 'text', info: text.text, state: 'gothic-chunks-text.json', lang: text.id },
          { key: 'voice', info: voice.voice, state: 'gothic-chunks-voice.json', lang: voice.id }
        ];
        for (const s of steps) {
          s.url = new URL(s.info.path, g_langBase).href;
          const man = await (await fetch(s.url, { cache: 'no-store' })).json();
          s.files = man.files.map(f => f.path);
          s.sizes = man.files;
        }
        // the chunk state says "done" also after the files were deleted (Delete game, evicted
        // storage): a pack whose files are not all there is installed again
        for (const s of steps) {
          if (!await packIntact(s.sizes)) await removeRootEntry(s.state);
        }

        // a pack that changes starts from scratch; a game installed another way is cleared
        const old = await readRootJson(LANG_STATE);
        await removeRootEntry(INSTALL_MARK);
        if (!old) {
          await pruneGameFiles(null);
          for (const s of steps) await removeRootEntry(s.state);
        } else {
          for (const s of steps)
            if (s.key !== 'base' && old[s.key] !== s.lang) await removeRootEntry(s.state);
        }

        const total = steps.reduce((a, s) => a + s.info.size, 0);
        const report = makeProgressReporter();
        let before = 0;
        const files = {};
        let bytes = 0, count = 0;
        for (const s of steps) {
          const res = await runInstallWorker({ type: 'chunks', urls: [s.url], stateName: s.state }, (m) =>
            report(m.phase === 'download' ? Object.assign({}, m, { done: before + m.done, total }) : m));
          before += s.info.size;
          files[s.key] = s.files;
          bytes += res.bytes;
          count += res.files;
        }
        // what the previous choice left behind (its speech archives, cutscenes, scripts) must go:
        // two languages side by side would both be mounted
        const removed = await pruneGameFiles(new Set(steps.flatMap(s => s.files)));
        if (removed) console.log('[SHELL] removed', removed, 'files of the previous language');
        await writeRootJson(LANG_STATE, { text: text.id, voice: voice.id, files });
        lsSet(LANG_SEL, JSON.stringify({ text: text.id, voice: voice.id }));
        document.getElementById('lang-note').textContent = '';
        await finishInstall({ source: 'language packs ' + text.id + '/' + voice.id, archiveBytes: total },
                            { files: count, bytes, download: total });
      } catch (err) {
        installError(err, 'Error', true);
      } finally {
        g_downloading = false;
      }
    }

    async function installFromZip(file) {
      if (g_gameReady || g_installWorker) return;
      g_offlineBusy = true;
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus('Reading...');
      try {
        const res = await runInstallWorker({ type: 'extract', blob: file }, makeProgressReporter());
        await finishInstall({ source: 'file:' + file.name, archiveBytes: file.size }, res);
      } catch (err) {
        g_offlineBusy = false;
        installError(err, 'Error', true);
      }
    }

    async function finishInstall(info, res) {
      await writeRootJson(INSTALL_MARK, Object.assign(info, res, { date: new Date().toISOString() }));
      await removeRootEntry(DL_ZIP);
      await removeRootEntry(DL_STATE);
      await removeRootEntry(CHUNK_STATE);
      console.log('[SHELL] game installed:', res.files, 'files,', mb(res.bytes), 'MB');
      await g_runtimeReady;
      if (!await mountInstalledGame())
        throw new Error('game not found after unpacking');
      startGame();
    }

    function initLazyBackend(paths, files) {
      return new Promise((resolve, reject) => {
        const cmdSab = new SharedArrayBuffer(8 * 4);
        const dataSab = new SharedArrayBuffer(BRIDGE_CHUNK);
        const cmd = new Int32Array(cmdSab);
        const data = new Uint8Array(dataSab);
        cmd[0] = 0; cmd[6] = 0;

        const src = makeBridgeWorkerSource();
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        const worker = new Worker(url);
        worker.onerror = (e) => reject(new Error('bridge worker: ' + e.message));
        worker.onmessage = (e) => {
          if (e.data && e.data.type === 'error')
            console.error('bridge openAll failed:', e.data.msg);
        };

        // send init; the worker fills handles and notifies cmd[6].
        // SharedArrayBuffers are shared, not transferred — no transfer list.
        worker.postMessage({ type: 'init', cmd: cmdSab, data: dataSab, paths, files });

        const waitReady = () => {
          if (Atomics.load(cmd, 6) === 1) {
            if (Atomics.load(cmd, 7) !== 0) {
              reject(new Error('bridge init failed'));
              return;
            }
            GameFS.lazy = true;
            GameFS.bridge = { worker, cmd, data };
            // map file entries to handle indexes (order of the paths array)
            let i = 0;
            for (const p of paths) {
              const e = GameFS.files.get(GameFS.lower(p));
              if (e) e.hIdx = i;
              i++;
            }
            resolve();
            return;
          }
          setTimeout(waitReady, 50);
        };
        waitReady();
      });
    }

    async function preloadAllFiles(listing) {
      const dir = await opfsGameDir(false);
      const totalBytes = listing.reduce((a, f) => a + f.size, 0);
      let doneBytes = 0;
      let idx = 0;
      for (const f of listing) {
        const parts = f.path.split('/');
        const name = parts.pop();
        const d = await opfsEnsureDir(dir, parts);
        const fh = await d.getFileHandle(name, { create: false });
        const buf = new Uint8Array(await (await fh.getFile()).arrayBuffer());
        const e = GameFS.files.get(GameFS.lower(f.path));
        if (e) { e.mem = buf; e.size = buf.length; }
        doneBytes += f.size;
        idx++;
        if ((idx & 7) === 0 || idx === listing.length) {
          setStatus('Downloading: ' + (doneBytes / 1048576).toFixed(0) + ' / ' + (totalBytes / 1048576).toFixed(0) + ' MB',
                    Math.round((doneBytes / Math.max(1, totalBytes)) * 100));
          await new Promise(r => setTimeout(r, 0));
        }
      }
    }

    // removes the installed game, keeping savegames and settings
    async function clearStorage() {
      if (!confirm("Delete the game files from the browser? Savegames are kept.")) return;
      // the bridge worker holds locks on every game file
      if (GameFS.bridge) { GameFS.bridge.worker.terminate(); GameFS.bridge = null; }
      try {
        const dir = await opfsGameDir(false);
        const names = [];
        for await (const [name, h] of dir.entries()) {
          if (!(h.kind === 'file' && /\.(sav|ini)$/i.test(name)) && !(h.kind === 'directory' && /^saves/i.test(name)))
            names.push(name);
        }
        for (const name of names) await dir.removeEntry(name, { recursive: true });
      } catch (e) {
        console.warn('clearStorage:', e);
      }
      await removeRootEntry(INSTALL_MARK);
      await removeRootEntry(DL_ZIP);
      await removeRootEntry(DL_STATE);
      await removeRootEntry(CHUNK_STATE);
      await removeRootEntry(LANG_STATE);
      for (const k of ['base', 'text', 'voice']) await removeRootEntry('gothic-chunks-' + k + '.json');
      try {
        indexedDB.deleteDatabase('/gothic'); // legacy IDBFS database
        indexedDB.deleteDatabase('emscripten-fs'); // legacy runtime database
      } catch (e) {}
      setStatus('Deleted');
      setTimeout(() => location.reload(), 800);
    }

    // ---------------------------- Import ----------------------------

    async function onFolderSelected(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      g_offlineBusy = true;
      if (DIRECT_FOLDER_MODE)
        await mountFolderDirect(files);
      else
        await importFilesList(files);
    }

    // small files the game wrote earlier (savegames, Gothic.ini) live in OPFS
    async function loadPersistedFiles() {
      const out = [];
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return out; }
      for await (const [name, h] of dir.entries()) {
        if (h.kind === 'file' && /\.(sav|ini)$/i.test(name)) {
          out.push({ path: name, mem: new Uint8Array(await (await h.getFile()).arrayBuffer()) });
        } else if (h.kind === 'directory' && /^saves/i.test(name)) {
          const sub = [];
          await opfsWalk(h, name, sub);
          for (const f of sub) {
            const parts = f.path.split('/'); parts.shift();
            let d = h;
            for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
            const fh = await d.getFileHandle(parts[parts.length - 1]);
            out.push({ path: f.path, mem: new Uint8Array(await (await fh.getFile()).arrayBuffer()) });
          }
        }
      }
      return out;
    }

    // offline source failed: back to the download
    function offlineFailed(err) {
      g_offlineBusy = false;
      statusText.style.color = 'var(--danger)';
      setStatus('Error: ' + (err.message || err));
      progressContainer.style.display = 'none';
      showSourceButtons(true);
      retryBtn.style.display = 'inline-block';
    }

    async function mountFolderDirect(fileList) {
      g_offlineBusy = true;
      showSourceButtons(false);
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      try {
        const list = [];
        for (const file of fileList) {
          const rel = relPathOf(file);
          if (shouldImport(rel)) list.push({ rel, file });
        }
        if (!list.some(f => /^data\//i.test(f.rel)))
          throw new Error('no Data folder: select the root folder of the installed game');

        setStatus('Connecting...');
        GameFS.rootEntry = { path: '', isDir: true, size: 0, node: null };
        GameFS.addEntry('', true);
        const addPath = (path, size) => {
          const parts = path.split('/'); parts.pop();
          let cur = '';
          for (const p of parts) { cur = cur ? cur + '/' + p : p; GameFS.addEntry(cur, true); }
          return GameFS.addEntry(path, false, size);
        };
        for (const f of list) addPath(f.rel, f.file.size).mem = null;

        const canLazy = typeof SharedArrayBuffer !== 'undefined' && self.crossOriginIsolated;
        if (canLazy) {
          await initLazyBackend(list.map(f => f.rel), list.map(f => f.file));
        } else {
          // no cross-origin isolation: everything has to be read into memory
          let done = 0;
          const total = list.reduce((a, f) => a + f.file.size, 0);
          for (const f of list) {
            const e = GameFS.files.get(GameFS.lower(f.rel));
            e.mem = new Uint8Array(await f.file.arrayBuffer());
            done += f.file.size;
            setStatus('Downloading: ' + (done / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB',
                      Math.round(done / Math.max(1, total) * 100));
          }
        }

        // savegames/settings written in the browser override the folder copies
        for (const p of await loadPersistedFiles()) {
          const e = addPath(p.path, p.mem.length);
          e.mem = p.mem;
          e.hIdx = -1;
        }

        await g_runtimeReady;
        Module.FS.mkdir(GAME_ROOT);
        Module.FS.mount(GameFS, {}, GAME_ROOT);
        progressContainer.style.display = 'none';
        setStatus('Starting...');
        g_gameReady = true;
        startGame();
      } catch (err) {
        console.error('mount error:', err);
        offlineFailed(err);
      }
    }

    async function onZipSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      g_offlineBusy = true;
      await installFromZip(file);
    }

    function relPathOf(file) {
      let relPath = file.webkitRelativePath || file.name;
      const parts = relPath.split('/');
      if (parts.length > 1) {
        parts.shift(); // strip the top-level folder name
        relPath = parts.join('/');
      }
      return relPath.replace(/\\/g, '/');
    }

    async function importFilesList(files) {
      const list = [];
      let totalBytes = 0;
      for (const file of files) {
        const rel = relPathOf(file);
        if (!shouldImport(rel)) continue;
        list.push({ rel, file });
        totalBytes += file.size;
      }
      if (list.length === 0) {
        offlineFailed(new Error('no game files found in the selected folder'));
        return;
      }
      await importToOpfs(list, totalBytes);
    }

    async function importToOpfs(list, totalBytes) {
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      showSourceButtons(false);

      const dir = await opfsGameDir(true);
      let doneBytes = 0;
      let count = 0;
      const t0 = performance.now();
      try {
        for (const item of list) {
          const parts = item.rel.split('/');
          const name = parts.pop();
          if (!name) continue;
          const d = await opfsEnsureDir(dir, parts);
          const fh = await d.getFileHandle(name, { create: true });
          const writable = await fh.createWritable();
          if (item.file.stream) {
            await item.file.stream().pipeTo(writable);
          } else {
            await writable.write(item.file);
            await writable.close();
          }
          doneBytes += item.file.size;
          count++;
          setStatus('Importing [' + count + '/' + list.length + ']: ' + name + ' — ' +
                    (doneBytes / 1048576).toFixed(0) + ' / ' + (totalBytes / 1048576).toFixed(0) + ' MB',
                    Math.round((doneBytes / Math.max(1, totalBytes)) * 100));
          await new Promise(r => setTimeout(r, 0));
        }
        const secs = (performance.now() - t0) / 1000;
        console.log('Import done:', count, 'files in', secs.toFixed(1), 's');
        await writeRootJson(INSTALL_MARK, { source: 'folder', files: count, bytes: doneBytes, date: new Date().toISOString() });
        setStatus('Done');
        setTimeout(() => location.reload(), 600);
      } catch (err) {
        console.error('Import error:', err);
        offlineFailed(err);
      }
    }

    // Drag and drop support
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      uiOverlay.classList.add('drag-over');
    });

    window.addEventListener('dragleave', (e) => {
      uiOverlay.classList.remove('drag-over');
    });

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      uiOverlay.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (!files || files.length === 0 || g_gameReady) return;
      pauseInstall();
      g_offlineBusy = true;

      if (files.length === 1 && files[0].name.toLowerCase().endsWith('.zip')) {
        await installFromZip(files[0]);
      } else {
        await importFilesList(files);
      }
    });

    function ensureDummyDirs(base) {
      const dirs = [
        base,
        base + '/Data',
        base + '/_work',
        base + '/_work/Data',
        base + '/_work/Data/Scripts',
        base + '/_work/Data/Scripts/_compiled',
        base + '/system',
        base + '/saves'
      ];
      for (const d of dirs) {
        try {
          Module.FS.mkdir(d);
        } catch (e) {}
      }
    }

    // Why WebGPU is not usable here, as html for the status box (null: it is). Checked before the
    // game archive is downloaded, so nobody waits for 270 MB to read an error.
    let g_gpuAdapter = null;
    async function webgpuProblem() {
      const ua = navigator.userAgent || '';
      const check = ' <a href="gpucheck.html" style="color:inherit">Run the WebGPU check</a> and send its report if this is wrong.';
      if (!navigator.gpu) {
        let why;
        if (!window.isSecureContext)
          why = 'The page is not in a secure context, so the browser hides WebGPU. Open it over <b>https://</b> ' +
                '(accept the certificate warning) or through localhost, not over plain http://.';
        else if (/Firefox|FxiOS/.test(ua))
          why = 'This Firefox has no WebGPU' + (/Android/.test(ua) ? ' (Firefox for Android does not offer it yet)' : '') +
                '. Use Google Chrome.';
        else if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1))
          why = 'WebGPU needs iOS/iPadOS 26 or newer (Safari). Update the system, or use Google Chrome on a computer or an Android phone.';
        else if (/SamsungBrowser|EdgA|OPR|Opera|Brave|Vivaldi|DuckDuckGo|MiuiBrowser|UCBrowser|YaBrowser/.test(ua))
          why = 'This Chromium-based browser keeps WebGPU switched off. Open its flags page (chrome://flags, edge://flags, ' +
                'opera://flags, brave://flags) and enable <b>Unsafe WebGPU Support</b> (#enable-unsafe-webgpu), then restart it; ' +
                'or use Google Chrome.';
        else if (/Chrome\/(\d+)/.test(ua) && +RegExp.$1 < 121)
          why = 'This Chrome is too old for WebGPU (needs 121+ on Android, 113+ on computers). Update it.';
        else
          why = 'This browser does not offer WebGPU. Use a current Google Chrome (Android 12+, or a computer).';
        return why + check;
      }
      if (g_gpuAdapter) return null;
      let ad = null;
      for (const opt of [{ powerPreference: 'high-performance' }, {}, { forceFallbackAdapter: true }]) {
        try { ad = await navigator.gpu.requestAdapter(opt); } catch (e) { console.warn('[SHELL] requestAdapter', opt, e); }
        if (ad) break;
      }
      if (!ad) {
        const android = /Android/.test(ua);
        let how;
        if (/Firefox/.test(ua) && !android)
          how = 'In Firefox: <b>Settings &rarr; General &rarr; Performance</b>, untick &quot;Use recommended performance settings&quot; ' +
                'and tick <b>Use hardware acceleration when available</b>. If that is not enough, open <b>about:config</b> and set ' +
                '<b>dom.webgpu.enabled</b> and <b>gfx.webgpu.ignore-blocklist</b> to <b>true</b>, then restart Firefox.';
        else if (/Chrome\/\d+/.test(ua) && !android) {
          // the flags page of this browser (a page cannot link to it: the browser blocks such links)
          const flags = /Edg\//.test(ua) ? 'edge://flags' : /OPR\//.test(ua) ? 'opera://flags'
                      : navigator.brave ? 'brave://flags' : 'chrome://flags';
          how = 'On a computer: open <b>' + flags + '</b> in a new tab, type <b>Vulkan</b> in the search box, set it to <b>Enabled</b> ' +
                'and click <b>Relaunch</b>. If the adapter is still missing, do the same with <b>Unsafe WebGPU Support</b>, and check ' +
                'that hardware acceleration is on (Settings &rarr; System).';
        } else
          how = 'On Android Chrome needs Android 12 or newer and a Vulkan 1.1 GPU; on computers check that hardware ' +
                'acceleration is on (chrome://gpu).';
        return 'WebGPU is there, but the browser found no graphics adapter. ' + how + check;
      }
      g_gpuAdapter = ad;
      return null;
    }
    async function webgpuBlocked() {
      const why = await webgpuProblem();
      if (!why) return false;
      window.__ogFatal = true;
      progressContainer.style.display = 'none';
      statusText.style.color = 'var(--danger)';
      statusText.innerHTML = why;
      return true;
    }

    // The engine creates its graphics device synchronously inside main(),
    // while WebGPU only hands out adapters/devices asynchronously: acquire
    // the device up front and pass it via Module.preinitializedWebGPUDevice.
    async function initWebGPU() {
      const why = await webgpuProblem();
      if (why) {
        const e = new Error(why.replace(/<[^>]+>/g, ''));
        e.html = why;
        throw e;
      }
      const adapter = g_gpuAdapter;
      const wanted = ['texture-compression-bc', 'float32-filterable', 'rg11b10ufloat-renderable',
                      'indirect-first-instance', 'depth-clip-control', 'depth32float-stencil8',
                      'clip-distances'];
      const requiredFeatures = wanted.filter(f => adapter.features.has(f));
      const requiredLimits = {};
      for (const k of ['maxStorageBuffersPerShaderStage', 'maxStorageTexturesPerShaderStage',
                       'maxSampledTexturesPerShaderStage', 'maxSamplersPerShaderStage',
                       'maxUniformBuffersPerShaderStage', 'maxUniformBufferBindingSize',
                       'maxStorageBufferBindingSize', 'maxBufferSize', 'maxTextureDimension2D',
                       'maxTextureDimension3D', 'maxComputeWorkgroupStorageSize',
                       'maxComputeInvocationsPerWorkgroup', 'maxComputeWorkgroupSizeX',
                       'maxComputeWorkgroupSizeY', 'maxComputeWorkgroupSizeZ',
                       'maxColorAttachmentBytesPerSample', 'maxBindingsPerBindGroup',
                       'maxDynamicUniformBuffersPerPipelineLayout']) {
        if (adapter.limits[k] !== undefined) requiredLimits[k] = adapter.limits[k];
      }
      // a device request that a browser rejects over one feature or limit is retried with less:
      // every feature is optional for the engine, and the default limits are what the spec guarantees
      let device = null, lastErr = null;
      const attempts = [
        { requiredFeatures, requiredLimits },
        { requiredFeatures, requiredLimits: {} },
        { requiredFeatures: [], requiredLimits: {} },
      ];
      for (const a of attempts) {
        try { device = await adapter.requestDevice(a); break; } catch (e) {
          lastErr = e;
          console.warn('[SHELL] requestDevice failed (' + a.requiredFeatures.length + ' features, ' +
                       Object.keys(a.requiredLimits).length + ' limits):', e);
        }
      }
      if (!device) {
        const e = new Error('WebGPU: the browser refused to create a graphics device (' + lastErr + ')');
        e.html = 'WebGPU is there, but the browser refused to create a graphics device (' +
                 String(lastErr).replace(/[<>&]/g, '') + '). <a href="gpucheck.html" style="color:inherit">Run the WebGPU check</a> ' +
                 'and send its report.';
        throw e;
      }
      device.lost.then(info => console.error('[WebGPU] device lost:', info.reason, info.message));
      Module.preinitializedWebGPUDevice = device;
      console.log('[SHELL] WebGPU device: features=' + [...device.features].join(','));
    }

    let g_started = false;
    async function startGame() {
      if (isolationBlocked()) return;
      if (g_started) return;
      g_started = true;
      uiOverlay.classList.add('hidden');
      player.classList.add('playing');
      canvas.focus();
      console.log("Starting OpenGothic engine...");
      try {
        if (!Module.preinitializedWebGPUDevice)
          await initWebGPU();
        // ?nomenu skips the main menu and boots straight into the world
        // (used by automated tests; regular users get the normal menu)
        const noMenu = location.search.indexOf('nomenu') >= 0;
        // relative paths (savegames, Gothic.ini) must land on the persistent
        // game mount, not on the in-memory root filesystem
        try { Module.FS.chdir(GAME_ROOT); } catch (e) {}
        const args = ["-g", GAME_ROOT, GAME_ID === 'g2' ? "-g2" : "-g1"];
        if (noMenu) args.push("-nomenu");
        const ret = Module.callMain(args);
        window.__callMainReturned = { ret: ret, t: Date.now() };
        console.log("[SHELL] callMain returned ret=" + ret);
      } catch (err) {
        window.__startErr = (err && err.stack) ? err.stack : String(err);
        console.error("Engine execution error:", err);
        uiOverlay.classList.remove('hidden');
        player.classList.remove('playing');
        statusText.style.color = 'var(--danger)';
        window.__ogFatal = true;
        if (err && err.html) statusText.innerHTML = err.html; else statusText.innerText = "Error: " + err;
      }
    }

    bootstrap();
  </script>
