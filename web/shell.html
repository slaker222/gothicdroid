    // ---------------------------- savegames ----------------------------
    // save_slot_N.sav in the game root: in the game's file system while it
    // runs, in OPFS (gothic/) otherwise. Downloads are a stored ZIP archive.
    const SAVE_RE = /^save_slot_(\d+)\.sav$/i;

    const SAVE_CRC = (() => {
      const t = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        t[n] = c >>> 0;
      }
      return t;
    })();
    function saveCrc32(buf) {
      let c = 0xFFFFFFFF;
      for (let i = 0; i < buf.length; i++) c = SAVE_CRC[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
      return (c ^ 0xFFFFFFFF) >>> 0;
    }

    function gameFsMounted() {
      try { return !!(Module.FS && Module.FS.analyzePath(GAME_ROOT).exists && Module.FS.readdir(GAME_ROOT).length > 2); }
      catch (e) { return false; }
    }

    // [{name, bytes, time}]
    async function collectSaves() {
      const out = [];
      if (gameFsMounted()) {
        for (const name of Module.FS.readdir(GAME_ROOT)) {
          if (!SAVE_RE.test(name)) continue;
          const path = GAME_ROOT + '/' + name;
          out.push({ name, bytes: Module.FS.readFile(path), time: +Module.FS.stat(path).mtime || 0 });
        }
        return out;
      }
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return out; }
      for await (const [name, h] of dir.entries()) {
        if (h.kind !== 'file' || !SAVE_RE.test(name)) continue;
        const f = await h.getFile();
        out.push({ name, bytes: new Uint8Array(await f.arrayBuffer()), time: f.lastModified });
      }
      return out;
    }

    function zipStore(files) {
      const enc = new TextEncoder(), parts = [], central = [];
      let off = 0;
      for (const f of files) {
        const name = enc.encode(f.name), crc = saveCrc32(f.bytes), size = f.bytes.length;
        const lh = new DataView(new ArrayBuffer(30));
        lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
        lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
        lh.setUint16(26, name.length, true);
        parts.push(lh.buffer, name, f.bytes);
        const ch = new DataView(new ArrayBuffer(46));
        ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
        ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
        ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
        central.push(ch.buffer, name);
        off += 30 + name.length + size;
      }
      const cdSize = central.reduce((a, b) => a + b.byteLength, 0);
      const end = new DataView(new ArrayBuffer(22));
      end.setUint32(0, 0x06054b50, true);
      end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
      end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
      return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
    }

    // .sav files of a ZIP archive (stored or deflated), folders ignored
    async function unzipSaves(file) {
      const buf = new Uint8Array(await file.arrayBuffer());
      const dv = new DataView(buf.buffer);
      let eocd = -1;
      for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65557); i--)
        if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      if (eocd < 0) throw new Error(file.name + ' is not a ZIP archive');
      const count = dv.getUint16(eocd + 10, true);
      let p = dv.getUint32(eocd + 16, true);
      const out = [], dec = new TextDecoder();
      for (let i = 0; i < count; i++) {
        if (dv.getUint32(p, true) !== 0x02014b50) throw new Error(file.name + ': corrupt ZIP archive');
        const method = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true);
        const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
        const loc = dv.getUint32(p + 42, true);
        const name = dec.decode(buf.subarray(p + 46, p + 46 + nl)).split('/').pop();
        p += 46 + nl + xl + cl;
        if (!/\.sav$/i.test(name)) continue;
        const data = loc + 30 + dv.getUint16(loc + 26, true) + dv.getUint16(loc + 28, true);
        let bytes = buf.slice(data, data + comp);
        if (method === 8) {
          const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
          bytes = new Uint8Array(await new Response(s).arrayBuffer());
        } else if (method !== 0) {
          throw new Error(name + ': unsupported compression');
        }
        out.push({ name, bytes });
      }
      return out;
    }

    async function downloadSaves() {
      try {
        const saves = await collectSaves();
        if (saves.length === 0) { window.ogToast && window.ogToast('There are no savegames yet.'); return; }
        saves.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
        const a = document.createElement('a');
        a.href = URL.createObjectURL(zipStore(saves));
        a.download = 'gothic-saves.zip';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      } catch (e) {
        alert('Could not collect the savegames: ' + (e.message || e));
      }
    }

    async function writeSave(name, bytes) {
      const dir = await opfsGameDir(true);
      const fh = await dir.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(bytes); await w.close();
      // the running game sees it at once (the save/load menu lists it)
      if (gameFsMounted()) Module.FS.writeFile(GAME_ROOT + '/' + name, bytes);
    }

    async function onSavesPicked(ev) {
      const picked = [...ev.target.files];
      ev.target.value = '';
      try {
        let incoming = [];
        for (const f of picked) {
          if (/\.zip$/i.test(f.name)) incoming.push(...await unzipSaves(f));
          else incoming.push({ name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) });
        }
        if (incoming.length === 0) { window.ogToast && window.ogToast('No savegames (.sav) found in the chosen files.'); return; }
        let slots = 15;
        try { if (ogGet('gameVersion') === 2) slots = 20; } catch (e) {}
        const existing = await collectSaves();
        const taken = new Map(existing.map(s => [s.name.toLowerCase(), s.time]));
        // savegames named by slot go to that slot (replacing it), others take a
        // free slot, or the one saved longest ago when all are used
        const placed = [];
        for (const s of incoming.filter(s => SAVE_RE.test(s.name)).concat(incoming.filter(s => !SAVE_RE.test(s.name)))) {
          let name = s.name;
          if (!SAVE_RE.test(name)) {
            let slot = 0;
            for (let i = 1; i <= slots && !slot; i++) if (!taken.has(('save_slot_' + i + '.sav'))) slot = i;
            if (!slot) {
              let oldest = Infinity;
              for (let i = 1; i <= slots; i++) {
                const t = taken.get('save_slot_' + i + '.sav');
                if (t < oldest && !placed.includes(i)) { oldest = t; slot = i; }
              }
            }
            if (!slot) continue;
            name = 'save_slot_' + slot + '.sav';
          }
          name = name.toLowerCase();
          await writeSave(name, s.bytes);
          taken.set(name, Date.now());
          placed.push(+SAVE_RE.exec(name)[1]);
        }
        const list = placed.map(n => n === 0 ? 'quick save' : 'slot ' + n).join(', ');
        window.ogToast && window.ogToast('Savegames added: ' + list + '. Open Load game in the game menu to see them.');
      } catch (e) {
        alert('Could not add the savegames: ' + (e.message || e));
      }
    }

    // The canvas takes the player's size from CSS (the engine follows it).
    // Emscripten's Browser.updateCanvasDimensions writes the screen size into
    // the canvas' inline style (with !important) after the player was
    // fullscreen once; that style outlives fullscreen and crops the picture.
    new MutationObserver(() => {
      if (canvas.style.width || canvas.style.height) {
        canvas.style.removeProperty('width');
        canvas.style.removeProperty('height');
      }
    }).observe(canvas, { attributes: true, attributeFilter: ['style'] });
    canvas.style.removeProperty('width');
    canvas.style.removeProperty('height');

    // window mode: the player fills the browser page (the tabs stay)
    function setWindowMode(on) {
      document.body.classList.toggle('window-mode', on);
      try { localStorage.setItem('windowMode', on ? '1' : '0'); } catch (e) {}
    }
    function toggleWindowMode() {
      setWindowMode(!document.body.classList.contains('window-mode'));
    }
    try { if (localStorage.getItem('windowMode') === '1') setWindowMode(true); } catch (e) {}

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    // player controls show on mouse activity and fade out after a pause
    let g_activityTimer = 0;
    function onPlayerActivity() {
      if (document.pointerLockElement) return;
      player.classList.add('active');
      clearTimeout(g_activityTimer);
      g_activityTimer = setTimeout(() => player.classList.remove('active'), 2500);
    }
    player.addEventListener('mousemove', onPlayerActivity);
    player.addEventListener('touchstart', onPlayerActivity, { passive: true });
    player.addEventListener('mouseleave', () => player.classList.remove('active'));

    canvas.addEventListener('click', function() {
      if (document.pointerLockElement !== canvas) {
        canvas.requestPointerLock().catch(() => {});
      }
    });

    function setStatus(msg, pct) {
      statusText.innerText = msg;
      if (pct !== undefined) {
        progressContainer.style.display = 'block';
        progressBar.style.width = pct + '%';
      }
    }

    // ============================================================================
    // Game file storage on top of OPFS (Origin Private File System).
    //
    // Files are streamed to OPFS during import (no full copies in the JS heap)
    // and are exposed to the engine through a custom Emscripten filesystem
    // which resolves paths CASE-INSENSITIVELY (matching Windows behaviour,
    // which the game data relies on).
    //
    // Two backends for file contents:
    //  * lazy:    SharedArrayBuffer bridge to a worker holding
    //             FileSystemSyncAccessHandles; chunks are pulled from disk
    //             on demand (requires COOP/COEP headers, i.e. crossOriginIsolated).
    //  * preload: all files are read into memory once at startup (fallback).
    // ============================================================================

    const GAME_ROOT = '/gothic';
    const OPFS_ROOT_DIR = 'gothic';
    const BRIDGE_CHUNK = 16 * 1024 * 1024; // 16MB transfer buffer for the lazy backend

    // Junk that must never be imported into the game storage.
    const IMPORT_SKIP = [
      /^launcher\//i,
      /^directx/i,
      /^miles\//i,
      /^\.sentry/i,
      /^sentry_native/i,
      /\.(dmp|exe|dll|pdb|log|tmp|bak)$/i,
      /^readme/i,
      /^autorun\.inf$/i,
      /^setup\w*\.exe$/i
    ];

    function shouldImport(relPath) {
      for (const re of IMPORT_SKIP) {
        if (re.test(relPath)) return false;
      }
      return true;
    }

    // ---------------------------- OPFS primitives ----------------------------

    async function opfsGameDir(create) {
      const root = await navigator.storage.getDirectory();
      return root.getDirectoryHandle(OPFS_ROOT_DIR, { create: !!create });
    }

    async function opfsEnsureDir(dirHandle, parts) {
      let cur = dirHandle;
      for (const p of parts) {
        cur = await cur.getDirectoryHandle(p, { create: true });
      }
      return cur;
    }

    async function opfsWalk(dirHandle, prefix, out) {
      // @fs-entry iteration is async; gather files with their sizes
      for await (const [name, handle] of dirHandle.entries()) {
        const path = prefix ? prefix + '/' + name : name;
        if (handle.kind === 'directory') {
          await opfsWalk(handle, path, out);
        } else {
          const f = await handle.getFile();
          out.push({ path, name, size: f.size });
        }
      }
    }

    // ---------------------------- Bridge worker ------------------------------
    // Holds FileSystemSyncAccessHandles for every installed file and serves
    // read/truncate requests from the main thread through a SharedArrayBuffer
    // command channel. The main thread cannot Atomics.wait (it is forbidden
    // on the document thread), so it busy-polls while the worker blocks
    // in Atomics.wait for the next command.

    function makeBridgeWorkerSource() {
      return `
'use strict';
const OP_READ = 1, OP_TRUNCATE = 2, OP_SIZE = 3;
let cmd = null, dataView = null;
const handles = [];

async function openAll(paths) {
  const root = await navigator.storage.getDirectory();
  const dir = await root.getDirectoryHandle(${JSON.stringify(OPFS_ROOT_DIR)}, {create:false});
  for (const p of paths) {
    const parts = p.split('/');
    const name = parts.pop();
    let d = dir;
    for (const seg of parts) d = await d.getDirectoryHandle(seg, {create:false});
    const fh = await d.getFileHandle(name, {create:false});
    const h = await fh.createSyncAccessHandle();
    handles.push({ h, size: h.getSize() });
  }
}

self.onmessage = (e) => {
  const msg = e.data;
  if (msg.type === 'init') {
    cmd = new Int32Array(msg.cmd);
    dataView = new Uint8Array(msg.data);
    const open = msg.files
      ? Promise.resolve(msg.files.forEach(f => handles.push({ file: f, size: f.size })))
      : openAll(msg.paths);
    open.then(() => {
      Atomics.store(cmd, 7, 0);
      Atomics.store(cmd, 6, 1);
      Atomics.notify(cmd, 0);
      // start serving only now: the blocking loop below starves the event
      // loop, so any pending await in openAll would never resume
      setTimeout(serveLoop, 0);
    }, (err) => {
      self.postMessage({ type: 'error', msg: String(err && err.stack || err) });
      Atomics.store(cmd, 7, 1);
      Atomics.store(cmd, 6, 1);
      Atomics.notify(cmd, 0);
    });
    return;
  }
};

// Synchronous command loop: blocks in Atomics.wait until a request arrives.
function serveLoop() {
    while (true) {
      // sleep while there is no pending command (cmd[0] === 0)
      Atomics.wait(cmd, 0, 0);
      const op = Atomics.load(cmd, 0);
      if (op === 0) continue;
      try {
        if (op === OP_READ) {
          const hIdx = Atomics.load(cmd, 1);
          const pos = Atomics.load(cmd, 2);
          const len = Atomics.load(cmd, 3);
          const hd = handles[hIdx];
          let n = 0;
          if (hd.file) {
            // folder picked by the user: read straight from the File object
            const ab = new FileReaderSync().readAsArrayBuffer(hd.file.slice(pos, pos + len));
            dataView.set(new Uint8Array(ab), 0);
            n = ab.byteLength;
          } else {
            n = hd.h.read(dataView.subarray(0, len), { at: pos });
          }
          Atomics.store(cmd, 5, n);
          Atomics.store(cmd, 4, 1); // ok
        } else if (op === OP_TRUNCATE) {
          const hIdx = Atomics.load(cmd, 1);
          if (handles[hIdx].h) handles[hIdx].h.truncate(0);
          handles[hIdx].size = 0;
          Atomics.store(cmd, 5, 0);
          Atomics.store(cmd, 4, 1);
        } else if (op === OP_SIZE) {
          const hIdx = Atomics.load(cmd, 1);
          Atomics.store(cmd, 5, handles[hIdx].h ? handles[hIdx].h.getSize() : handles[hIdx].size);
          Atomics.store(cmd, 4, 1);
        } else {
          Atomics.store(cmd, 4, 2); // unknown op
        }
      } catch (err) {
        Atomics.store(cmd, 4, 3); // io error
      }
      Atomics.store(cmd, 0, 0); // request served
      Atomics.notify(cmd, 0);
    }
}
`;
    }

    // ---------------------------- Custom FS backend ---------------------------

    const GameFS = {
      // registry: lower(fullPath) -> {path (real case), isDir, size, hIdx, mem, dirty, node}
      files: new Map(),
      lazy: false,           // true -> SAB bridge is active
      bridge: null,          // {worker, cmd, data}
      workerSrc: null,

      lower(p) { return p.toLowerCase(); },

      // registry key of `name` inside the entry `parent` (root has empty path)
      childKey(parentEntry, name) {
        const p = (parentEntry === this.rootEntry) ? '' : parentEntry.path;
        return this.lower(p ? p + '/' + name : name);
      },

      addEntry(path, isDir, size) {
        const key = this.lower(path);
        let e = this.files.get(key);
        if (!e) {
          e = { path, isDir, size: size || 0, hIdx: -1, mem: null, dirty: false, node: null };
          this.files.set(key, e);
        } else {
          e.path = path;
          e.isDir = isDir;
          if (size !== undefined) e.size = size;
        }
        return e;
      },

      childrenOf(entry) {
        // direct children of a directory entry
        const prefix = entry === this.rootEntry ? '' : this.lower(entry.path) + '/';
        const out = [];
        for (const [k, v] of this.files) {
          if (!k.startsWith(prefix)) continue;
          const rest = k.slice(prefix.length);
          if (rest.length === 0 || rest.includes('/')) continue;
          out.push(v);
        }
        return out;
      },

      rootEntry: null,

      // ---- Emscripten filesystem interface ----
      DIR_MODE: 0x4000 | 0x1ff,
      FILE_MODE: 0x8000 | 0x1ff,

      mount(mount) {
        return this.mkNode(null, '', this.rootEntry);
      },

      mkNode(parent, name, entry) {
        const FS = Module.FS;
        const node = FS.createNode(parent, name || '/', entry.isDir ? this.DIR_MODE : this.FILE_MODE);
        node.mode = entry.isDir ? this.DIR_MODE : this.FILE_MODE;
        node.node_ops = this.node_ops;
        node.stream_ops = this.stream_ops;
        node.timestamp = Date.now();
        node.gameEntry = entry;
        entry.node = node;
        if (entry.isDir) {
          node.size = 4096;
        } else {
          node.size = entry.size;
        }
        return node;
      },

      node_ops: {
        getattr(node) {
          const e = node.gameEntry;
          return {
            dev: 1,
            ino: 0,
            mode: node.mode,
            nlink: 1,
            uid: 0,
            gid: 0,
            rdev: 0,
            size: e.isDir ? 4096 : e.size,
            atime: new Date(node.timestamp),
            mtime: new Date(node.timestamp),
            ctime: new Date(node.timestamp),
            blksize: 4096,
            blocks: Math.ceil(e.size / 4096)
          };
        },
        setattr(node, attr) {
          if (attr.mode !== undefined) node.mode = attr.mode;
          if (attr.size !== undefined && !node.gameEntry.isDir) {
            node.gameEntry.size = attr.size;
            node.size = attr.size;
            if (node.gameEntry.mem && node.gameEntry.mem.length !== attr.size) {
              const nm = new Uint8Array(attr.size);
              nm.set(node.gameEntry.mem.subarray(0, Math.min(attr.size, node.gameEntry.mem.length)));
              node.gameEntry.mem = nm;
            }
          }
          if (attr.timestamp !== undefined) node.timestamp = attr.timestamp;
        },
        lookup(parent, name) {
          const key = GameFS.childKey(parent.gameEntry, name);
          const e = GameFS.files.get(key);
          if (!e) throw new GameFS.ErrnoError(44 /*ENOENT*/);
          if (e.node) return e.node;
          return GameFS.mkNode(parent, name, e);
        },
        mknod(parent, name, mode, dev) {
          const parentPath = parent.gameEntry === GameFS.rootEntry ? '' : parent.gameEntry.path;
          const path = parentPath ? parentPath + '/' + name : name;
          const e = GameFS.addEntry(path, GameFS.isDirMode(mode), 0);
          e.mem = new Uint8Array(0);
          e.dirty = true;
          e.hIdx = -1;
          const node = GameFS.mkNode(parent, name, e);
          GameFS.persistEntryAsync(e, new Uint8Array(0));
          return node;
        },
        rename(oldNode, newDirNode, newName) {
          const oldE = oldNode.gameEntry;
          const oldKey = GameFS.lower(oldE.path);
          const newParentPath = newDirNode.gameEntry === GameFS.rootEntry ? '' : newDirNode.gameEntry.path;
          const newPath = newParentPath ? newParentPath + '/' + newName : newName;
          // move entry and all descendants
          const moves = [];
          for (const [k, v] of GameFS.files) {
            if (k === oldKey || k.startsWith(oldKey + '/')) {
              moves.push([k, v]);
            }
          }
          for (const [k, v] of moves) {
            GameFS.files.delete(k);
            const rel = v.path.slice(oldE.path.length);
            v.path = newPath + rel;
            v.node = null;
            GameFS.files.set(GameFS.lower(v.path), v);
          }
          oldE.dirty = true;
          GameFS.moveOpfsAsync(oldE.path, newPath);
        },
        unlink(parent, name) {
          const key = GameFS.childKey(parent.gameEntry, name);
          const e = GameFS.files.get(key);
          if (!e) throw new GameFS.ErrnoError(44);
          e.deleted = true;
          GameFS.files.delete(key);
          // remove descendants too
          const pref = key + '/';
          for (const k of [...GameFS.files.keys()]) {
            if (k.startsWith(pref)) GameFS.files.delete(k);
          }
          GameFS.deleteOpfsAsync(e.path);
        },
        rmdir(parent, name) {
          GameFS.node_ops.unlink(parent, name);
        },
        readdir(node) {
          const entries = ['.', '..'];
          for (const c of GameFS.childrenOf(node.gameEntry)) {
            entries.push(c.path.split('/').pop());
          }
          return entries;
        },
        symlink() {
          throw new GameFS.ErrnoError(1 /*EPERM*/);
        }
      },

      stream_ops: {
        // NOTE: no `open` hook on purpose — opendir() opens directories
        // through the regular open path and must not fail.
        close(stream) {
          const e = stream.node.gameEntry;
          if (stream.gameBuffer) {
            // the write buffer grows geometrically: keep only the file bytes
            const bytes = stream.gameBuffer.slice(0, e.size);
            e.mem = bytes;
            e.dirty = true;
            stream.node.size = e.size;
            GameFS.persistEntryAsync(e, bytes);
          }
          stream.gameBuffer = null;
        },
        read(stream, buffer, offset, length, position) {
          const e = stream.node.gameEntry;
          if (length <= 0) return 0;
          if (position >= e.size) return 0;
          let toRead = Math.min(length, e.size - position);
          if (e.mem !== null && e.mem !== undefined) {
            const n = Math.min(toRead, e.mem.length - position);
            if (n <= 0) return 0;
            buffer.set(e.mem.subarray(position, position + n), offset);
            return n;
          }
          if (GameFS.lazy) {
            return GameFS.bridgeReadInto(e, buffer, offset, position, toRead);
          }
          // preload backend must have materialized the file
          return 0;
        },
        write(stream, buffer, offset, length, position) {
          const e = stream.node.gameEntry;
          const end = position + length;
          if (!stream.gameBuffer || stream.gameBuffer.length < end) {
            const cur = stream.gameBuffer ? stream.gameBuffer.length : 0;
            const nb = new Uint8Array(Math.max(end, cur * 2, 1024));
            if (stream.gameBuffer) nb.set(stream.gameBuffer.subarray(0, Math.min(e.size, cur)));
            else if (e.mem) nb.set(e.mem.subarray(0, Math.min(e.size, e.mem.length)));
            stream.gameBuffer = nb;
          }
          stream.gameBuffer.set(buffer.subarray(offset, offset + length), position);
          if (end > e.size) {
            e.size = end;
            stream.node.size = end;
          }
          e.dirty = true;
          return length;
        },
        llseek(stream, offset, whence) {
          let position = offset;
          if (whence === 1) position += stream.position;
          else if (whence === 2) {
            if (GameFS.isDirMode(stream.node.mode) === false) position += stream.node.gameEntry.size;
          }
          if (position < 0) throw new GameFS.ErrnoError(28 /*EINVAL*/);
          return position;
        },
        // mmap is required: ZenKit memory-maps every game file it reads.
        // Without this op FS.mmap throws ENODEV, musl returns MAP_FAILED(-1)
        // and the engine dereferences 0xFFFFFFFF.
        mmap(stream, length, position, prot, flags) {
          const e = stream.node.gameEntry;
          if (e.isDir) throw new GameFS.ErrnoError(19 /*ENODEV*/);
          const ptr = Module['mmapAlloc'](length);
          // mmapAlloc may grow the heap: HEAPU8 must be re-read AFTER it
          const HEAPU8 = Module.HEAPU8;
          if (!ptr) throw new GameFS.ErrnoError(12 /*ENOMEM*/);
          const avail = Math.max(0, Math.min(length, e.size - position));
          if (avail > 0) {
            if (e.mem) {
              HEAPU8.set(e.mem.subarray(position, position + avail), ptr);
            } else if (GameFS.lazy) {
              GameFS.bridgeReadInto(e, HEAPU8, ptr, position, avail);
            }
            // neither mem nor lazy: preload backend guarantees e.mem
          }
          return { ptr, allocated: true };
        },
        msync(stream, buffer, offset, length, mmapFlags) {
          // MAP_SHARED write-back: the engine never writes game data files
          // through mappings (saves go through the write() path)
          return 0;
        }
      },

      isDirMode(mode) {
        return (mode & 0x1700) === 0x4000; // S_IFDIR
      },

      // ---- lazy bridge helpers ----
      bridgeReadInto(e, heapBuffer, offset, position, length) {
        const br = GameFS.bridge;
        // loop over 16MB chunks until the whole request is satisfied
        let done = 0;
        while (done < length) {
          const chunk = Math.min(length - done, BRIDGE_CHUNK);
          Atomics.store(br.cmd, 1, e.hIdx);
          Atomics.store(br.cmd, 2, position + done);
          Atomics.store(br.cmd, 3, chunk);
          Atomics.store(br.cmd, 4, 0); // clear status
          Atomics.store(br.cmd, 0, 1); // OP_READ
          Atomics.notify(br.cmd, 0);
          // wait for the worker to serve the command
          const deadline = performance.now() + 10000;
          while (Atomics.load(br.cmd, 0) !== 0) {
            if (performance.now() > deadline) throw new GameFS.ErrnoError(29 /*EIO*/);
          }
          const status = Atomics.load(br.cmd, 4);
          if (status !== 1) throw new GameFS.ErrnoError(29 /*EIO*/);
          const n = Atomics.load(br.cmd, 5);
          if (n <= 0) break;
          heapBuffer.set(br.data.subarray(0, n), offset + done);
          done += n;
          if (n < chunk) break;
        }
        return done;
      },

      // ---- async persistence (fire and forget) ----
      persistQueue: new Map(),
      liveHandles: new Set(),
      persistEntryAsync(e, bytes) {
        // writes to one file run strictly one after another: overlapping
        // createWritable() calls on the same handle fail or lose data
        const key = e.path;
        const prev = GameFS.persistQueue.get(key) || Promise.resolve();
        const next = prev.then(() => GameFS.persistNow(e, bytes));
        GameFS.persistQueue.set(key, next);
        next.finally(() => { if (GameFS.persistQueue.get(key) === next) GameFS.persistQueue.delete(key); });
      },

      persistNow(e, bytes) {
        return opfsGameDir(true).then(async (dir) => {
          const parts = e.path.split('/');
          const name = parts.pop();
          const d = await opfsEnsureDir(dir, parts);
          const fh = await d.getFileHandle(name, { create: true });
          // Chrome may garbage-collect an unreferenced handle mid-call and the
          // promise then never settles: keep every OPFS object reachable
          GameFS.liveHandles.add(fh); GameFS.liveHandles.add(d);
          try {
            const w = await fh.createWritable();
            GameFS.liveHandles.add(w);
            try { await w.write(bytes); await w.close(); }
            finally { GameFS.liveHandles.delete(w); }
          } finally {
            GameFS.liveHandles.delete(fh); GameFS.liveHandles.delete(d);
          }
        }).catch(err => console.warn('OPFS persist failed:', e.path, err));
      },

      deleteOpfsAsync(path) {
        opfsGameDir(false).then(async (dir) => {
          const parts = path.split('/');
          const name = parts.pop();
          const d = await opfsEnsureDir(dir, parts);
          try { await d.removeEntry(name, { recursive: true }); } catch (e) {}
        }).catch(() => {});
      },

      moveOpfsAsync(oldPath, newPath) {
        // OPFS has no native move: copy bytes then delete the source
        opfsGameDir(false).then(async (dir) => {
          try {
            const oldParts = oldPath.split('/');
            const oldName = oldParts.pop();
            const oldDir = await opfsEnsureDir(dir, oldParts);
            const fh = await oldDir.getFileHandle(oldName, { create: false });
            const blob = await fh.getFile();
            const newParts = newPath.split('/');
            const newName = newParts.pop();
            const newDir = await opfsEnsureDir(dir, newParts);
            const nfh = await newDir.getFileHandle(newName, { create: true });
            const w = await nfh.createWritable();
            await w.write(blob);
            await w.close();
            try { await oldDir.removeEntry(oldName); } catch (e) {}
          } catch (err) {
            console.warn('OPFS move failed', err);
          }
        }).catch(() => {});
      }
    };

    // Patch in ErrnoError once the runtime is up
    function bindErrnoError() {
      if (Module.FS && Module.FS.ErrnoError) {
        GameFS.ErrnoError = Module.FS.ErrnoError;
      }
    }

    // ---------------------------- Startup / storage ----------------------------

    let g_bridgeInitBusy = false;

    // TEMPORARY: the game folder is picked on every start and read directly
    // from disk; nothing but savegames/settings is copied into OPFS.
    // A game downloaded from ARCHIVE_URLS or unpacked from a ZIP is installed
    // into OPFS in both modes.
    const DIRECT_FOLDER_MODE = true;

    // The whole game: a ZIP archive (game folder with Data/ inside, any nesting)
    // or a chunked pack (manifest.json, tools/pack_web.py; chunks next to it).
    // Further links are mirrors of the same pack, used when the first one fails.
    // Overridden by ?archive=<url>. The server must allow CORS; mirrorhost share
    // links are rewritten to their CORS-enabled download host.
    const ARCHIVE_URLS = [
      'https://example.invalid/removed',
      'https://example.invalid/removed',
      'https://example.invalid/removed'
    ];

    // OPFS root entries next to the game directory
    const DL_ZIP = 'gothic-download.zip';     // archive being downloaded
    const DL_STATE = 'gothic-download.json';  // {url, total} of that download
    const INSTALL_MARK = 'gothic-install.json'; // written once the game is unpacked
    const CHUNK_STATE = 'gothic-chunks.json'; // chunks installed from a manifest.json pack

    // savegames and settings written by the engine (see loadPersistedFiles)
    function isPersistedPath(rel) {
      return /^[^/]+\.(sav|ini)$/i.test(rel) || /^saves[^/]*\//i.test(rel);
    }

    // ?archive=<url> overrides the built-in links
    function archiveUrls() {
      const q = new URLSearchParams(location.search).get('archive');
      return (q ? [q] : ARCHIVE_URLS).map(normalizeArchiveUrl);
    }

    function normalizeArchiveUrl(u) {
      // absolute links only; "/path" addresses a file on this server
      const url = u.startsWith('/') && !u.startsWith('//') ? new URL(u, location.href) : new URL(u);
      if (url.protocol !== 'https:' && url.protocol !== 'http:')
        throw new Error('not an http(s) link');
      // www.mirrorhost.com answers with a redirect that has no CORS headers;
      // dl.mirrorhostusercontent.com serves the same file with CORS and Range
      if (/(^|\.)mirrorhost\.com$/i.test(url.hostname)) {
        url.hostname = 'dl.mirrorhostusercontent.com';
        url.searchParams.delete('st');
        url.searchParams.delete('e');
        url.searchParams.set('dl', '1');
      }
      return url.href;
    }

    async function readRootJson(name) {
      try {
        const root = await navigator.storage.getDirectory();
        const f = await (await root.getFileHandle(name)).getFile();
        return JSON.parse(await f.text());
      } catch (e) {
        return null;
      }
    }

    async function writeRootJson(name, obj) {
      const root = await navigator.storage.getDirectory();
      const w = await (await root.getFileHandle(name, { create: true })).createWritable();
      await w.write(JSON.stringify(obj));
      await w.close();
    }

    async function removeRootEntry(name) {
      try { await (await navigator.storage.getDirectory()).removeEntry(name, { recursive: true }); } catch (e) {}
    }

    function mb(bytes) { return (bytes / 1048576).toFixed(0); }

    function showSourceButtons(show) {
      sourceRow.style.display = show ? 'flex' : 'none';
    }

    // The game starts by itself: an installed game is mounted and launched,
    // otherwise the archive download begins right away. The offline buttons
    // stay available and stop the download when used.
    async function bootstrap() {
      try {
        const installed = await readRootJson(INSTALL_MARK);
        // without the direct mode a game imported into OPFS is used as well
        if (installed || !DIRECT_FOLDER_MODE) {
          await g_runtimeReady;
          if (await mountInstalledGame()) {
            startGame();
            return;
          }
        }
      } catch (e) {
        console.warn('bootstrap error:', e);
      }
      showSourceButtons(true);
      progressContainer.style.display = 'none';
      downloadGame();
    }

    // an offline source replaces the download: stop it, and continue it
    // again when the file dialog is dismissed without a choice
    function pickOffline(inputId) {
      if (g_gameReady) return;
      const input = document.getElementById(inputId);
      pauseInstall();
      input.value = '';
      input.addEventListener('cancel', () => {
        if (!g_gameReady && !g_installWorker && !g_offlineBusy) downloadGame();
      }, { once: true });
      input.click();
    }
    let g_offlineBusy = false;

    // Mounts the game installed into OPFS (downloaded, unpacked or imported).
    // Returns false when there is no game there.
    async function mountInstalledGame() {
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return false; }
      const all = [];
      await opfsWalk(dir, '', all);
      if (!all.some(f => f.path.toLowerCase().startsWith('data/')))
        return false;

      // savegames/settings are rewritten by the game: they are kept in memory
      // (and persisted on close), the bridge only holds read-only game files
      const listing = all.filter(f => !isPersistedPath(f.path));
      const totalBytes = listing.reduce((a, f) => a + f.size, 0);
      setStatus('Preparing...');

      // Build the registry (directories inferred from paths)
      GameFS.rootEntry = { path: '', isDir: true, size: 0, node: null };
      GameFS.addEntry('', true);
      const addPath = (path, size) => {
        const parts = path.split('/'); parts.pop();
        let cur = '';
        for (const p of parts) { cur = cur ? cur + '/' + p : p; GameFS.addEntry(cur, true); }
        return GameFS.addEntry(path, false, size);
      };
      for (const f of listing) addPath(f.path, f.size).mem = null;

      // Choose a backend for file contents
      const canLazy = typeof SharedArrayBuffer !== 'undefined' && self.crossOriginIsolated;
      if (canLazy) {
        try {
          await initLazyBackend(listing.map(f => f.path));
        } catch (err) {
          console.warn('Lazy backend failed, falling back to preload:', err);
          GameFS.lazy = false;
        }
      }
      if (!GameFS.lazy) {
        await preloadAllFiles(listing);
      }

      for (const p of await loadPersistedFiles()) {
        const e = addPath(p.path, p.mem.length);
        e.mem = p.mem;
        e.hIdx = -1;
      }

      Module.FS.mkdir(GAME_ROOT);
      Module.FS.mount(GameFS, {}, GAME_ROOT);

      showSourceButtons(false);
      retryBtn.style.display = 'none';
      progressContainer.style.display = 'none';
      statusText.style.color = '';
      setStatus('Starting...');
      clearBtn.style.display = 'inline-flex';
      g_gameReady = true;
      return true;
    }

    // ---------------------------- Download / install ----------------------------

    let g_installWorker = null;

    function runInstallWorker(msg, onProgress) {
      return new Promise((resolve, reject) => {
        const src = document.getElementById('install-worker-src').textContent;
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        const worker = new Worker(url);
        URL.revokeObjectURL(url);
        g_installWorker = { worker, reject };
        const finish = () => { worker.terminate(); g_installWorker = null; };
        worker.onerror = (e) => { finish(); reject(new Error('install worker: ' + e.message)); };
        worker.onmessage = (e) => {
          const m = e.data;
          if (m.type === 'progress') {
            onProgress(m);
          } else if (m.type === 'done') {
            finish(); resolve(m.result);
          } else if (m.type === 'error') {
            finish();
            const err = new Error(m.msg);
            err.name = m.name || 'Error';
            reject(err);
          }
        };
        worker.postMessage(Object.assign({
          gameDirName: OPFS_ROOT_DIR,
          skip: IMPORT_SKIP,
          persisted: [/^[^/]+\.(sav|ini)$/i, /^saves[^/]*\//i]
        }, msg));
      });
    }

    function pauseInstall() {
      if (!g_installWorker) return;
      const { worker, reject } = g_installWorker;
      worker.terminate();
      g_installWorker = null;
      const err = new Error('paused');
      err.paused = true;
      reject(err);
    }

    function fmtTime(sec) {
      if (!isFinite(sec) || sec < 0) return '…';
      sec = Math.round(sec);
      const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
      return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
    }

    function makeProgressReporter() {
      let t0 = 0, b0 = 0, speed = 0;
      return (m) => {
        const pct = m.total ? Math.min(100, Math.floor(m.done / m.total * 100)) : 0;
        if (m.phase === 'download') {
          const now = performance.now();
          if (!t0) { t0 = now; b0 = m.done; }
          else if (now - t0 > 1000) {
            const s = (m.done - b0) / ((now - t0) / 1000);
            speed = speed ? speed * 0.7 + s * 0.3 : s;
            t0 = now; b0 = m.done;
          }
          let msg = 'Downloading: ' + mb(m.done) + ' / ' + (m.total ? mb(m.total) : '?') + ' MB';
          if (speed > 0)
            msg += ' · ' + (speed / 1048576).toFixed(1) + ' MB/s · ' + fmtTime((m.total - m.done) / speed);
          setStatus(msg, pct);
        } else if (m.phase === 'retry') {
          setStatus('Network error, retry ' + m.attempt + '/' + m.max);
        } else if (m.phase === 'extract') {
          setStatus('Unpacking: ' + m.index + ' / ' + m.count + ' (' + pct + '%)', pct);
        }
      };
    }

    function installError(err, what, retry) {
      if (err.paused) {
        statusText.style.color = '';
        setStatus('Download stopped');
        progressContainer.style.display = 'none';
      } else {
        console.error(what, err);
        statusText.style.color = 'var(--danger)';
        let msg = err.message || String(err);
        if (err.name === 'QuotaExceededError')
          msg = 'not enough browser storage';
        else if (err.name === 'TypeError' && /fetch/i.test(msg))
          msg = 'cannot reach the archive server (' + msg + ')';
        setStatus(what + ': ' + msg);
      }
      showSourceButtons(true);
      if (!err.paused && retry) retryBtn.style.display = 'inline-block';
    }

    let g_downloading = false;
    // set by web/threads_check.js when a threaded build runs on a page that is
    // not cross-origin isolated: the engine cannot start, keep its message
    function isolationBlocked() {
      if (!window.__ogIsolationError) return false;
      progressContainer.style.display = 'none';
      statusText.style.color = 'var(--danger)';
      statusText.innerText = window.__ogIsolationError;
      return true;
    }

    async function downloadGame() {
      if (isolationBlocked()) return;
      if (g_gameReady || g_installWorker || g_offlineBusy || g_downloading) return;
      let urls, url;
      try {
        urls = archiveUrls();
        url = urls[0];
      } catch (e) {
        installError(new Error('invalid archive link'), 'Error', false);
        return;
      }
      g_downloading = true;
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus('Connecting...');
      // keep the browser from evicting a multi-GB install under storage pressure
      try { if (navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}

      let state = await readRootJson(DL_STATE);
      if (state && state.url !== url) {
        await removeRootEntry(DL_ZIP);
        state = null;
      }
      const report = makeProgressReporter();
      try {
        // a link to manifest.json is a chunked pack (tools/pack_web.py): chunks
        // are unpacked while the next ones download
        if (/\/manifest\.json$/i.test(new URL(url).pathname)) {
          const res = await runInstallWorker({ type: 'chunks', urls, stateName: CHUNK_STATE }, report);
          await finishInstall({ source: url, archiveBytes: res.download }, res);
          return;
        }
        const dl = await runInstallWorker({ type: 'download', url, zipName: DL_ZIP, stateName: DL_STATE,
                                            expectTotal: state ? state.total : 0 }, report);
        setStatus('Checking...', 0);
        const res = await runInstallWorker({ type: 'extract', zipName: DL_ZIP, deleteZip: true }, report);
        await finishInstall({ source: url, archiveBytes: dl.total }, res);
      } catch (err) {
        installError(err, 'Error', true);
      } finally {
        g_downloading = false;
      }
    }

    async function installFromZip(file) {
      if (g_gameReady || g_installWorker) return;
      g_offlineBusy = true;
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      setStatus('Reading...');
      try {
        const res = await runInstallWorker({ type: 'extract', blob: file }, makeProgressReporter());
        await finishInstall({ source: 'file:' + file.name, archiveBytes: file.size }, res);
      } catch (err) {
        g_offlineBusy = false;
        installError(err, 'Error', true);
      }
    }

    async function finishInstall(info, res) {
      await writeRootJson(INSTALL_MARK, Object.assign(info, res, { date: new Date().toISOString() }));
      await removeRootEntry(DL_ZIP);
      await removeRootEntry(DL_STATE);
      await removeRootEntry(CHUNK_STATE);
      console.log('[SHELL] game installed:', res.files, 'files,', mb(res.bytes), 'MB');
      await g_runtimeReady;
      if (!await mountInstalledGame())
        throw new Error('game not found after unpacking');
      startGame();
    }

    function initLazyBackend(paths, files) {
      return new Promise((resolve, reject) => {
        const cmdSab = new SharedArrayBuffer(8 * 4);
        const dataSab = new SharedArrayBuffer(BRIDGE_CHUNK);
        const cmd = new Int32Array(cmdSab);
        const data = new Uint8Array(dataSab);
        cmd[0] = 0; cmd[6] = 0;

        const src = makeBridgeWorkerSource();
        const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
        const worker = new Worker(url);
        worker.onerror = (e) => reject(new Error('bridge worker: ' + e.message));
        worker.onmessage = (e) => {
          if (e.data && e.data.type === 'error')
            console.error('bridge openAll failed:', e.data.msg);
        };

        // send init; the worker fills handles and notifies cmd[6].
        // SharedArrayBuffers are shared, not transferred — no transfer list.
        worker.postMessage({ type: 'init', cmd: cmdSab, data: dataSab, paths, files });

        const waitReady = () => {
          if (Atomics.load(cmd, 6) === 1) {
            if (Atomics.load(cmd, 7) !== 0) {
              reject(new Error('bridge init failed'));
              return;
            }
            GameFS.lazy = true;
            GameFS.bridge = { worker, cmd, data };
            // map file entries to handle indexes (order of the paths array)
            let i = 0;
            for (const p of paths) {
              const e = GameFS.files.get(GameFS.lower(p));
              if (e) e.hIdx = i;
              i++;
            }
            resolve();
            return;
          }
          setTimeout(waitReady, 50);
        };
        waitReady();
      });
    }

    async function preloadAllFiles(listing) {
      const dir = await opfsGameDir(false);
      const totalBytes = listing.reduce((a, f) => a + f.size, 0);
      let doneBytes = 0;
      let idx = 0;
      for (const f of listing) {
        const parts = f.path.split('/');
        const name = parts.pop();
        const d = await opfsEnsureDir(dir, parts);
        const fh = await d.getFileHandle(name, { create: false });
        const buf = new Uint8Array(await (await fh.getFile()).arrayBuffer());
        const e = GameFS.files.get(GameFS.lower(f.path));
        if (e) { e.mem = buf; e.size = buf.length; }
        doneBytes += f.size;
        idx++;
        if ((idx & 7) === 0 || idx === listing.length) {
          setStatus('Downloading: ' + (doneBytes / 1048576).toFixed(0) + ' / ' + (totalBytes / 1048576).toFixed(0) + ' MB',
                    Math.round((doneBytes / Math.max(1, totalBytes)) * 100));
          await new Promise(r => setTimeout(r, 0));
        }
      }
    }

    // removes the installed game, keeping savegames and settings
    async function clearStorage() {
      if (!confirm("Delete the game files from the browser? Savegames are kept.")) return;
      // the bridge worker holds locks on every game file
      if (GameFS.bridge) { GameFS.bridge.worker.terminate(); GameFS.bridge = null; }
      try {
        const dir = await opfsGameDir(false);
        const names = [];
        for await (const [name, h] of dir.entries()) {
          if (!(h.kind === 'file' && /\.(sav|ini)$/i.test(name)) && !(h.kind === 'directory' && /^saves/i.test(name)))
            names.push(name);
        }
        for (const name of names) await dir.removeEntry(name, { recursive: true });
      } catch (e) {
        console.warn('clearStorage:', e);
      }
      await removeRootEntry(INSTALL_MARK);
      await removeRootEntry(DL_ZIP);
      await removeRootEntry(DL_STATE);
      await removeRootEntry(CHUNK_STATE);
      try {
        indexedDB.deleteDatabase('/gothic'); // legacy IDBFS database
        indexedDB.deleteDatabase('emscripten-fs'); // legacy runtime database
      } catch (e) {}
      setStatus('Deleted');
      setTimeout(() => location.reload(), 800);
    }

    // ---------------------------- Import ----------------------------

    async function onFolderSelected(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;
      g_offlineBusy = true;
      if (DIRECT_FOLDER_MODE)
        await mountFolderDirect(files);
      else
        await importFilesList(files);
    }

    // small files the game wrote earlier (savegames, Gothic.ini) live in OPFS
    async function loadPersistedFiles() {
      const out = [];
      let dir;
      try { dir = await opfsGameDir(false); } catch (e) { return out; }
      for await (const [name, h] of dir.entries()) {
        if (h.kind === 'file' && /\.(sav|ini)$/i.test(name)) {
          out.push({ path: name, mem: new Uint8Array(await (await h.getFile()).arrayBuffer()) });
        } else if (h.kind === 'directory' && /^saves/i.test(name)) {
          const sub = [];
          await opfsWalk(h, name, sub);
          for (const f of sub) {
            const parts = f.path.split('/'); parts.shift();
            let d = h;
            for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p);
            const fh = await d.getFileHandle(parts[parts.length - 1]);
            out.push({ path: f.path, mem: new Uint8Array(await (await fh.getFile()).arrayBuffer()) });
          }
        }
      }
      return out;
    }

    // offline source failed: back to the download
    function offlineFailed(err) {
      g_offlineBusy = false;
      statusText.style.color = 'var(--danger)';
      setStatus('Error: ' + (err.message || err));
      progressContainer.style.display = 'none';
      showSourceButtons(true);
      retryBtn.style.display = 'inline-block';
    }

    async function mountFolderDirect(fileList) {
      g_offlineBusy = true;
      showSourceButtons(false);
      retryBtn.style.display = 'none';
      statusText.style.color = '';
      try {
        const list = [];
        for (const file of fileList) {
          const rel = relPathOf(file);
          if (shouldImport(rel)) list.push({ rel, file });
        }
        if (!list.some(f => /^data\//i.test(f.rel)))
          throw new Error('no Data folder: select the root folder of the installed game');

        setStatus('Connecting...');
        GameFS.rootEntry = { path: '', isDir: true, size: 0, node: null };
        GameFS.addEntry('', true);
        const addPath = (path, size) => {
          const parts = path.split('/'); parts.pop();
          let cur = '';
          for (const p of parts) { cur = cur ? cur + '/' + p : p; GameFS.addEntry(cur, true); }
          return GameFS.addEntry(path, false, size);
        };
        for (const f of list) addPath(f.rel, f.file.size).mem = null;

        const canLazy = typeof SharedArrayBuffer !== 'undefined' && self.crossOriginIsolated;
        if (canLazy) {
          await initLazyBackend(list.map(f => f.rel), list.map(f => f.file));
        } else {
          // no cross-origin isolation: everything has to be read into memory
          let done = 0;
          const total = list.reduce((a, f) => a + f.file.size, 0);
          for (const f of list) {
            const e = GameFS.files.get(GameFS.lower(f.rel));
            e.mem = new Uint8Array(await f.file.arrayBuffer());
            done += f.file.size;
            setStatus('Downloading: ' + (done / 1048576).toFixed(0) + ' / ' + (total / 1048576).toFixed(0) + ' MB',
                      Math.round(done / Math.max(1, total) * 100));
          }
        }

        // savegames/settings written in the browser override the folder copies
        for (const p of await loadPersistedFiles()) {
          const e = addPath(p.path, p.mem.length);
          e.mem = p.mem;
          e.hIdx = -1;
        }

        await g_runtimeReady;
        Module.FS.mkdir(GAME_ROOT);
        Module.FS.mount(GameFS, {}, GAME_ROOT);
        progressContainer.style.display = 'none';
        setStatus('Starting...');
        g_gameReady = true;
        startGame();
      } catch (err) {
        console.error('mount error:', err);
        offlineFailed(err);
      }
    }

    async function onZipSelected(event) {
      const file = event.target.files[0];
      if (!file) return;
      g_offlineBusy = true;
      await installFromZip(file);
    }

    function relPathOf(file) {
      let relPath = file.webkitRelativePath || file.name;
      const parts = relPath.split('/');
      if (parts.length > 1) {
        parts.shift(); // strip the top-level folder name
        relPath = parts.join('/');
      }
      return relPath.replace(/\\/g, '/');
    }

    async function importFilesList(files) {
      const list = [];
      let totalBytes = 0;
      for (const file of files) {
        const rel = relPathOf(file);
        if (!shouldImport(rel)) continue;
        list.push({ rel, file });
        totalBytes += file.size;
      }
      if (list.length === 0) {
        offlineFailed(new Error('no game files found in the selected folder'));
        return;
      }
      await importToOpfs(list, totalBytes);
    }

    async function importToOpfs(list, totalBytes) {
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      showSourceButtons(false);

      const dir = await opfsGameDir(true);
      let doneBytes = 0;
      let count = 0;
      const t0 = performance.now();
      try {
        for (const item of list) {
          const parts = item.rel.split('/');
          const name = parts.pop();
          if (!name) continue;
          const d = await opfsEnsureDir(dir, parts);
          const fh = await d.getFileHandle(name, { create: true });
          const writable = await fh.createWritable();
          if (item.file.stream) {
            await item.file.stream().pipeTo(writable);
          } else {
            await writable.write(item.file);
            await writable.close();
          }
          doneBytes += item.file.size;
          count++;
          setStatus('Importing [' + count + '/' + list.length + ']: ' + name + ' — ' +
                    (doneBytes / 1048576).toFixed(0) + ' / ' + (totalBytes / 1048576).toFixed(0) + ' MB',
                    Math.round((doneBytes / Math.max(1, totalBytes)) * 100));
          await new Promise(r => setTimeout(r, 0));
        }
        const secs = (performance.now() - t0) / 1000;
        console.log('Import done:', count, 'files in', secs.toFixed(1), 's');
        await writeRootJson(INSTALL_MARK, { source: 'folder', files: count, bytes: doneBytes, date: new Date().toISOString() });
        setStatus('Done');
        setTimeout(() => location.reload(), 600);
      } catch (err) {
        console.error('Import error:', err);
        offlineFailed(err);
      }
    }

    // Drag and drop support
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      uiOverlay.classList.add('drag-over');
    });

    window.addEventListener('dragleave', (e) => {
      uiOverlay.classList.remove('drag-over');
    });

    window.addEventListener('drop', async (e) => {
      e.preventDefault();
      uiOverlay.classList.remove('drag-over');
      const files = e.dataTransfer.files;
      if (!files || files.length === 0 || g_gameReady) return;
      pauseInstall();
      g_offlineBusy = true;

      if (files.length === 1 && files[0].name.toLowerCase().endsWith('.zip')) {
        await installFromZip(files[0]);
      } else {
        await importFilesList(files);
      }
    });

    function ensureDummyDirs(base) {
      const dirs = [
        base,
        base + '/Data',
        base + '/_work',
        base + '/_work/Data',
        base + '/_work/Data/Scripts',
        base + '/_work/Data/Scripts/_compiled',
        base + '/system',
        base + '/saves'
      ];
      for (const d of dirs) {
        try {
          Module.FS.mkdir(d);
        } catch (e) {}
      }
    }

    // The engine creates its graphics device synchronously inside main(),
    // while WebGPU only hands out adapters/devices asynchronously: acquire
    // the device up front and pass it via Module.preinitializedWebGPUDevice.
    async function initWebGPU() {
      if (!navigator.gpu)
        throw new Error("WebGPU is not supported by this browser. Use Chrome/Edge 113+, " +
                        "Firefox 141+ (Windows) or Safari 26+; the page must be opened over HTTPS or localhost");
      const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
      if (!adapter)
        throw new Error("WebGPU: no graphics adapter found (check that hardware acceleration is enabled)");
      const wanted = ['texture-compression-bc', 'float32-filterable', 'rg11b10ufloat-renderable',
                      'indirect-first-instance', 'depth-clip-control', 'depth32float-stencil8',
                      'clip-distances'];
      const requiredFeatures = wanted.filter(f => adapter.features.has(f));
      const requiredLimits = {};
      for (const k of ['maxStorageBuffersPerShaderStage', 'maxStorageTexturesPerShaderStage',
                       'maxSampledTexturesPerShaderStage', 'maxSamplersPerShaderStage',
                       'maxUniformBuffersPerShaderStage', 'maxUniformBufferBindingSize',
                       'maxStorageBufferBindingSize', 'maxBufferSize', 'maxTextureDimension2D',
                       'maxTextureDimension3D', 'maxComputeWorkgroupStorageSize',
                       'maxComputeInvocationsPerWorkgroup', 'maxComputeWorkgroupSizeX',
                       'maxComputeWorkgroupSizeY', 'maxComputeWorkgroupSizeZ',
                       'maxColorAttachmentBytesPerSample', 'maxBindingsPerBindGroup',
                       'maxDynamicUniformBuffersPerPipelineLayout']) {
        if (adapter.limits[k] !== undefined) requiredLimits[k] = adapter.limits[k];
      }
      const device = await adapter.requestDevice({ requiredFeatures, requiredLimits });
      device.lost.then(info => console.error('[WebGPU] device lost:', info.reason, info.message));
      Module.preinitializedWebGPUDevice = device;
      console.log('[SHELL] WebGPU device: features=' + requiredFeatures.join(','));
    }

    let g_started = false;
    async function startGame() {
      if (isolationBlocked()) return;
      if (g_started) return;
      g_started = true;
      uiOverlay.classList.add('hidden');
      player.classList.add('playing');
      canvas.focus();
      console.log("Starting OpenGothic engine...");
      try {
        if (!Module.preinitializedWebGPUDevice)
          await initWebGPU();
        // ?nomenu skips the main menu and boots straight into the world
        // (used by automated tests; regular users get the normal menu)
        const noMenu = location.search.indexOf('nomenu') >= 0;
        // relative paths (savegames, Gothic.ini) must land on the persistent
        // game mount, not on the in-memory root filesystem
        try { Module.FS.chdir(GAME_ROOT); } catch (e) {}
        const args = ["-g", GAME_ROOT];
        if (noMenu) args.push("-nomenu");
        const ret = Module.callMain(args);
        window.__callMainReturned = { ret: ret, t: Date.now() };
        console.log("[SHELL] callMain returned ret=" + ret);
      } catch (err) {
        window.__startErr = (err && err.stack) ? err.stack : String(err);
        console.error("Engine execution error:", err);
        uiOverlay.classList.remove('hidden');
        player.classList.remove('playing');
        statusText.style.color = 'var(--danger)';
        statusText.innerText = "Error: " + err;
      }
    }

    bootstrap();
  </script>
