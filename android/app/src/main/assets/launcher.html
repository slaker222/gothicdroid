<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpenGothic</title>
  <style>
    :root {
      --bg: #151515;
      --line: #3a3a3a;
      --text: #ddd;
      --dim: #999;
      --accent: #fff;
      --danger: #e5484d;
      --about-h: 0px;                       /* nothing above the language bar */
      --chrome-h: calc(var(--about-h) + 70px); /* about + language bar + voice strip */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      scrollbar-width: thin;
    }
    html { overflow: hidden; }
    body { overflow-y: auto; }

    #player {
      position: relative;
      width: min(100vw, calc((100vh - var(--about-h)) * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
    }

    /* language bar above the player (only when the server has lang/languages.json) */
    #lang-bar {
      --lang-h: 40px;
      height: var(--lang-h);
      width: min(100vw, calc((100vh - var(--chrome-h)) * 16 / 9));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 4px;
      white-space: nowrap;
      overflow: hidden;
      color: var(--dim);
    }
    #lang-bar[hidden] { display: none; }
    #lang-bar label { display: flex; align-items: center; gap: 6px; }
    #lang-bar label[hidden] { display: none; }
    #lang-bar select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 3px 6px;
      font: inherit;
    }
    #lang-bar .btn { padding: 3px 12px; }
    #lang-bar .back-link { color: var(--text); text-decoration: none; padding: 3px 10px 3px 4px; border-radius: 4px; }
    #lang-bar .back-link:hover { background: var(--line); }
    #lang-bar .support { display: flex; gap: 8px; margin-left: auto; flex: none; }
    #lang-bar .support a {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px;
      font-weight: 700; font-size: 13px; text-decoration: none; line-height: 1.2;
    }
    #lang-bar .support .donate { background: #ffc61a; color: #1a1a1a; box-shadow: 0 0 12px rgba(255,198,26,.55); }
    #lang-bar .support .join { background: #5865f2; color: #fff; box-shadow: 0 0 12px rgba(88,101,242,.6); }
    #lang-bar .support svg { width: 16px; height: 16px; fill: currentColor; }
    #lang-note { overflow: hidden; text-overflow: ellipsis; }
    body.has-lang #player { width: min(100vw, calc((100vh - var(--chrome-h)) * 16 / 9)); }
    /* strip under the player: progress of a voice language download */
    #voice-bar { display: none; }
    body.has-lang #voice-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 30px;
      width: min(100vw, calc((100vh - var(--chrome-h)) * 16 / 9));
      padding: 0 4px;
      color: var(--dim);
      white-space: nowrap;
    }
    #voice-bar.idle { visibility: hidden; }
    #legal {
      width: min(100vw, calc((100vh - var(--chrome-h)) * 16 / 9));
      margin: 8px 0 16px;
      padding: 0 8px;
      font-size: 11px;
      line-height: 1.4;
      color: var(--dim);
      text-align: center;
    }
    /* narrow screens (phones): the language bar goes one setting per line */
    @media (max-width: 700px) {
      #lang-bar {
        height: auto;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 6px 8px;
        white-space: normal;
      }
      #lang-bar label { justify-content: space-between; }
      #lang-bar select { flex: 1 1 auto; max-width: 62%; min-height: 32px; }
      #lang-note { white-space: normal; }
      #lang-bar .support { margin-left: 0; justify-content: center; }
      body.has-lang #voice-bar { white-space: normal; padding: 0 8px; }
    }
    /* a phone held sideways: the player is narrower than the three selects, the bar takes the whole width */
    @media (min-width: 701px) and (max-height: 500px) {
      #lang-bar, body.has-lang #voice-bar { width: 100vw; }
      #lang-bar { justify-content: center; font-size: 12px; gap: 8px; }
      #lang-bar select { padding: 2px 4px; }
    }
    #voice-track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
    #voice-fill { height: 100%; width: 0; background: var(--accent); transition: width .2s; }

    #player:fullscreen {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
    }

    /* window mode: the player takes the whole browser page, nothing else is shown */
    body.window-mode { overflow: hidden; }
    body.window-mode #player {
      position: fixed;
      inset: 0;
      z-index: 100;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
    }
    body.window-mode > :not(#player):not(script) { display: none !important; }
    #win-btn .icon-exit { display: none; }
    body.window-mode #win-btn .icon-enter { display: none; }
    body.window-mode #win-btn .icon-exit { display: block; }

    /* the picture only grows sideways: never taller than 16:9 (portrait
       phones, window mode and fullscreen get bars above and below) */
    #player { container-type: size; }
    #canvas {
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: min(100%, calc(100cqw * 9 / 16));
      transform: translateY(-50%);
      outline: none;
      border: none;
      background: #000;
      display: block;
    }

    /* the main-menu picture of the chosen game (web/img/g1.png, g2.png) instead of black while the game is
       installed and loads; stretched like the menu of the game itself, dimmed to keep the status text readable;
       it fades out when the engine has drawn its first frames (ogFrameStats) */
    #boot-bg {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: #000 center / 100% 100% no-repeat;
      transition: opacity 0.7s ease;
    }
    #boot-bg::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.42); }
    #boot-bg.gone { opacity: 0; }

    #ui-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 72px 16px;   /* the same above and below: the status sits in the middle of the player */
      text-align: center;
    }

    #ui-overlay.hidden { display: none; }
    #ui-overlay.drag-over { outline: 1px dashed var(--accent); outline-offset: -8px; }

    .status-box {
      min-height: 20px;
      color: var(--dim);
      word-break: break-word;
    }

    .status-detail {
      min-height: 16px;
      max-width: min(560px, 90%);
      font-size: 12px;
      color: var(--dim);
      opacity: .75;
      word-break: break-all;
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* the engine starts after the overlay is gone: the same spinner and a line of text over the menu picture */
    #boot-status {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text);
      pointer-events: none;
    }
    #boot-status .spinner { display: block; }

    .progress-bar-container {
      width: min(320px, 70%);
      height: 2px;
      background: var(--line);
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
    }

    .source-row {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 52px;
      display: none;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      font: inherit;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 0;
      cursor: pointer;
    }

    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .file-input { display: none; }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      height: 44px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      opacity: 0;
      transition: opacity 0.2s;
    }

    #player.active #controls,
    #player:not(.playing) #controls { opacity: 1; }

    .ctl {
      display: flex;
      align-items: center;
      height: 32px;
      padding: 0 8px;
      font: 13px inherit;
      color: var(--text);
      background: none;
      border: none;
      cursor: pointer;
    }

    .ctl:hover { color: var(--accent); }
    .ctl-right, .ctl-left { display: flex; align-items: center; }
    .fps-opt { gap: 6px; user-select: none; }
    .fps-opt input { margin: 0; accent-color: var(--accent); cursor: pointer; }
    /* detailed stats ("Performance overlay"): phone, mode, resolution, frame time graph */
    #perf-box { position: absolute; top: 8px; left: 8px; z-index: 15; display: none; padding: 6px 8px; width: 262px; max-width: 60vw;
      font: 11px/1.45 monospace; color: #e8e8e8; background: rgba(0, 0, 0, 0.62); pointer-events: none; white-space: pre-wrap; word-break: break-word; }
    body.perf-on #perf-box { display: block; }
    body.perf-on #fps-counter { display: none !important; }
    #perf-box b { color: #5dff8a; font-weight: normal; }
    #perf-box #perf-fps { display: block; margin-top: 2px; font-size: 20px; line-height: 1.2; font-weight: bold; color: #ff3b30; }
    #perf-box canvas { display: block; width: 100%; height: 64px; margin: 4px 0 2px; background: rgba(255,255,255,0.06); }
    /* side menu (Android app: the back button) */
    #side-scrim { position: absolute; inset: 0; z-index: 30; display: none; background: rgba(0, 0, 0, 0.45); }
    #side-menu { position: absolute; top: 0; bottom: 0; left: 0; z-index: 31; width: 36%; min-width: 230px; max-width: 380px;
      display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0) 0 8px; box-sizing: border-box;
      background: rgba(14, 14, 14, 0.97); border-right: 1px solid var(--line); transform: translateX(-102%);
      transition: transform .18s ease-out; visibility: hidden; }
    #player.side-open #side-scrim { display: block; }
    #player.side-open #side-menu { transform: none; visibility: visible; }
    #side-menu .sm-title { padding: 14px 18px 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
    #side-menu .sm-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 18px; box-sizing: border-box;
      font: inherit; font-size: 16px; text-align: left; color: var(--text); background: none; border: 0; border-top: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
    #side-menu .sm-item:active { background: rgba(255, 255, 255, 0.1); }
    #side-menu .sm-item svg { flex: none; width: 24px; height: 24px; fill: currentColor; color: var(--accent); }
    #side-menu .sm-item .sm-label { flex: 1; }
    #side-menu .sm-sw { flex: none; position: relative; width: 38px; height: 20px; border-radius: 10px; background: #444; transition: background .15s; }
    #side-menu .sm-sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ddd; transition: left .15s; }
    #side-menu .sm-item[aria-checked="true"] .sm-sw { background: var(--accent); }
    #side-menu .sm-item[aria-checked="true"] .sm-sw::after { left: 20px; }
    #side-menu .sm-spacer { flex: 1; }
    #side-menu .sm-exit svg { color: var(--danger, #ff6a5d); }
    html:not(.native) #side-menu, html:not(.native) #side-scrim { display: none !important; }
    html.native label:has(#fps-chk),
    html.native label[for="perf-chk"], html.native label:has(#perf-chk) { display: none !important; }
    #fps-counter {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 15;
      padding: 2px 8px;
      font: 13px monospace;
      color: #5dff8a;
      background: rgba(0, 0, 0, 0.55);
      pointer-events: none;
      display: none;
    }
    .ctl svg { width: 22px; height: 22px; fill: currentColor; }
    #fs-btn .icon-exit { display: none; }
    #player.menu-open #controls { opacity: 1; }
    /* touch controls ("Mobile input"): buttons send the game's keys */
    #touch-ui {
      position: absolute;
      inset: 0;
      container-type: size; /* sizes follow the player, not the browser window */
      z-index: 12;
      display: none;
      pointer-events: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body.touch-on #touch-ui { display: block; }
    /* a finger that stays down while the layout changes must not be taken over by the browser (pointercancel) */
    body.touch-on #canvas { touch-action: none; }
    /* a gamepad is in use: the touch controls step aside until the next touch */
    body.gp-on #touch-ui { display: none !important; }
    /* touch mode: the player bar sits on top,
       compact, clear of the stick and the buttons; saves and delete only show
       in the game menu */
    body.touch-on #controls {
      top: 0;
      bottom: auto;
      height: 34px;
      padding: 0 4px;
      opacity: 1;
      background: linear-gradient(rgba(0, 0, 0, 0.55), transparent);
    }
    body.touch-on .ctl { height: 28px; padding: 0 5px; font-size: 11px; }
    body.touch-on .ctl svg { width: 18px; height: 18px; }
    body.touch-on #controls .ctl-left { visibility: hidden; }
    body.touch-on.touch-menu #controls .ctl-left { visibility: visible; }
    body.touch-on #settings-panel { top: 38px; bottom: auto; max-height: calc(100% - 46px); }
    #touch-look { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
    #touch-ui.no-look #touch-look { pointer-events: none; }
    .tbtn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--s, 13cqmin);
      height: var(--s, 13cqmin);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font: 600 clamp(10px, 2.6cqmin, 16px)/1.1 -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      text-shadow: 0 1px 2px #000;
      pointer-events: auto;
      touch-action: none;
    }
    .tbtn.big { --s: 19cqmin; font-size: clamp(12px, 3.2cqmin, 19px); background: rgba(120, 20, 10, 0.45); }
    .tbtn.huge { --s: 22.8cqmin; }
    .tbtn.small { --s: 10cqmin; font-size: clamp(9px, 2.2cqmin, 13px); }
    .tbtn.down { background: rgba(255, 255, 255, 0.35); }
    .tbtn.active { border-color: #fff; background: rgba(255, 255, 255, 0.2); }
    .tbtn svg { width: 52%; height: 52%; fill: none; stroke: currentColor; stroke-width: 2;
                stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px #000); }
    .tbtn.cheat { border-color: #f2c200; color: #ffe066; }
    .tbtn.hidden { display: none; }
    /* strike button: the arrows show the directions, the one struck lights up */
    .tbtn.strike svg { width: 86%; height: 86%; }
    .tbtn svg .ar { opacity: 0.45; }
    .tbtn[data-dir="l"] svg .ar.l, .tbtn[data-dir="u"] svg .ar.u, .tbtn[data-dir="r"] svg .ar.r
      { opacity: 1; stroke-width: 3.2; }
    /* quick panel: the weapons and spells of the number keys at the bottom (the icons are the game's own
       3D item pictures, drawn by the engine under these frames) */
    .tq-slot {
      position: absolute; box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.55); border-radius: 1.2cqmin;
      background: rgba(0, 0, 0, 0.3); pointer-events: none;
    }
    #tq-clip { position: absolute; overflow: hidden; pointer-events: none; }
    #tq-hit { position: absolute; pointer-events: auto; touch-action: none; }
    /* the inventory button: one more block of the quick row, always in its place */
    .tbtn.sq { border-radius: 1.2cqmin; border: 1px solid rgba(255, 255, 255, 0.55); background: rgba(0, 0, 0, 0.3); box-sizing: border-box; }
    .tbtn.sq.down { background: rgba(255, 255, 255, 0.3); }
    .tq-slot.empty { border-color: rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.18); }
    .tq-slot.on { border: 2px solid #ffd54a; background: rgba(255, 213, 74, 0.18); }
    .tq-slot.down { background: rgba(255, 255, 255, 0.3); }
    .tq-slot i { position: absolute; right: 3px; bottom: 1px; font: 700 clamp(9px, 2.4cqmin, 13px)/1 sans-serif; font-style: normal;
                 color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }
    .tq-slot span { position: absolute; left: 3px; top: 1px; font: 700 clamp(9px, 2.4cqmin, 13px)/1 sans-serif;
                    color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }
    /* the quest journal for the touch layout: under the inventory and character buttons */
    #tj {
      position: absolute;
      left: 4cqmin;
      top: calc(36px + 12.5cqmin);
      width: 46cqmin;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 1.6cqmin;
      color: #fff;
      font: 500 clamp(11px, 3cqmin, 15px)/1.25 -apple-system, 'Segoe UI', Roboto, sans-serif;
      pointer-events: auto;
      touch-action: pan-y;
      overflow: hidden;
    }
    #tj.hidden, #tj-open.hidden { display: none; }
    #tj .tj-head { display: flex; align-items: center; height: 7.5cqmin; padding-left: 2cqmin; }
    #tj .tj-title { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #tj button { all: unset; display: flex; align-items: center; justify-content: center; width: 7.5cqmin; height: 7.5cqmin; color: #fff; cursor: pointer; }
    #tj button.hidden { display: none; }
    #tj button svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #tj .tj-body { max-height: 24cqmin; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; border-top: 1px solid rgba(255, 255, 255, 0.25); }
    #tj .tj-row { height: 8cqmin; line-height: 8cqmin; padding: 0 2cqmin; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
                  border-top: 1px solid rgba(255, 255, 255, 0.12); cursor: pointer; }
    #tj .tj-row:first-child { border-top: 0; }
    #tj .tj-row:active { background: rgba(255, 255, 255, 0.18); }
    #tj .tj-entry { padding: 1.2cqmin 2cqmin; white-space: pre-wrap; }
    #tj .tj-sep { height: 0; border-top: 1px dashed rgba(255, 255, 255, 0.4); margin: 0 2cqmin; }
    /* closed: a wide, low arrow under the character button brings it back */
    #tj-open {
      position: absolute; left: 14cqmin; top: calc(36px + 12cqmin);
      width: 14cqmin; height: 5cqmin;
      display: flex; align-items: center; justify-content: center;
      border-radius: 1.6cqmin; border: 1px solid rgba(255, 255, 255, 0.45);
      background: rgba(0, 0, 0, 0.35); color: #fff; pointer-events: auto; touch-action: none;
    }
    #tj-open svg { width: 70%; height: 70%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    #touch-stick {
      position: absolute;
      width: 26cqmin; height: 26cqmin;
      margin: -13cqmin 0 0 -13cqmin;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.2);
      pointer-events: none;
      display: none;
    }
    #touch-stick::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      width: 11cqmin; height: 11cqmin;
      margin: -5.5cqmin 0 0 -5.5cqmin;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: translate(var(--tx, 0px), var(--ty, 0px));
    }
    #touch-stick .stick-icon {
      position: absolute; left: 50%; top: 50%;
      width: 8cqmin; height: 8cqmin; margin: -4cqmin 0 0 -4cqmin;
      color: #fff; display: none; pointer-events: none;
    }
    #touch-stick .stick-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 2;
                                   stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 1px #000); }
    /* sneaking learned: its icon sits on the stick (double tap switches it), gone while the stick is pulled */
    #touch-stick.sneak-known:not(.on) .stick-icon { display: block; }
    #touch-stick.sneaking .stick-icon { color: #ffd54a; }
    #touch-stick.on, #touch-stick.home { display: block; }
    #touch-stick.home:not(.on) { opacity: 0.6; }

    #gfx-toast {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 30;
      max-width: min(360px, calc(100% - 24px));
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid var(--line);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.6s, transform 0.6s;
      pointer-events: none;
    }
    #gfx-toast.show { opacity: 1; transform: none; }
    #settings-btn[aria-expanded="true"] { color: var(--accent); }
    #settings-panel {
      position: absolute;
      right: 8px;
      bottom: 48px;
      z-index: 25;
      width: 260px;
      max-width: calc(100% - 16px);
      padding: 10px 12px;

<body>
  <div id="wrap">
    <div class="topbar">
      <h1>OpenGothic<small>Android</small></h1>
      <div class="support">
        <button type="button" class="donate" onclick="Launcher.openUrl('https://www.patreon.com/')">&#9829; Donate</button>
        <button type="button" class="join" onclick="Launcher.openUrl('https://discord.gg/')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-6.4 0L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9-.2 13.5.2 18a19.9 19.9 0 0 0 6 3l1.3-2.1c-.7-.3-1.4-.6-2-1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.9 19.9 0 0 0 6-3c.5-5.2-.8-9.7-3.5-13.6zM8.5 15.3c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400zm7 0c-1.200 0-2.100-1.100-2.100-2.400s.9-2.400 2.100-2.400 2.100 1.100 2.100 2.400-.9 2.400-2.100 2.400z"/></svg>Join</button>
      </div>
    </div>
    <div class="games" id="games"></div>
    <div class="card" id="settings-card"><h2 id="settings-title">Settings</h2><div id="settings-panel" class="disabled">
      <div id="settings-close"><button type="button" aria-label="Close" title="Close">&times;</button></div>
      <div class="presets" id="gfx-presets">
        <button type="button" data-preset="ultralow" title="Everything at the minimum, shortest draw distance">Ultra low</button>
        <button type="button" data-preset="low" title="Fewer effects, short draw distance">Low</button>
        <button type="button" data-preset="classic" title="Like the original: circle shadows, 80 m objects, 200 m world, simple water, no reflections or occlusion">Classic</button>
        <button type="button" data-preset="ultra" title="Everything at the maximum and on">Ultra</button>
      </div>
      <label class="set-row" title="Frame rate limit, from 25 up to the display refresh rate (the right end: frames follow the monitor, no limit)">FPS limit
        <span class="fps-slider"><input type="range" id="fps-limit" min="25" max="60" step="1" value="60"><output id="fps-limit-val">60</output></span>
      </label>
      <label class="set-row">Render resolution
        <select data-set="resScale">
          <option value="0">100%</option><option value="1">75%</option>
          <option value="2">50%</option><option value="3">40%</option>
          <option value="4">30%</option><option value="5">25%</option>
          <option value="6">20%</option><option value="7">15%</option>
        </select>
      </label>
      <label class="set-row" title="Pixels of the picture per screen pixel. Phones have 2.5-3.5: a lower value is much faster on them, especially in landscape. Auto keeps the picture to about one megapixel">Screen sharpness
        <select id="pixel-cap">
          <option value="-1">Auto</option><option value="0">Native</option>
          <option value="2">High (2x)</option><option value="1.5">Medium (1.5x)</option>
          <option value="1">Low (1x)</option>
        </select>
      </label>
      <label class="set-row" title="Detail of world textures, like the texture detail of the original Gothic: lower is less detailed and a little lighter for the GPU. Applies at once, both ways. Video memory use does not change">Texture quality
        <select data-set="texQuality">
          <option value="0">High</option><option value="1">Medium (1/2)</option>
          <option value="2">Low (1/4)</option><option value="3">Lowest (1/8)</option>
        </select>
      </label>
      <label class="set-row">Shadows
        <select data-set="shadows">
          <option value="2">High</option><option value="1">Low</option><option value="3">Ultra low (circles)</option><option value="0">Off</option>
        </select>
      </label>
      <label class="set-row">Object draw distance
        <select data-set="drawDist">
          <option value="0">Unlimited</option><option value="1">Far (150 m)</option>
          <option value="2">Medium (80 m)</option><option value="3">Near (40 m)</option>
          <option value="4">Nearest (20 m)</option>
        </select>
      </label>
      <label class="set-row">World draw distance
        <select data-set="worldDist">
          <option value="0">Unlimited</option><option value="500">500 m</option>
          <option value="300">300 m</option><option value="200">200 m</option>
          <option value="150">150 m</option><option value="100">100 m</option>
          <option value="80">80 m</option><option value="60">60 m</option>
          <option value="40">40 m</option><option value="30">30 m</option>
        </select>
      </label>
      <label class="set-row" title="NPCs beyond the object draw distance are not animated (their bones freeze until they come closer)">Skip hidden NPC animation <input type="checkbox" data-set="skipFarAnim"></label>
      <label class="set-row" title="Low: water is a plain animated texture like in the original Gothic, no waves, transparency or reflections; much lighter for the GPU. Ultra high: High, and the swamp has its own water (greener, murkier, slower) with a smooth transition from the plain water. Applies the next time a world is loaded (new game, loading a save, changing the area)">Water quality
        <select data-set="waterQuality">
          <option value="0">High</option><option value="1">Low</option><option value="2">Ultra high</option>
        </select>
      </label>
      <label class="set-row" title="Rings spread over the water around the character: steps, wading, swimming, and a splash with waves when falling into it. Not for the Low water quality">Water physics <input type="checkbox" data-set="waterPhysics"></label>
      <label class="set-row" title="Blood splashes from NPCs and the hero when hit">Blood <input type="checkbox" data-set="blood"></label>
      <label class="set-row">Water reflections <input type="checkbox" data-set="reflections"></label>
      <label class="set-row">Ambient occlusion <input type="checkbox" data-set="ssao"></label>
      <label class="set-row" title="Soft sandy haze that thickens with distance and over the horizon, as in the original game on a misty day. Off: no fog on objects. Always off when the world draw distance is below 150 m">Fog
        <select data-set="fog">
          <option value="0">On</option><option value="2">Dense</option><option value="1">Off</option>
        </select>
      </label>
      <label class="set-row" title="High: bright sun disc with a glow and light shafts. Low: the same sun without the light shafts. Off: no sun">Sun
        <select data-set="sun">
          <option value="0">High</option><option value="1">Low</option><option value="2">Off</option>
        </select>
      </label>
      <label class="set-row g1only" title="Classic: the barrier shows for 45 seconds when the game starts, dissolves, and comes back for 45 seconds every 36 minutes. Constant: always there. Off: no barrier. The slider is the volume of its hum and thunder (Gothic 1 only)">Barrier
        <span class="barrier-ctl">

            <option value="0">Classic</option><option value="1">Constant</option><option value="2">Off</option>
          </select>
          <svg class="vol-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          <input type="range" data-set="barrierVol" min="20" max="100" step="5" value="100" title="Barrier volume">
        </span>
      </label>
      <div class="set-row g1only" title="The barrier kills what touches it, but the game has no data where. Stand at a corner of a place the barrier should kill in and press Corner (or the backslash key), go to the opposite corner and press again: a zone is saved. Undo removes the last one">Barrier zones
        <span class="barrier-ctl" id="barrier-zones">
          <button type="button" data-zone="1">Corner</button><button type="button" data-zone="2">Undo</button><button type="button" data-zone="3">Clear</button><output id="barrier-zone-count">0</output>
        </span>
      </div>
      <label class="set-row g1only" title="Show the marked lethal zones of the barrier as translucent red boxes (and the one being marked, from its first corner to you)">Show barrier zones <input type="checkbox" data-set="barrierZoneShow"></label>
      <div class="set-note" id="settings-note">Start the game to change settings.</div>
      <div id="settings-more" aria-hidden="true">&#9660; scroll &#9660;</div>
    </div></div>
    <div class="card"><h2>Log</h2>
      <div class="row2"><button id="log-show">Show</button><button id="log-copy">Copy</button></div>
      <div id="log"></div>
    </div>

  <script>
    'use strict';
    const $ = id => document.getElementById(id);
    const PICS = { 1: 'img/g1.png', 2: 'img/g2.png', 3: 'img/myrtana.jpg' };
    const POS = { 1: '25%', 2: '80%', 3: '12%' };
    const ICON_HOME = '<svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3z"/></svg>';
    const ICON_FOLDER = '<svg viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/></svg>';
    const ICON_LOCK = '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 0 1 6 0v2H9V6z"/></svg>';
    const ICON_UNLOCK = '<svg viewBox="0 0 24 24"><path d="M18 8h-1V6a5 5 0 0 0-9.9-1h2A3 3 0 0 1 15 6v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2z"/></svg>';
    const mb = n => n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : Math.round(n / 1048576) + ' MB';
    let games = [];
    let scanTimer = 0;

    function refresh(scanned) {
      try { games = JSON.parse(scanned ? Launcher.rescan() : Launcher.games()); } catch (e) { games = []; }
      const scanning = Launcher.scanning();
      const sel = Launcher.selected();
      const root = $('games');
      root.innerHTML = '';
      for (const g of games) {
        const el = document.createElement('div');
        el.className = 'game' + (g.id === sel ? ' sel' : '');
        el.dataset.id = g.id;
        const found = !!g.path;
        el.innerHTML =
          '<div class="pic" style="background-image:url(' + PICS[g.id] + ');background-position:center ' + POS[g.id] + '">' +
            '<span class="badge"></span><div class="langs"></div></div>' +
          '<div class="body"><div class="title"><h3></h3><span class="dl-info"><span class="dl-text"></span><button class="dl-cancel">Cancel</button></span></div>' +
          '<div class="path"></div><div class="btns">' +
            '<button class="play">Play</button>' +
            '<button class="folder" title="Choose the game folder">' + ICON_FOLDER + ' Folder</button>' +
            (g.canDownload ? '<button class="dl" title="' + (g.downloaded ? 'Delete the downloaded game' : 'Download from the PC on the local network') + '">' + (g.downloaded ? 'Delete' : 'Download') + '</button>' : '') +
            '<button class="icon home" title="Add to the home screen" aria-label="Add to the home screen">' + ICON_HOME + '</button>' +
          '</div></div>';
        el.querySelector('h3').textContent = g.title;
        const badge = el.querySelector('.badge');
        if (found) { badge.textContent = 'Installed'; badge.classList.add('ok'); }
        else if (scanning) { badge.innerHTML = 'Searching<span class="dots"></span>'; }
        else badge.textContent = 'Not found';
        el.querySelector('.path').textContent = found ? g.path + (g.vdf ? '  (' + g.vdf + ' VDF)' : '') : (scanning ? '' : 'Choose the folder with Data/*.vdf');
        const play = el.querySelector('.play');
        play.disabled = !found;
        play.addEventListener('click', () => Launcher.start(g.id));
        el.querySelector('.folder').addEventListener('click', () => Launcher.pick(g.id));
        const dl = el.querySelector('.dl');
        if (dl) dl.addEventListener('click', () => g.downloaded ? confirmDelete(g) : openSheet(g, 'all'));
        el.querySelector('.home').disabled = !found;
        el.querySelector('.home').addEventListener('click', () => Launcher.pin(g.id));
        el.querySelector('.dl-cancel').addEventListener('click', () => Launcher.cancelDownload());
        // a tap on the picture: the settings below are of this game
        el.querySelector('.pic').addEventListener('click', () => { Launcher.select(g.id); refresh(); });
        // the languages of the game, right of the picture
        try {
          const lg = Launcher.langs(g.id);
          if (lg) {
            const l = JSON.parse(lg);
            el.querySelector('.langs').innerHTML = '<span data-kind="text" title="Change the text language">Text: ' + l.text.toUpperCase() + '</span>' +
              '<span data-kind="voice" title="Change the voice language">Voice: ' + (l.voice === 'none' ? '—' : l.voice.toUpperCase()) + '</span>';
            el.querySelectorAll('.langs span').forEach(c => c.addEventListener('click', e => { e.stopPropagation(); openSheet(g, c.dataset.kind); }));
          }
        } catch (e) {}
        root.appendChild(el);
      }
      const g = games.find(x => x.id === sel) || games[0];
      $('settings-title').textContent = 'Settings: ' + g.title;
      // the barrier is only in Gothic 1
      document.querySelectorAll('#settings-panel .g1only').forEach(e => { e.style.display = g.id === 1 ? '' : 'none'; });
      load();
      applyDownload();
      // the phone is searched after the start: the cards show it and update when it is done
      clearInterval(scanTimer);
      if (scanning) scanTimer = setInterval(() => { if (!Launcher.scanning()) { clearInterval(scanTimer); refresh(); } }, 500);
    }

    // ---- the download runs in the background: the card of the game shows it (the Play button fills, the title gets
    // the size and the speed), the line goes when the game is installed
    let dlSeen = false, dlLast = { t: 0, done: 0 }, dlSpeed = 0;
    function applyDownload() {
      let st;
      try { st = JSON.parse(Launcher.dlState()); } catch (e) { return; }
      document.querySelectorAll('.game').forEach(el => {
        const mine = st.game === +el.dataset.id && (st.running || st.error);
        const info = el.querySelector('.dl-info'), play = el.querySelector('.play'), path = el.querySelector('.path');
        const dl = el.querySelector('.dl');
        if (dl) dl.disabled = !!st.running;
        if (!mine) { info.style.display = 'none'; play.classList.remove('busy'); play.style.background = ''; return; }
        if (st.running) {
          const now = performance.now();
          if (dlLast.t && st.done >= dlLast.done) {
            const inst = (st.done - dlLast.done) / ((now - dlLast.t) / 1000);
            dlSpeed = dlSpeed ? dlSpeed * 0.7 + inst * 0.3 : inst;
          }
          dlLast = { t: now, done: st.done };
          const pct = st.total ? Math.min(100, st.done * 100 / st.total) : 0;
          play.classList.add('busy');
          play.style.background = 'linear-gradient(to right, #fff ' + pct + '%, #000 ' + pct + '%)';
          info.style.display = 'flex';
          info.querySelector('.dl-text').textContent = mb(st.done) + ' of ' + mb(st.total) + '  ·  ' + (dlSpeed / 1048576).toFixed(1) + ' MB/s';
        } else {
          info.style.display = 'none';
          play.classList.remove('busy'); play.style.background = '';
          path.className = 'path err'; path.textContent = st.error;
        }
      });
    }
    setInterval(() => {
      let st;
      try { st = JSON.parse(Launcher.dlState()); } catch (e) { return; }
      if (st.running) { dlSeen = true; applyDownload(); }
      else if (dlSeen) { dlSeen = false; dlLast = { t: 0, done: 0 }; dlSpeed = 0; if (st.error) applyDownload(); else refresh(); }
    }, 500);

    // ---- delete of a game downloaded from the PC (asks first)
    function confirmDelete(g) {
      const sheet = $('sheet'), box = $('sheet-box');
      box.innerHTML = '<h2>Delete ' + g.title + '?</h2>' +
        '<div class="msg">The game downloaded from the PC is removed from the phone (' + g.path.replace(/</g, '&lt;') + '), with its savegames and settings. It can be downloaded again.</div>' +
        '<button class="go" id="del-yes" style="background:#e5484d;color:#fff">Delete</button><button class="sec" id="del-no">Cancel</button>';
      sheet.classList.add('open');
      $('del-no').addEventListener('click', () => sheet.classList.remove('open'));
      $('del-yes').addEventListener('click', () => { sheet.classList.remove('open'); Launcher.deleteGame(g.id); });
    }

    // ---- the sheet of the downloads: a whole game from the PC (Gothic_Dev), or one language of a downloaded game
    const sheet = $('sheet'), box = $('sheet-box');
    const ICON_RELOAD = '<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>';
    sheet.addEventListener('click', e => { if (e.target === sheet) sheet.classList.remove('open'); });
    let cur = null;   // {g, kind: 'all' | 'text' | 'voice'}
    function openSheet(g, kind) {
      cur = { g, kind };
      const head = kind === 'all' ? ['Download ' + g.title, 'The game and its languages from the PC in your network'] :
                   kind === 'text' ? ['Text language', g.title + ': the other languages stay as they are'] :
                                     ['Voice language', g.title + ': the other languages stay as they are'];
      box.innerHTML = '<div class="sh-head"><h2></h2><p></p></div>' +
        '<div><div class="sh-label">Server</div><div class="field-row">' +
          '<input type="text" id="srv" readonly autocapitalize="off" autocorrect="off" spellcheck="false">' +
          '<button class="ib" id="srv-lock" title="Unlock the link">' + ICON_LOCK + '</button>' +
          '<button class="ib" id="srv-reset" title="Reset the link">' + ICON_RELOAD + '</button></div></div>' +
        '<div id="sbody"></div><button class="link" id="x">Close</button>';
      box.querySelector('h2').textContent = head[0];
      box.querySelector('p').textContent = head[1];
      const srv = $('srv');
      srv.value = Launcher.server();
      let locked = true;
      const setLock = on => { locked = on; srv.readOnly = on; $('srv-lock').innerHTML = on ? ICON_LOCK : ICON_UNLOCK; $('srv-lock').title = on ? 'Unlock the link' : 'Lock the link'; };
      $('srv-lock').addEventListener('click', () => {
        if (locked) { setLock(false); srv.focus(); }
        else { setLock(true); Launcher.setServer(srv.value); connect(); }
      });
      srv.addEventListener('change', () => Launcher.setServer(srv.value));
      $('srv-reset').addEventListener('click', () => { srv.value = Launcher.resetServer(); setLock(true); connect(); });
      $('x').addEventListener('click', () => sheet.classList.remove('open'));
      sheet.classList.add('open');
      connect();
    }
    function connect() {
      $('sbody').innerHTML = '<div class="msg">Connecting to ' + Launcher.server().replace(/</g, '&lt;') + ' <span class="dots"></span></div>';
      Launcher.fetchIndex(cur.g.id);
    }
    window.onIndex = (id, r) => {
      if (!cur || id !== cur.g.id || !sheet.classList.contains('open') || !$('sbody')) return;
      if (r.error) {
        $('sbody').innerHTML = '<div class="msg err">' + r.error.replace(/</g, '&lt;') + '</div><div class="msg">Check the link and that the PC is in the same network (python3 web/serve.py 8322 --lan).</div>';
        return;
      }
      const kind = cur.kind;
      let prev = null;
      try { prev = JSON.parse(Launcher.langs(id)); } catch (e) {}
      const opt = l => '<option value="' + l.id + '">' + l.name + '</option>';
      const voiceOpts = '<option value="none">Without</option>' + r.langs.filter(l => l.hasVoice).map(opt).join('');
      // the size is above the languages
      let html = '<div class="size"><b id="size-n"></b><span id="size-d"></span></div><div class="pick">';
      if (kind !== 'voice') html += '<div class="row"><span>Text</span><select id="l-text">' + r.langs.map(opt).join('') + '</select></div>';
      if (kind !== 'text') html += '<div class="row"><span>Voice</span><select id="l-voice">' + voiceOpts + '</select></div>';
      html += '</div><button class="go" id="go"></button>';
      $('sbody').innerHTML = html;
      const lt = $('l-text'), lv = $('l-voice');
      if (lt) lt.value = prev ? prev.text : (r.langs.find(l => l.id === 'ru') || r.langs[0]).id;
      if (lv) lv.value = prev ? prev.voice : ((r.langs.find(l => l.id === 'ru' && l.hasVoice) || {}).id || 'none');
      const info = () => {
        const t = lt ? r.langs.find(l => l.id === lt.value) : null;
        const v = lv && lv.value !== 'none' ? r.langs.find(l => l.id === lv.value) : null;
        const parts = [];
        let n = 0;
        if (kind === 'all') { n += r.base; parts.push('game ' + mb(r.base)); }
        if (t) { n += t.text; parts.push('text ' + mb(t.text)); }
        if (v) { n += v.voice; parts.push('voice ' + mb(v.voice)); }
        else if (lv) parts.push('no voice');
        $('size-n').textContent = n ? mb(n) : '0 MB';
        $('size-d').textContent = parts.join('  ·  ');
        $('go').textContent = kind === 'all' ? 'Download' : (lv && lv.value === 'none' ? 'Remove the voice' : 'Install');
      };
      if (lt) lt.addEventListener('change', info);
      if (lv) lv.addEventListener('change', info);
      info();
      $('go').addEventListener('click', () => {
        const text = kind === 'voice' ? '' : lt.value;
        const voice = kind === 'text' ? '' : lv.value;
        if (!Launcher.download(id, text, voice)) return;
        // the menu closes, the card of the game shows the progress
        sheet.classList.remove('open');
        dlSeen = true; dlLast = { t: 0, done: 0 }; dlSpeed = 0;
        applyDownload();
      });
    };

    // settings: the same elements as on the site's page, read and written to the game's Gothic.ini by the app
    const panel = $('settings-panel');
    const inputs = panel.querySelectorAll('[data-set]');
    const fpsSlider = $('fps-limit'), fpsOut = $('fps-limit-val');
    fpsSlider.max = '120';
    function showFps() { fpsOut.textContent = +fpsSlider.value >= +fpsSlider.max ? 'max' : fpsSlider.value; }
    function load() {
      panel.classList.remove('disabled');
      $('settings-note').textContent = 'Saved in the game folder (Gothic.ini); applied when the game starts.';
      const fl = Launcher.get('fpsLimit');
      fpsSlider.value = String(fl > 0 ? Math.min(fl, +fpsSlider.max) : +fpsSlider.max);
      showFps();
      inputs.forEach(el => {
        const v = Launcher.get(el.dataset.set);
        if (el.type === 'checkbox') el.checked = v !== 0;
        else if (el.dataset.set === 'barrierVol') el.value = String(v < 20 ? 100 : v);
        else el.value = String(v);
      });
      // a preset is lit while all of its values are set (the values may come from another place: the game's own menu, a copied file)
      document.querySelectorAll('#gfx-presets [data-preset]').forEach(b => {
        const p = PRESETS[b.dataset.preset];
        b.classList.toggle('active', Object.keys(p).every(k => Launcher.get(k) === p[k]));
      });
    }
    fpsSlider.addEventListener('input', showFps);
    fpsSlider.addEventListener('change', () => Launcher.set('fpsLimit', +fpsSlider.value >= +fpsSlider.max ? 0 : +fpsSlider.value));
    inputs.forEach(el => el.addEventListener('change', () => {
      Launcher.set(el.dataset.set, el.type === 'checkbox' ? (el.checked ? 1 : 0) : parseInt(el.value, 10));
      load();
    }));
    const PRESETS = {
        ultralow: { sun: 1, fog: 1, shadows: 0, drawDist: 4, worldDist: 30,  waterQuality: 1, waterPhysics: 0, reflections: 0, ssao: 0, skipFarAnim: 1, blood: 0, resScale: 1, texQuality: 1 },
        low:      { sun: 1, fog: 1, shadows: 3, drawDist: 3, worldDist: 100, waterQuality: 1, waterPhysics: 0, reflections: 0, ssao: 0, skipFarAnim: 1, blood: 0, resScale: 0, texQuality: 0 },
        classic:  { sun: 1, fog: 1, shadows: 3, drawDist: 2, worldDist: 200, waterQuality: 1, waterPhysics: 0, reflections: 0, ssao: 0, blood: 1, resScale: 0, texQuality: 0 },
        ultra:    { sun: 0, fog: 0, shadows: 2, drawDist: 0, worldDist: 0,   waterQuality: 2, waterPhysics: 1, reflections: 0, ssao: 1, skipFarAnim: 0, blood: 1, resScale: 0, texQuality: 0 },
      };
    $('gfx-presets').addEventListener('click', e => {
      const b = e.target.closest('[data-preset]');
      if (!b) return;
      const p = PRESETS[b.dataset.preset];
      for (const k in p) Launcher.set(k, p[k]);
      load();
    });
    $('log-show').addEventListener('click', () => {
      const l = $('log');
      if (l.style.display === 'block') { l.style.display = 'none'; return; }
      l.textContent = Launcher.log(); l.style.display = 'block';
    });
    $('log-copy').addEventListener('click', () => Launcher.copyLog());
    window.onResumed = () => refresh();
    refresh();
  </script>
</body>
</html>
