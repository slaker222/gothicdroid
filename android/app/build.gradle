plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def versionFile = new File(project.rootDir, "version.txt")
def appVersionName = versionFile.exists() ? versionFile.text.trim() : "0.01"
// 0.38 -> 38, 1.02 -> 102: a newer version always has a bigger code (Android updates over the old app)
def appVersionCode = { def p = appVersionName.tokenize('.'); (p[0] as int) * 100 + (p.size() > 1 ? (p[1] as int) : 0) }()

android {
    namespace 'com.opengothic'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.gothic.droid"
        minSdk 29
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            jniDebuggable true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        // the adrenotools hook libs must be real files in nativeLibraryDir
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.games:games-activity:3.0.5'
}
